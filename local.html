<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commune profile — BelPulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
// Apply the saved theme and language BEFORE first paint, so the page never
// flashes the wrong palette. Kept inline and tiny for that reason.
(function(){
  try{
    var t = localStorage.getItem('belpulse-theme');
    if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var l = localStorage.getItem('belpulse-lang');
    if(l) document.documentElement.setAttribute('lang', l);
  }catch(e){ /* localStorage throws in private mode; the defaults are fine */ }
})();
</script>
<style>
  :root{
    --bg:#f7f5f0; --surface:#ffffff; --surface-2:#fbfaf6;
    --border:#e6e0d3; --border-strong:#d3cab6;
    --text:#241f18; --text-muted:#6e6558; --text-faint:#948a76;
    --accent:#a8722f; --accent-soft:#f3e7d5; --accent-ink:#7a4f16;
    --good:#3f7d5c; --good-soft:#e2efe7;
    --warn:#b9762a; --warn-soft:#f6e9d6;
    --focus-ring:#a8722f;
    --chart-grid:rgba(0,0,0,.07); --chart-label:#948a76;
    --chart-line:#a8722f; --chart-fill:rgba(168,114,47,.10); --chart-dot:#7a4f16;
    --shadow:0 1px 2px rgba(36,31,24,.04), 0 4px 16px rgba(36,31,24,.05);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150f; --surface:#211e17; --surface-2:#1c1913;
      --border:#37322a; --border-strong:#4a4438;
      --text:#efe9db; --text-muted:#aba190; --text-faint:#7d7462;
      --accent:#d9a05c; --accent-soft:#3a2e1d; --accent-ink:#f2d7ae;
      --good:#6fbf94; --good-soft:#1f2f26;
      --warn:#e0a355; --warn-soft:#332818;
      --focus-ring:#d9a05c;
      --chart-grid:rgba(255,255,255,.07); --chart-label:#aba190;
      --chart-line:#d9a05c; --chart-fill:rgba(217,160,92,.12); --chart-dot:#f2d7ae;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17150f; --surface:#211e17; --surface-2:#1c1913;
    --border:#37322a; --border-strong:#4a4438;
    --text:#efe9db; --text-muted:#aba190; --text-faint:#7d7462;
    --accent:#d9a05c; --accent-soft:#3a2e1d; --accent-ink:#f2d7ae;
    --good:#6fbf94; --good-soft:#1f2f26;
    --warn:#e0a355; --warn-soft:#332818;
    --focus-ring:#d9a05c;
    --chart-grid:rgba(255,255,255,.07); --chart-label:#aba190;
    --chart-line:#d9a05c; --chart-fill:rgba(217,160,92,.12); --chart-dot:#f2d7ae;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft)}
  a{color:var(--accent-ink)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px 90px}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 0 22px;flex-wrap:wrap;
  }
  .brand{
    font-family:"Spectral",Georgia,serif;font-weight:600;font-size:1.05rem;
    letter-spacing:-.01em;color:var(--text);text-decoration:none;
  }
  .brand span{color:var(--accent)}
  .switches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .seg{
    display:flex;gap:1px;background:var(--border);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;
  }
  .seg button{
    appearance:none;border:none;cursor:pointer;font:inherit;font-size:.75rem;
    padding:5px 11px;background:var(--surface);color:var(--text-muted);line-height:1.35;
  }
  .seg button:hover{background:var(--accent-soft);color:var(--accent-ink)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .seg button:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-2px}

  /* ── search ──────────────────────────────────────────── */
  .lede h1{
    font-family:"Spectral",Georgia,serif;font-weight:600;font-size:2.1rem;
    margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance;
  }
  .lede p{color:var(--text-muted);max-width:60ch;margin:0 0 22px}
  #searchInput{
    width:100%;font:inherit;font-size:1.05rem;padding:14px 16px;
    border-radius:var(--radius);border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  }
  #searchInput:focus{outline:2px solid var(--focus-ring);outline-offset:1px}
  #searchResults:not(:empty){
    margin-top:10px;border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;background:var(--surface);box-shadow:var(--shadow);
  }
  .result-row{
    padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  .result-row:last-child{border-bottom:none}
  .result-row:hover{background:var(--accent-soft)}
  .result-row .rmeta{
    font-size:.76rem;color:var(--text-faint);
    font-family:"IBM Plex Mono",monospace;white-space:nowrap;
  }
  .browse{margin-top:26px}
  .crumb{font-size:.84rem;color:var(--text-muted);margin-bottom:10px}
  .crumb button{background:none;border:none;color:var(--accent-ink);cursor:pointer;font:inherit;padding:0}
  .crumb button:hover{text-decoration:underline}
  .crumb .sep{color:var(--text-faint);margin:0 5px}
  .tree-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .tree-item{
    padding:10px 13px;border:1px solid var(--border);border-radius:8px;
    background:var(--surface);cursor:pointer;font-size:.88rem;transition:.12s;
  }
  .tree-item:hover{background:var(--accent-soft);border-color:var(--border-strong)}

  /* ── commune hero ────────────────────────────────────── */
  #communePage{display:none}
  .back{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;
    font-size:.85rem;color:var(--text-muted);cursor:pointer;background:none;
    border:none;font-family:inherit;padding:0;
  }
  .back:hover{color:var(--accent-ink)}
  .hero{
    border:1px solid var(--border);border-radius:14px;background:var(--surface);
    padding:26px 28px;box-shadow:var(--shadow);margin-bottom:26px;
  }
  .hero h1{
    font-family:"Spectral",Georgia,serif;font-weight:600;font-size:2.5rem;
    margin:0 0 4px;letter-spacing:-.025em;line-height:1.1;
  }
  .hero .alt{color:var(--text-faint);font-size:.92rem;margin-bottom:2px}
  .hero .path{color:var(--text-muted);font-size:.88rem}
  .hero .path .nis{
    font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--text-faint);
    background:var(--surface-2);border:1px solid var(--border);
    padding:1px 7px;border-radius:5px;margin-left:8px;
  }

  .headline{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));
    gap:12px;margin-top:22px;
  }
  .card{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-height:104px;
  }
  .card .v{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:1.55rem;font-weight:500;letter-spacing:-.02em;line-height:1.15;
  }
  .card .l{font-size:.73rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint)}
  .card .rk{font-size:.74rem;color:var(--accent-ink)}
  .card .p{font-size:.72rem;color:var(--text-faint);margin-top:auto;font-family:"IBM Plex Mono",monospace}
  .card.nodata{background:transparent;border-style:dashed}
  .card.nodata .v{
    color:var(--text-faint);font-size:.9rem;font-family:inherit;
    font-weight:400;font-style:italic;
  }

  /* ── sections ────────────────────────────────────────── */
  section.block{margin-bottom:34px;scroll-margin-top:16px}
  section.block h2{
    font-family:"Spectral",Georgia,serif;font-size:1.4rem;font-weight:600;
    margin:0 0 3px;letter-spacing:-.015em;
  }
  section.block .blurb{font-size:.88rem;color:var(--text-muted);margin-bottom:16px;max-width:62ch}
  .panel{
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);padding:18px 20px;box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:12px;margin-bottom:12px;flex-wrap:wrap;
  }
  .panel-head .t{font-weight:600;font-size:.95rem}
  .panel-head .v{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:1.3rem;font-weight:500;
  }
  canvas.series{display:block;width:100%}

  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
  .fact{
    border:1px solid var(--border);border-radius:9px;padding:11px 13px;background:var(--surface-2);
  }
  .fact .fv{
    font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:1.1rem;font-weight:500;
  }
  .fact .fl{font-size:.76rem;color:var(--text-muted);margin-top:1px;line-height:1.35}
  .fact .frank{font-size:.72rem;color:var(--accent-ink);margin-top:4px}
  .fact .fp{font-size:.68rem;color:var(--text-faint);font-family:"IBM Plex Mono",monospace;margin-top:2px}

  .no-data{
    border:1px dashed var(--border-strong);border-radius:var(--radius);
    padding:18px 20px;color:var(--text-muted);font-size:.9rem;background:var(--surface-2);
  }
  .no-data .why{display:block;margin-top:5px;font-size:.8rem;color:var(--text-faint);max-width:70ch}

  /* comparison */
  .cmp{width:100%;border-collapse:collapse;margin-top:14px;font-size:.85rem}
  .cmp th{
    text-align:left;font-size:.69rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--text-faint);font-weight:500;padding:5px 9px;border-bottom:1px solid var(--border);
  }
  .cmp td{padding:6px 9px;border-bottom:1px solid var(--border)}
  .cmp tr:last-child td{border-bottom:none}
  .cmp tr.self td{font-weight:600;background:var(--accent-soft)}
  .cmp tr.peer td{background:var(--surface-2)}
  .cmp td.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .cmp td.cov{font-size:.72rem;color:var(--text-faint);font-family:"IBM Plex Mono",monospace;text-align:right}
  .cmp caption{
    caption-side:bottom;text-align:left;font-size:.72rem;color:var(--text-faint);
    padding-top:8px;line-height:1.5;
  }
  .chip-x{
    appearance:none;border:none;background:none;cursor:pointer;color:var(--text-faint);
    font-size:.9rem;line-height:1;margin-left:6px;padding:0 2px;vertical-align:middle;
  }
  .chip-x:hover{color:var(--accent-ink)}

  /* the free four-commune picker (Block L) */
  .compare-picker{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
  .compare-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
  .compare-chips:empty{margin-bottom:0}
  .chip{
    display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);
    color:var(--accent-ink);border-radius:99px;padding:4px 6px 4px 12px;font-size:.82rem;
  }
  .chip button{
    appearance:none;border:none;background:none;cursor:pointer;color:inherit;
    font-size:1rem;line-height:1;padding:2px 6px;
  }
  .compare-add{position:relative;max-width:340px}
  .compare-add input{
    width:100%;font:inherit;font-size:.85rem;padding:8px 12px;border-radius:8px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  }
  .compare-add input:focus{outline:2px solid var(--focus-ring);outline-offset:1px}
  #compareResults:not(:empty){
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:5;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);
    box-shadow:var(--shadow);overflow:hidden;max-height:220px;overflow-y:auto;
  }
  .pctile{margin-top:12px;display:flex;flex-direction:column;gap:4px}
  .pctile .line{font-size:.85rem}
  .pctile .line b{font-weight:600}
  .pctile .note{color:var(--text-faint);font-size:.75rem}

  /* Statbel attribution. A LICENCE CONDITION, not decoration -- clause 6 of
     Statbel's 2015 open-data licence terminates the grant automatically if it
     is missing. See docs/data_catalog.md. Never hide or collapse this. */
  .attribution{
    margin-top:30px;padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface-2);color:var(--text-muted);font-size:.77rem;line-height:1.65;
  }
  .attribution strong{color:var(--text)}
  .attribution a{color:var(--accent-ink)}
  footer{margin-top:18px;color:var(--text-faint);font-size:.78rem}

  @media (max-width:640px){
    body{font-size:14px}
    .wrap{padding:0 15px 70px}
    .hero{padding:20px 18px}
    .hero h1{font-size:1.85rem}
    .lede h1{font-size:1.6rem}
    .panel{padding:15px 14px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="brand" href="index.html">Bel<span>Pulse</span></a>
    <div class="switches">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="nl" aria-pressed="false">NL</button>
      </div>
      <div class="seg theme-toggle" id="themeSeg" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">&#9728;</button>
        <button type="button" data-theme-choice="auto" aria-pressed="false">Auto</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">&#9790;</button>
      </div>
    </div>
  </div>

  <div id="searchPanel">
    <div class="lede">
      <h1 data-t="searchTitle"></h1>
      <p data-t="searchLede"></p>
    </div>
    <input id="searchInput" type="text" autocomplete="off">
    <div id="searchResults"></div>
    <div class="browse" id="browseTree"></div>
  </div>

  <div id="communePage">
    <button class="back" id="backLink" type="button">&larr; <span data-t="back"></span></button>

    <div class="hero">
      <h1 id="cTitle">—</h1>
      <div class="alt" id="cAlt"></div>
      <div class="path" id="cPath"></div>
      <div class="headline" id="headline"></div>
      <div class="compare-picker" id="comparePicker">
        <div class="compare-chips" id="compareChips"></div>
        <div class="compare-add" id="compareAdd"></div>
      </div>
    </div>

    <div id="sections"></div>

    <div class="attribution" id="attribution"></div>
    <footer id="pageFooter"></footer>
  </div>

</div>

<script>

LocalUI.t = function(lang, key, vars){
  const table = LocalUI.STRINGS[lang] || LocalUI.STRINGS[LocalUI.DEFAULT_LANG];
  let s = table[key] !== undefined ? table[key] : (LocalUI.STRINGS[LocalUI.DEFAULT_LANG][key] || key);
  for(const k in (vars || {})) s = s.split('{' + k + '}').join(vars[k]);
  return s;
};

// A name object carries all three languages. Falls back to English rather
// than to the raw id: a French reader would rather see the English name than
// POP_FOREIGN_NATIONALS.
LocalUI.localName = function(names, lang, fallback){
  if(!names) return fallback || '';
  return names[lang] || names.en || fallback || '';
};

LocalUI.matchesQuery = function(geo, q){
  if(!q) return true;
  q = q.toLowerCase();
  return geo.nis_code.includes(q)
    || LocalUI.LANGS.some(l => (geo.name[l] || '').toLowerCase().includes(q));
};

LocalUI.searchCommunes = function(geographies, q, limit){
  limit = limit || 25;
  return geographies
    .filter(g => g.level === 'municipality' && LocalUI.matchesQuery(g, q))
    .sort((a,b) => a.name.en.localeCompare(b.name.en))
    .slice(0, limit);
};

LocalUI.childrenOf = function(geographies, parentId){
  return geographies.filter(g => g.parent_geo_id === parentId)
    .sort((a,b) => a.name.en.localeCompare(b.name.en));
};

LocalUI.ancestorChain = function(geographies, geoId){
  const byId = new Map(geographies.map(g => [g.geo_id, g]));
  const chain = []; let current = byId.get(geoId); const seen = new Set();
  while(current && !seen.has(current.geo_id)){
    seen.add(current.geo_id); chain.unshift(current);
    current = current.parent_geo_id ? byId.get(current.parent_geo_id) : null;
  }
  return chain;
};

LocalUI.latestOf = function(entry){
  if(!entry) return null;
  const periods = Object.keys(entry.periods || {}).sort();
  if(!periods.length) return null;
  const p = periods[periods.length - 1];
  // `updated` is the source retrieval date and is absent for a derived
  // indicator, which was computed rather than fetched. Passed through as
  // undefined rather than substituted: Statbel's licence forbids misleading
  // a reader about the update date as squarely as it requires showing one.
  return {
    value: entry.periods[p].value, period: p, unit: entry.unit,
    names: entry.names, updated: entry.updated,
  };
};

LocalUI.lastUpdated = function(commune){
  const dates = Object.values(commune.indicators || {}).map(i => i.updated).filter(Boolean).sort();
  return dates.length ? dates[dates.length - 1] : null;
};

// The headline row. All six of the roadmap's figures are real as of the
// Census 2021 employment-status and real-estate loads -- unemployment and
// house price were the two structural gaps until then. Each still renders
// as an honest gap on a commune with no value for a given year (a `key`
// with no data falls through to `noValue` below), which is different from
// the two being absent from the whole pipeline.
LocalUI.HEADLINE_SPEC = [
  {key: 'POPULATION_BY_COMMUNE'},
  {key: 'POPULATION_CHANGE_5Y'},
  {key: 'AVG_NET_TAXABLE_INCOME'},
  {key: 'LOCAL_UNITS_BY_COMMUNE'},
  {key: 'UNEMPLOYMENT_RATE_COM'},
  {key: 'AVG_HOUSE_PRICE'},
];

LocalUI.buildHeadlines = function(commune, lang){
  lang = lang || LocalUI.DEFAULT_LANG;
  return LocalUI.HEADLINE_SPEC.map(spec => {
    if(!spec.key){
      return {label: LocalUI.t(lang, spec.labelKey), available: false, why: LocalUI.t(lang, spec.whyKey)};
    }
    const entry = commune.indicators[spec.key];
    const latest = LocalUI.latestOf(entry);
    const label = LocalUI.localName(entry && entry.names, lang, spec.key);
    if(!latest) return {label: label, available: false, why: LocalUI.t(lang, 'noValue')};
    return {
      label: label, available: true, value: latest.value, period: latest.period,
      unit: latest.unit, updated: latest.updated, entry: entry,
    };
  });
};

// The free four-commune picker (Block L). `opts.peers` is up to three
// OTHER loaded commune payloads (the primary commune plus these is the
// roadmap's "up to four"); `opts.indicatorId` is which of their indicators
// to compare -- required because a peer commune's payload holds all of its
// indicators, not just this one section's.
//
// A peer's relation is a DIFFERENCE from the primary commune's own value,
// never a share: unlike a province, a peer commune is not a container the
// primary commune is part of, so "Ghent is 12% higher than this commune"
// is the meaningful relation regardless of whether the indicator is
// additive. That is a real behavioural difference from the aggregate rows
// below, which is exactly why it is computed separately rather than reusing
// the additive/non-additive branch.
LocalUI.peerRows = function(entry, own, lang, peers, indicatorId){
  if(!peers || !peers.length || !indicatorId) return [];
  const out = [];
  for(const peer of peers){
    const peerEntry = peer.indicators && peer.indicators[indicatorId];
    const latest = LocalUI.latestOf(peerEntry);
    if(!latest) continue;
    out.push({
      scope: 'peer', label: LocalUI.localName(peer.name, lang), nis: peer.nis_code,
      value: latest.value, period: latest.period,
      relation: (own === null || own === 0 || latest.value === null)
        ? null : {kind: 'diff', pct: (latest.value / own - 1) * 100},
    });
  }
  return out;
};

LocalUI.comparisonRows = function(entry, lang, opts){
  lang = lang || LocalUI.DEFAULT_LANG;
  opts = opts || {};
  if(!entry) return [];
  const periods = Object.keys(entry.periods || {}).sort();
  if(!periods.length) return [];
  const period = periods[periods.length - 1];
  const own = entry.periods[period].value;
  const rows = [{scope: 'commune', label: LocalUI.t(lang, 'thisCommune'), value: own, period: period}];
  rows.push(...LocalUI.peerRows(entry, own, lang, opts.peers, opts.indicatorId));
  for(const scope of ['province', 'region', 'country']){
    const agg = (entry.comparison || {})[scope];
    if(!agg) continue;
    const row = {
      scope: scope, label: LocalUI.t(lang, scope),
      name: LocalUI.localName(agg.name, lang),
      value: agg.value, period: agg.period, coverage: agg.coverage,
    };
    // WHICH RELATION MEANS SOMETHING depends on the indicator. For a count
    // the commune is PART of the reference, so a difference is true and
    // useless -- every commune is "below" its province, and a tiny one reads
    // -100% against everything. For a ratio the two sit on the same scale
    // and the difference is what a reader wants.
    if(agg.value === 0 || agg.value === null || own === null) row.relation = null;
    else if(entry.additive) row.relation = {kind: 'share', pct: own / agg.value * 100};
    else row.relation = {kind: 'diff', pct: (own / agg.value - 1) * 100};
    rows.push(row);
  }
  return rows;
};

LocalUI.ordinal = function(n, lang){
  if(lang === 'fr') return n === 1 ? '1er' : n + 'e';
  if(lang === 'nl') return n + 'e';
  const m = n % 100;
  if(m >= 11 && m <= 13) return n + 'th';
  return n + ({1:'st',2:'nd',3:'rd'}[n % 10] || 'th');
};

LocalUI.percentileLines = function(entry, lang){
  lang = lang || LocalUI.DEFAULT_LANG;
  const pos = entry && entry.percentile;
  if(!pos) return [];
  const out = [];
  for(const scope of ['national', 'regional']){
    const p = pos[scope];
    if(!p) continue;
    const where = scope === 'national'
      ? LocalUI.t(lang, 'inBelgium')
      : LocalUI.t(lang, 'inRegion', {r: p.scope_name});
    if(p.pct === null || p.pct === undefined){
      out.push({
        text: LocalUI.t(lang, 'rankOf', {o: LocalUI.ordinal(p.rank, lang), n: p.peers, w: where}),
        note: LocalUI.t(lang, 'tooFew', {n: p.peers}), period: p.period,
      });
    } else if(p.rank === 1 || p.rank === p.peers){
      // The extremes must not be stated as a percentile: under the rank
      // definition the highest of 565 scores 99.91 and the lowest 0.09,
      // which round to "100th" and "0th" -- positions nobody can occupy.
      out.push({
        text: LocalUI.t(lang, p.rank === 1 ? 'highestOf' : 'lowestOf', {n: p.peers, w: where}),
        note: LocalUI.t(lang, 'percentileIs', {p: p.pct.toFixed(1)}), period: p.period,
      });
    } else {
      // Clamped to 1..99 for the same reason: 99.6 must not round up into a
      // percentile nobody can occupy.
      const shown = Math.min(99, Math.max(1, Math.round(p.pct)));
      out.push({
        text: LocalUI.t(lang, 'percentileOf', {o: LocalUI.ordinal(shown, lang), w: where}),
        note: LocalUI.t(lang, 'ofCommunes', {o: LocalUI.ordinal(p.rank, lang), n: p.peers}),
        period: p.period,
      });
    }
  }
  return out;
};

// A one-line version for a fact tile. The full component is used under each
// section's headline figure; a table per figure would be a wall nobody reads.
LocalUI.percentileShort = function(entry, lang){
  lang = lang || LocalUI.DEFAULT_LANG;
  const p = entry && entry.percentile && entry.percentile.national;
  if(!p) return null;
  const where = LocalUI.t(lang, 'inBelgium');
  if(p.pct === null || p.pct === undefined)
    return LocalUI.t(lang, 'rankOf', {o: LocalUI.ordinal(p.rank, lang), n: p.peers, w: where});
  if(p.rank === 1) return LocalUI.t(lang, 'highestOf', {n: p.peers, w: where});
  if(p.rank === p.peers) return LocalUI.t(lang, 'lowestOf', {n: p.peers, w: where});
  const shown = Math.min(99, Math.max(1, Math.round(p.pct)));
  return LocalUI.t(lang, 'percentileOf', {o: LocalUI.ordinal(shown, lang), w: where})
    + ' (' + LocalUI.ordinal(p.rank, lang) + '/' + p.peers + ')';
};

LocalUI.MAX_PEERS = 3;

// Parses the `vs` URL parameter into a list of peer NIS codes: capped at
// MAX_PEERS, deduplicated, and never containing the primary commune's own
// code (comparing a commune to itself is not a peer comparison).
LocalUI.parseVsParam = function(raw, primaryNis){
  if(!raw) return [];
  const seen = new Set();
  const out = [];
  for(const nis of raw.split(',').map(s => s.trim()).filter(Boolean)){
    if(nis === primaryNis || seen.has(nis)) continue;
    seen.add(nis);
    out.push(nis);
    if(out.length >= LocalUI.MAX_PEERS) break;
  }
  return out;
};

if(typeof module !== 'undefined') module.exports = LocalUI;
</script>

<script>
// ── rendering (browser only) ───────────────────────────────────────────────
let GEOGRAPHIES = [], SECTIONS = [], COMMUNE = null;
let VS_NIS = [], VS_COMMUNES = [];  // the free four-commune picker: up to 3 peers alongside COMMUNE
let LANG = 'en', browseCurrentId = null;

const LOCALES = {en: 'en-GB', fr: 'fr-BE', nl: 'nl-BE'};

function fmt(value, unit){
  if(value === null || value === undefined || isNaN(value)) return '—';
  const loc = LOCALES[LANG] || 'en-GB';
  const body = value.toLocaleString(loc, {maximumFractionDigits: unit === 'count' ? 0 : 2});
  if(unit === 'eur') return '€' + body;
  if(unit && unit.startsWith('percent')) return body + ' %';
  return body;
}
function T(key, vars){ return LocalUI.t(LANG, key, vars); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function noDataHTML(why){ return `<div class="no-data">${T('noData')}<span class="why">${esc(why)}</span></div>`; }
function gc(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ── chart ──────────────────────────────────────────────────────────────────
function niceSteps(mn, mx, n){
  const rg = mx - mn || 1, ro = rg / n, mg = Math.pow(10, Math.floor(Math.log10(ro)));
  const rs = ro / mg, ni = rs <= 1.5 ? mg : rs <= 3 ? 2*mg : rs <= 7 ? 5*mg : 10*mg;
  const steps = []; let v = Math.ceil(mn / ni) * ni;
  while(v <= mx){ steps.push(parseFloat(v.toFixed(4))); v += ni; }
  return steps;
}

function drawSeries(canvas, points){
  const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth, H = 210;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);

  const vals = points.map(p => p.value);
  let vMin = Math.min(...vals), vMax = Math.max(...vals);
  // Pad, so a flat or near-flat series does not render pinned to one edge.
  const pad = (vMax - vMin) * 0.15 || Math.abs(vMax || 1) * 0.05;
  vMin -= pad; vMax += pad;
  const vR = (vMax - vMin) || 1;
  const pL = 62, pR = 10, pT = 12, pB = 26, n = points.length;
  const cW = W - pL - pR, slW = n > 1 ? cW / (n - 1) : 0;
  const yOf = v => pT + ((vMax - v) / vR) * (H - pT - pB);
  const xOf = i => pL + slW * i;

  const gridC = gc('--chart-grid'), labelC = gc('--chart-label');
  const lineC = gc('--chart-line'), fillC = gc('--chart-fill'), dotC = gc('--chart-dot');

  niceSteps(vMin, vMax, 4).forEach(v => {
    const y = Math.round(yOf(v)) + 0.5;
    ctx.strokeStyle = gridC; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pL, y); ctx.lineTo(W - pR, y); ctx.stroke();
    ctx.font = '10px "IBM Plex Mono",monospace'; ctx.fillStyle = labelC;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(v.toLocaleString(LOCALES[LANG] || 'en-GB', {maximumFractionDigits: 1}), pL - 9, y);
  });

  const xSkip = Math.max(1, Math.ceil(34 / Math.max(slW, 1)));
  ctx.font = '10px "IBM Plex Mono",monospace'; ctx.fillStyle = labelC;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  points.forEach((p,i) => {
    if(i % xSkip === 0 || i === n-1) ctx.fillText(p.period, xOf(i), H - pB + 8);
  });

  if(n > 1){
    ctx.beginPath(); ctx.moveTo(xOf(0), yOf(points[0].value));
    points.forEach((p,i) => ctx.lineTo(xOf(i), yOf(p.value)));
    ctx.lineTo(xOf(n-1), H - pB); ctx.lineTo(xOf(0), H - pB); ctx.closePath();
    ctx.fillStyle = fillC; ctx.fill();
  }

  ctx.beginPath();
  points.forEach((p,i) => i === 0 ? ctx.moveTo(xOf(i), yOf(p.value)) : ctx.lineTo(xOf(i), yOf(p.value)));
  ctx.strokeStyle = lineC; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();

  points.forEach((p,i) => {
    const isLast = i === n-1;
    ctx.beginPath(); ctx.arc(xOf(i), yOf(p.value), isLast ? 4.5 : 2.5, 0, Math.PI*2);
    ctx.fillStyle = isLast ? dotC : lineC; ctx.fill();
  });
}

// ── components ─────────────────────────────────────────────────────────────
function comparisonHTML(entry, indicatorId){
  const rows = LocalUI.comparisonRows(entry, LANG, {peers: VS_COMMUNES, indicatorId: indicatorId});
  if(rows.length < 2) return '';
  const additive = !!entry.additive;
  const hasPeers = rows.some(r => r.scope === 'peer');
  const body = rows.map(r => {
    const label = (r.scope === 'commune' || r.scope === 'peer') ? r.label : `${r.label} — ${esc(r.name)}`;
    let rel = '';
    if(r.relation){
      // A small share must not round to "0.0 %": Herstappe is 0.0086% of
      // Limburg, and printing 0.0 % says something false about a commune
      // that exists.
      const p = r.relation.pct;
      const dp = (p !== 0 && Math.abs(p) < 0.1) ? 4 : 1;
      const nStr = p.toLocaleString(LOCALES[LANG] || 'en-GB', {maximumFractionDigits: dp});
      rel = r.relation.kind === 'share' ? `${nStr} %` : `${p >= 0 ? '+' : ''}${nStr} %`;
    }
    const cov = r.coverage ? `${r.coverage.n}/${r.coverage.of}` : '';
    const rowClass = r.scope === 'commune' ? 'self' : r.scope === 'peer' ? 'peer' : '';
    return `<tr class="${rowClass}">` +
      `<td>${label}${r.scope === 'peer' ? `<button type="button" class="chip-x" data-remove-vs="${r.nis}" title="Remove">&times;</button>` : ''}</td>` +
      `<td class="num">${fmt(r.value, entry.unit)}</td><td class="num">${rel}</td><td class="cov">${cov}</td></tr>`;
  }).join('');
  // Peer rows are always a DIFFERENCE, aggregate rows are a share OR a
  // difference depending on the indicator (see comparisonRows). One shared
  // "Diff/Share" column header covers both since they are both percentages;
  // the caption spells out which is which per row type when peers are
  // present, so the column is never ambiguous to a reader.
  const explain = T(additive ? 'shareNote' : 'diffNote', {p: rows[0].period})
    + (hasPeers ? ' ' + T('peerDiffNote') : '');
  return `<table class="cmp"><caption>${explain} ${T('methodNote')}</caption>
    <thead><tr><th>${T('comparedWith')}</th><th style="text-align:right">${T('value')}</th>
    <th style="text-align:right">${additive ? T('share') : T('diff')}</th><th style="text-align:right">${T('communes')}</th></tr></thead>
    <tbody>${body}</tbody></table>`;
}

function percentileHTML(entry){
  const lines = LocalUI.percentileLines(entry, LANG);
  if(!lines.length) return '';
  return '<div class="pctile">' + lines.map(l =>
    `<div class="line"><b>${esc(l.text)}</b> <span class="note">— ${esc(l.note)}, ${l.period}</span></div>`
  ).join('') + '</div>';
}

function factHTML(entry){
  const latest = LocalUI.latestOf(entry);
  if(!latest) return '';
  const rank = LocalUI.percentileShort(entry, LANG);
  const prov = latest.updated ? `${T('updated')} ${latest.updated}` : T('derived');
  return `<div class="fact"><div class="fv">${fmt(latest.value, latest.unit)}</div>` +
    `<div class="fl">${esc(LocalUI.localName(latest.names, LANG))} (${latest.period})</div>` +
    (rank ? `<div class="frank">${esc(rank)}</div>` : '') +
    `<div class="fp">${prov}</div></div>`;
}

// Sections come from public/data/metadata/sections.json, so this file holds
// no indicator ids -- the 50% gate's "zero indicator-specific frontend logic"
// check, and Block B's premise that adding an indicator is config not code.
function sectionHTML(section){
  const label = esc(LocalUI.localName(section.label, LANG));
  const blurb = section.blurb ? `<div class="blurb">${esc(LocalUI.localName(section.blurb, LANG))}</div>` : '';
  if(section.unavailable){
    return `<section class="block" id="sec-${section.id}"><h2>${label}</h2>${blurb}
      ${noDataHTML(LocalUI.localName(section.unavailable, LANG))}</section>`;
  }

  const head = COMMUNE.indicators[section.headline];
  const latest = LocalUI.latestOf(head);
  let panel;
  if(!latest){
    panel = noDataHTML(T('noHistory'));
  } else {
    const points = Object.keys(head.periods).sort().map(p => ({period: p, value: head.periods[p].value}));
    const chart = points.length > 1 ? `<canvas class="series" data-section="${section.id}"></canvas>` : '';
    panel = `<div class="panel">
      <div class="panel-head">
        <span class="t">${esc(LocalUI.localName(head.names, LANG))}</span>
        <span class="v">${fmt(latest.value, latest.unit)} <span style="font-size:.72rem;color:var(--text-faint);font-weight:400">${T('asOf')} ${latest.period}</span></span>
      </div>${chart}${comparisonHTML(head, section.headline)}${percentileHTML(head)}</div>`;
  }

  const facts = (section.indicators || []).map(id => factHTML(COMMUNE.indicators[id])).filter(Boolean).join('');
  return `<section class="block" id="sec-${section.id}"><h2>${label}</h2>${blurb}${panel}
    ${facts ? `<div class="facts">${facts}</div>` : ''}</section>`;
}

// ── page rendering ─────────────────────────────────────────────────────────
function renderCommune(){
  const c = COMMUNE;
  document.getElementById('searchPanel').style.display = 'none';
  document.getElementById('communePage').style.display = 'block';

  const name = LocalUI.localName(c.name, LANG);
  document.title = name + ' — BelPulse';
  document.getElementById('cTitle').textContent = name;
  const alts = LocalUI.LANGS.filter(l => l !== LANG).map(l => c.name[l]).filter(n => n && n !== name);
  document.getElementById('cAlt').textContent = [...new Set(alts)].join(' · ');
  document.getElementById('cPath').innerHTML =
    esc([c.region, c.province, c.arrondissement].filter(Boolean).join(' › ')) +
    `<span class="nis">NIS ${esc(c.nis_code)}</span>`;

  document.getElementById('headline').innerHTML = LocalUI.buildHeadlines(c, LANG).map(h => {
    if(!h.available)
      return `<div class="card nodata"><span class="v">${T('notAvailable')}</span>
        <span class="l">${esc(h.label)}</span><span class="p">${esc(h.why)}</span></div>`;
    const rank = h.entry ? LocalUI.percentileShort(h.entry, LANG) : null;
    const prov = h.updated ? `${T('asOf')} ${h.period} · ${T('updated')} ${h.updated}`
                           : `${T('asOf')} ${h.period} · ${T('derived')}`;
    return `<div class="card"><span class="v">${fmt(h.value, h.unit)}</span>
      <span class="l">${esc(h.label)}</span>${rank ? `<span class="rk">${esc(rank)}</span>` : ''}
      <span class="p">${prov}</span></div>`;
  }).join('');

  renderComparePicker();

  document.getElementById('sections').innerHTML = SECTIONS.map(sectionHTML).join('');
  document.querySelectorAll('[data-remove-vs]').forEach(b =>
    b.addEventListener('click', () => removePeer(b.dataset.removeVs)));
  requestAnimationFrame(() => {
    document.querySelectorAll('canvas.series').forEach(cv => {
      const section = SECTIONS.find(s => s.id === cv.dataset.section);
      const head = COMMUNE.indicators[section.headline];
      const pts = Object.keys(head.periods).sort().map(p => ({period: p, value: head.periods[p].value}));
      drawSeries(cv, pts);
    });
  });

  document.getElementById('attribution').innerHTML = T('attribution');
  const updated = LocalUI.lastUpdated(c);
  const el = document.getElementById('attrUpdated');
  if(el) el.textContent = updated || '—';
  document.getElementById('pageFooter').innerHTML =
    T('footer', {t: `<a href="communes.html">${T('tableLink')}</a>`});
}

function renderSearchResults(){
  const q = document.getElementById('searchInput').value.trim();
  const el = document.getElementById('searchResults');
  const tree = document.getElementById('browseTree');
  if(!q){ el.innerHTML = ''; tree.style.display = ''; return; }
  tree.style.display = 'none';
  const results = LocalUI.searchCommunes(GEOGRAPHIES, q);
  if(!results.length){ el.innerHTML = `<div class="result-row">${T('noMatch')} “${esc(q)}”.</div>`; return; }
  el.innerHTML = results.map(g => {
    const primary = LocalUI.localName(g.name, LANG);
    const other = LocalUI.LANGS.map(l => g.name[l]).filter(n => n && n !== primary);
    return `<div class="result-row" data-nis="${g.nis_code}"><span>${esc(primary)}` +
      (other.length ? ` <span style="color:var(--text-faint)">/ ${esc([...new Set(other)][0])}</span>` : '') +
      `</span><span class="rmeta">${g.nis_code}</span></div>`;
  }).join('');
  el.querySelectorAll('[data-nis]').forEach(r => r.addEventListener('click', () => navigateTo(r.dataset.nis)));
}

function renderBrowseTree(){
  const root = GEOGRAPHIES.find(g => g.level === 'country');
  if(!root) return;
  if(browseCurrentId === null) browseCurrentId = root.geo_id;
  const chain = LocalUI.ancestorChain(GEOGRAPHIES, browseCurrentId);
  const children = LocalUI.childrenOf(GEOGRAPHIES, browseCurrentId);
  const el = document.getElementById('browseTree');
  el.innerHTML =
    `<div class="crumb">${chain.map((g,i) =>
      `<button data-id="${g.geo_id}">${esc(LocalUI.localName(g.name, LANG))}</button>` +
      (i < chain.length-1 ? '<span class="sep">›</span>' : '')).join('')}</div>` +
    `<div class="tree-grid">${children.map(c => c.level === 'municipality'
      ? `<div class="tree-item" data-nis="${c.nis_code}">${esc(LocalUI.localName(c.name, LANG))}</div>`
      : `<div class="tree-item" data-drill="${c.geo_id}">${esc(LocalUI.localName(c.name, LANG))}</div>`).join('')}</div>`;
  el.querySelectorAll('.crumb button').forEach(b =>
    b.addEventListener('click', () => { browseCurrentId = b.dataset.id; renderBrowseTree(); }));
  el.querySelectorAll('[data-drill]').forEach(b =>
    b.addEventListener('click', () => { browseCurrentId = b.dataset.drill; renderBrowseTree(); }));
  el.querySelectorAll('.tree-item[data-nis]').forEach(b =>
    b.addEventListener('click', () => navigateTo(b.dataset.nis)));
}

function applyStaticStrings(){
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  document.getElementById('searchInput').placeholder = T('searchPlaceholder');
  document.documentElement.setAttribute('lang', LANG);
}

function rerender(){
  applyStaticStrings();
  if(COMMUNE) renderCommune(); else { renderSearchResults(); renderBrowseTree(); }
}

function navigateTo(nis){
  const url = new URL(window.location.href);
  url.searchParams.set('nis', nis);
  url.searchParams.delete('vs');  // a fresh commune starts with no comparison
  window.history.pushState({}, '', url);
  VS_NIS = []; VS_COMMUNES = [];
  loadCommune(nis);
}

// ── the free four-commune picker ────────────────────────────────────────

function syncVsUrl(){
  const url = new URL(window.location.href);
  if(VS_NIS.length) url.searchParams.set('vs', VS_NIS.join(','));
  else url.searchParams.delete('vs');
  window.history.replaceState({}, '', url);  // replace, not push: not a new "page"
}

async function addPeer(nis){
  if(VS_NIS.length >= LocalUI.MAX_PEERS || VS_NIS.includes(nis) || nis === COMMUNE.nis_code) return;
  try{
    const res = await fetch(`public/data/communes/${nis}.json?t=${Date.now()}`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const peer = await res.json();
    VS_NIS.push(nis);
    VS_COMMUNES.push(peer);
    syncVsUrl();
    renderCommune();
  }catch(e){
    // A peer that fails to load is dropped silently from the picker rather
    // than breaking the page the reader came here for -- the comparison is
    // an enhancement to the commune's own data, not a precondition for it.
    console.warn('Could not load comparison commune', nis, e);
  }
}

function removePeer(nis){
  const i = VS_NIS.indexOf(nis);
  if(i === -1) return;
  VS_NIS.splice(i, 1);
  VS_COMMUNES.splice(i, 1);
  syncVsUrl();
  renderCommune();
}

async function loadPeersFromUrl(nis){
  const url = new URL(window.location.href);
  VS_NIS = LocalUI.parseVsParam(url.searchParams.get('vs'), nis);
  VS_COMMUNES = [];
  for(const peerNis of VS_NIS){
    try{
      const res = await fetch(`public/data/communes/${peerNis}.json?t=${Date.now()}`);
      if(res.ok) VS_COMMUNES.push(await res.json());
    }catch(e){ /* dropped below, once every peer has been attempted */ }
  }
  // A peer that failed to load leaves a gap between VS_NIS and VS_COMMUNES;
  // reconcile VS_NIS to what actually loaded so the URL does not keep
  // asking for a commune that will not resolve.
  VS_NIS = VS_COMMUNES.map(c => c.nis_code);
}

function renderComparePicker(){
  const el = document.getElementById('comparePicker');
  if(!SECTIONS.some(s => s.headline)) { el.style.display = 'none'; return; }
  el.style.display = '';

  document.getElementById('compareChips').innerHTML = VS_COMMUNES.map(peer =>
    `<span class="chip">${esc(LocalUI.localName(peer.name, LANG))}
      <button type="button" data-remove-peer="${peer.nis_code}" title="${esc(T('removeCompare'))}">&times;</button></span>`
  ).join('');
  document.querySelectorAll('[data-remove-peer]').forEach(b =>
    b.addEventListener('click', () => removePeer(b.dataset.removePeer)));

  const addEl = document.getElementById('compareAdd');
  if(VS_NIS.length >= LocalUI.MAX_PEERS){
    addEl.innerHTML = '';
    return;
  }
  addEl.innerHTML = `<input type="text" id="compareInput" autocomplete="off" placeholder="${esc(T('addCompare'))}">
    <div id="compareResults"></div>`;
  document.getElementById('compareInput').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    const results = document.getElementById('compareResults');
    if(!q){ results.innerHTML = ''; return; }
    const matches = LocalUI.searchCommunes(GEOGRAPHIES, q, 6)
      .filter(g => g.nis_code !== COMMUNE.nis_code && !VS_NIS.includes(g.nis_code));
    results.innerHTML = matches.map(g =>
      `<div class="result-row" data-add-peer="${g.nis_code}">${esc(LocalUI.localName(g.name, LANG))}
        <span class="rmeta">${g.nis_code}</span></div>`
    ).join('') || `<div class="result-row">${esc(T('noMatch'))} "${esc(q)}".</div>`;
    results.querySelectorAll('[data-add-peer]').forEach(r =>
      r.addEventListener('click', () => {
        document.getElementById('compareInput').value = '';
        results.innerHTML = '';
        addPeer(r.dataset.addPeer);
      }));
  });
}

function showSearchPanel(){
  COMMUNE = null;
  document.getElementById('searchPanel').style.display = 'block';
  document.getElementById('communePage').style.display = 'none';
  const url = new URL(window.location.href);
  url.searchParams.delete('nis');
  window.history.pushState({}, '', url);
  document.title = 'Commune profile — BelPulse';
}

async function loadCommune(nis){
  try{
    const res = await fetch(`public/data/communes/${nis}.json?t=${Date.now()}`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    COMMUNE = await res.json();
    await loadPeersFromUrl(nis);
    renderCommune();
  }catch(e){
    document.getElementById('communePage').style.display = 'block';
    document.getElementById('searchPanel').style.display = 'none';
    document.getElementById('cTitle').textContent = T('loadFail');
    document.getElementById('cPath').innerHTML = noDataHTML(e.message);
  }
}

function setLang(lang, persist){
  LANG = LocalUI.LANGS.includes(lang) ? lang : LocalUI.DEFAULT_LANG;
  if(persist){ try{ localStorage.setItem('belpulse-lang', LANG); }catch(e){} }
  document.querySelectorAll('#langSeg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  rerender();
}

(function themeSwitch(){
  // Shared key across communes.html, all_data.html and local.html, so a
  // choice on one carries to the others. Distinct from dashboard.html's own
  // day/soft/night switcher, whose values this CSS has no rule for.
  var KEY = 'belpulse-theme';
  var group = document.getElementById('themeSeg');
  var buttons = group.querySelectorAll('[data-theme-choice]');
  function apply(choice, persist){
    if(choice === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', choice);
    if(persist){ try{ localStorage.setItem(KEY, choice); }catch(e){} }
    buttons.forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-choice') === choice));
    });
    // Canvas colours come from CSS variables, so the charts must be redrawn.
    if(COMMUNE) requestAnimationFrame(renderCommune);
  }
  buttons.forEach(function(b){
    b.addEventListener('click', function(){ apply(b.getAttribute('data-theme-choice'), true); });
  });
  var saved = 'auto';
  try{ saved = localStorage.getItem(KEY) || 'auto'; }catch(e){}
  apply(saved, false);
})();

async function init(){
  document.getElementById('backLink').addEventListener('click', showSearchPanel);
  document.getElementById('searchInput').addEventListener('input', renderSearchResults);
  document.querySelectorAll('#langSeg button').forEach(b =>
    b.addEventListener('click', () => setLang(b.dataset.lang, true)));
  window.addEventListener('resize', () => { if(COMMUNE) renderCommune(); });

  let saved = null;
  try{ saved = localStorage.getItem('belpulse-lang'); }catch(e){}
  LANG = LocalUI.LANGS.includes(saved) ? saved
       : (LocalUI.LANGS.find(l => (navigator.language || '').toLowerCase().startsWith(l)) || 'en');
  document.querySelectorAll('#langSeg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  applyStaticStrings();

  try{
    const [geo, sec] = await Promise.all([
      fetch('public/data/metadata/geographies.json?t=' + Date.now()),
      fetch('public/data/metadata/sections.json?t=' + Date.now()),
    ]);
    // Check the status before parsing: a missing file on GitHub Pages returns
    // an HTML 404 page, and res.json() on that throws "Unexpected token '<'"
    // -- an error that says nothing about the actual problem.
    if(!geo.ok) throw new Error(
      `the commune index is missing (HTTP ${geo.status}). It is generated by ` +
      `scripts/export_site_payloads.py into public/data/ — run that, or wait for the daily workflow.`);
    GEOGRAPHIES = (await geo.json()).geographies;
    if(!GEOGRAPHIES || !GEOGRAPHIES.length) throw new Error('the commune index loaded but is empty.');
    SECTIONS = sec.ok ? (await sec.json()).sections : [];
  }catch(e){
    document.getElementById('searchResults').innerHTML = noDataHTML(T('loadFail') + ': ' + e.message);
    return;
  }
  renderBrowseTree();
  const nis = new URL(window.location.href).searchParams.get('nis');
  if(nis) loadCommune(nis);
}
init();
</script>
</body>
