[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "belgian-macro-pipeline"
version = "0.1.0"
description = "Fetches Belgian macroeconomic and market data, stores in SQLite, exports to CSV/JSON."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "black>=26.0",
    "ruff>=0.16",
    "pytest>=8.0",
]

[tool.setuptools]
# Flat layout: the pipeline is two top-level scripts, not a package. Declared
# explicitly because auto-discovery does not reliably find them here.
py-modules = ["belgian_macro_db", "fetch_stocks"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by black; long data URLs stay on one line
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
