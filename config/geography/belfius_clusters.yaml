    family: rural_w
    label: {fr: Rurales peu denses, nl: Dunbevolkte landelijke gemeenten, en: Sparsely populated rural}
  W2:
    family: rural_w
    label: {fr: Rurales à dominante forestière, nl: Landelijke gemeenten met overwegend bos, en: Rural, predominantly forested}
  W3:
    family: rural_w
    label: {fr: Rurales et pôles multifonctionnels, nl: Landelijke gemeenten en multifunctionele polen, en: Rural with multifunctional centres}
  W4:
    family: rural_w
    label:
      fr: Rurales touristiques avec vieillissement de la population
      nl: Landelijke toeristische gemeenten met vergrijzende bevolking
      en: Rural tourist municipalities with an ageing population
  W5:
    family: rural_w
    label:
      fr: Rurales avec urbanisation croissante et activités économiques
      nl: Landelijke gemeenten met toenemende verstedelijking en economische activiteit
      en: Rural with growing urbanisation and economic activity
  W8:
    family: rural_w
    label: {fr: Rurales avec expansion résidentielle, nl: Landelijke gemeenten met residentiële expansie, en: Rural with residential expansion}
  W6:
    family: residential_w
    label:
      fr: Résidentielles à vocation économique affirmée
      nl: Woongemeenten met uitgesproken economische roeping
      en: Residential with a marked economic vocation
  W7:
    family: residential_w
    label:
      fr: Résidentielles à moyens ou faibles revenus et peu polarisantes
      nl: Woongemeenten met middelhoge of lage inkomens en weinig aantrekkingskracht
      en: Residential with middle or low incomes and little pull
  W9:
    family: residential_w
    label:
      fr: Résidentielles à hauts revenus et population vieillissante
      nl: Woongemeenten met hoge inkomens en vergrijzende bevolking
      en: Residential with high incomes and an ageing population
  W10:
    family: urbanised_w
    label: {fr: Urbanisées à faibles revenus, nl: Verstedelijkte gemeenten met lage inkomens, en: Urbanised with low incomes}
  W11:
    family: urbanised_w
    label:
      fr: Urbanisées à faibles revenus et déprise économique
      nl: Verstedelijkte gemeenten met lage inkomens en economische achteruitgang
      en: Urbanised with low incomes and economic decline
  W12:
    family: urbanised_w
    label:
      fr: Fortement urbanisées à faibles revenus
      nl: Sterk verstedelijkte gemeenten met lage inkomens
      en: Strongly urbanised with low incomes
  W13:
    family: urbanised_w
    label:
      fr: Fortement urbanisées à vocation économique affirmée
      nl: Sterk verstedelijkte gemeenten met uitgesproken economische roeping
      en: Strongly urbanised with a marked economic vocation
  W14:
    family: urban_w
    label:
      fr: Villes moyennes bien équipées en milieu rural
      nl: Goed uitgeruste middelgrote steden in landelijk gebied
      en: Well-equipped medium-sized towns in a rural setting
    subgroups:
      villes_moyennes: {fr: Villes moyennes bien équipées en milieu rural, nl: Goed uitgeruste middelgrote steden, en: Well-equipped medium-sized towns}
      petites_villes: {fr: Petites villes bien équipées en milieu rural, nl: Goed uitgeruste kleine steden, en: Well-equipped small towns}
  W15:
    family: urban_w
    label:
      fr: Pôles urbains à vocation économique affirmée
      nl: Stedelijke polen met uitgesproken economische roeping
      en: Urban centres with a marked economic vocation
  W16:
    family: urban_w
    printed_as: W14
    label:
      fr: Grandes villes et pôles régionaux structurants
      nl: Grote steden en structurerende regionale polen
      en: Large cities and structuring regional centres
    subgroups:
      poles_regionaux: {fr: Pôles régionaux structurants, nl: Structurerende regionale polen, en: Structuring regional centres}
      grandes_villes: {fr: Grandes villes, nl: Grote steden, en: Large cities}
  V1:
    family: residential_v
    label:
      nl: Gemeenten in de stadsrand met hoge inkomens en vergrijzende bevolking
      fr: Communes de périphérie urbaine à hauts revenus et population vieillissante
      en: Suburban municipalities with high incomes and an ageing population
  V2:
    family: residential_v
    label:
      nl: Gemeenten in de stadsrand met hogere inkomens en toenemend aantal jongeren
      fr: Communes de périphérie urbaine à revenus élevés et jeunes en nombre croissant
      en: Suburban municipalities with higher incomes and a growing young population
  V3:
    family: residential_v
    label: {nl: Woongemeenten met hogere inkomens, fr: Communes résidentielles à revenus élevés, en: Residential municipalities with higher incomes}
  V4:
