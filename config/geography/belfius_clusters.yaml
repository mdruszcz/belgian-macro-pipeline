# Belfius socio-economic typology of Belgian municipalities -- the CLUSTER
# LABELS and their FAMILIES. The per-commune composition is the sibling CSV,
# belfius_clusters.csv, transcribed name for name from the three Belfius
# publications under docs/Communes caracterisation/ ("Composition des clusters
# -- Wallonie", FR; "Samenstelling van de clusters -- Vlaanderen" and "--
# Brussel", NL). Belfius Banque & Assurances is the author of the typology;
# BelPulse publishes it as a classification only, never as a figure.
#
# The labels are Belfius's own in the language of each publication (FR for the
# Walloon clusters, NL for the Flemish and Brussels ones). The two other
# languages are BelPulse's translations, marked so below: unofficial, like the
# English commune names, and never presented as Belfius's wording.
#
# TWO CLUSTER CODES ARE CORRECTED FROM THE PRINT. The Walloon publication
# labels both "Villes moyennes bien equipees en milieu rural" and "Grandes
# villes et poles regionaux structurants" as W14; the Flemish one labels both
# "Grote en regionale steden" and "Kustgemeenten" as V15. Each publication
# numbers its clusters consecutively and those are its last two headings, so
# the second of each pair is W16 and V16 here, with the printed code recorded
# so the correction is auditable rather than silent.
#
# THE COMPOSITION PREDATES THE 2019 AND 2025 MERGERS: it lists Puurs and
# Sint-Amands, Neerpelt and Overpelt, Bastogne and Bertogne as separate
# communes. scripts/export_commune_typology.py resolves every printed name to
# today's 565 communes through config/geography/municipality_crosswalk.csv;
# a commune whose constituent parts sat in DIFFERENT clusters is published as
# `mixed` with the parts named, never assigned to one of them (rule 26 -- the
# five states never collapse -- and the Definitions' "refuse, do not invent").

source:
  publisher: Belfius Banque & Assurances
  title:
    fr: Typologie socio-économique des communes — composition des clusters
    nl: Sociaaleconomische typologie van de gemeenten — samenstelling van de clusters
    en: Socio-economic typology of municipalities — cluster composition
  documents:
    - docs/Communes caracterisation/EEPSTUDCLUWAL_FR.pdf
    - docs/Communes caracterisation/EEPSTUDCLUVLA_NL.pdf
    - docs/Communes caracterisation/EEPSTUDCLUBXL_NL.pdf
  translations_note: >-
    Cluster and family labels are Belfius's own in the language of the publication
    that defines them (fr for W*, nl for V* and BX*); the other two languages are
    BelPulse's unofficial translations.
  # The composition lists Puurs and Sint-Amands, Neerpelt and Overpelt, Bastogne
  # and Bertogne as separate communes: it describes the commune map BEFORE the
  # 2019 mergers. Printed names are resolved against the communes valid on this
  # date, then carried to today's through municipality_crosswalk.csv.
  reference_date: "2018-12-31"
  # Printed names that cannot be matched as printed, each with its reason. Kept
  # here rather than corrected in the CSV so the transcription stays a faithful
  # copy of the print and every departure from it is on the record.
  printed_name_aliases:
    AUBAGNE:
      use: AUBANGE
      note: >-
        Printed "AUBAGNE" in cluster W10 of the Walloon publication. Aubagne is a
        town in Provence; the Walloon commune is Aubange (Luxembourg province), the
        only Belgian commune of that shape, and it appears nowhere else in the list.
    COMINES:
      use: COMINES-WARNETON
      note: >-
        Belfius prints the short name; the commune is Comines-Warneton
        (Komen-Waasten).
    WAISMES:
      use: WAIMES
      note: >-
        Printed "WAISMES" in cluster W2. The commune is Waimes (Weismes in
        German); no Belgian commune is spelled Waismes.
    FOSSE-LA-VILLE:
      use: FOSSES-LA-VILLE
      note: >-
        Printed without its final s in cluster W7; the commune is
        Fosses-la-Ville (Namur province).

families:
  rural_w:
    region: WAL
    label: {fr: Communes rurales, nl: Landelijke gemeenten, en: Rural municipalities}
  residential_w:
    region: WAL
    label: {fr: Communes résidentielles, nl: Woongemeenten, en: Residential municipalities}
  urbanised_w:
    region: WAL
    label: {fr: Communes urbanisées, nl: Verstedelijkte gemeenten, en: Urbanised municipalities}
  urban_w:
    region: WAL
    label:
      fr: Communes urbaines (exerçant une fonction de centralité)
      nl: Stedelijke gemeenten (met een centrumfunctie)
      en: Urban municipalities (with a central function)
  residential_v:
    region: VLA
    label: {nl: Woongemeenten, fr: Communes résidentielles, en: Residential municipalities}
  rural_v:
    region: VLA
    label: {nl: Landelijke gemeenten, fr: Communes rurales, en: Rural municipalities}
  economic_v:
    region: VLA
    label:
      nl: Gemeenten met concentratie van economische activiteit
      fr: Communes à concentration d’activité économique
      en: Municipalities with a concentration of economic activity
  urbanised_v:
    region: VLA
    label: {nl: Verstedelijkte gemeenten, fr: Communes urbanisées, en: Urbanised municipalities}
  cities_v:
    region: VLA
    label: {nl: Grote en regionale steden, fr: Grandes villes et villes régionales, en: Large and regional cities}
  coast_v:
    region: VLA
    label: {nl: Kustgemeenten, fr: Communes côtières, en: Coastal municipalities}
  brussels:
    region: BXL
    label: {nl: Brussel, fr: Bruxelles, en: Brussels}

clusters:
