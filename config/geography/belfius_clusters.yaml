    label: {nl: Kustgemeenten, fr: Communes côtières, en: Coastal municipalities}
  BX1:
    family: brussels
    label:
      nl: Residentiële gemeenten in het noordwesten
      fr: Communes résidentielles du nord-ouest
      en: Residential municipalities in the north-west
  BX2:
    family: brussels
    label:
