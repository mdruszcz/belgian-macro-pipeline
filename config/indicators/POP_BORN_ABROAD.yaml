id: POP_BORN_ABROAD
name:
  en: Population born abroad
  fr: Population née à l’étranger
  nl: In het buitenland geboren bevolking
definition:
  en: "Number of residents born outside Belgium, whatever their current citizenship, from the 2021 census."
  fr: "Nombre d'habitants nés hors de Belgique, quelle que soit leur nationalité actuelle, selon le recensement de 2021."
  nl: "Aantal inwoners die buiten België zijn geboren, ongeacht hun huidige nationaliteit, volgens de volkstelling van 2021."
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 5475
description:
  en: >
    Residents whose place of birth is outside Belgium, whatever their citizenship (Census 2021,
    HC08_2, CD_POB_LVL_1 = FOR). Distinct from POP_FOREIGN_NATIONALS: the two differ by
    naturalisation.
display: null
