id: MUN_EXPENDITURE_GROWTH_1Y
name:
  en: Ordinary municipal expenditure, change over one year
  fr: Dépenses ordinaires communales, évolution sur un an
  nl: Gewone gemeentelijke uitgaven, verandering over een jaar
unit: percent
frequency: A
geo_levels: [municipal]
preferred_direction: contextual
decimals: 1
description:
  en: >
    Year-on-year change in ordinary expenditure per inhabitant. Contextual for the same reason as revenue growth: more spending per resident is a service level or a cost problem, and the number alone cannot tell them apart.
    Source figures: WalStat (IWEPS), CC0; Walloon communes only, 2013 onward.
derived:
  function: growth_rate
  inputs: [MUN_EXPENDITURE_ORDINARY_PER_CAPITA]
  args:
    years: 1
