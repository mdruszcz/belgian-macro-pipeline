id: EMPLOYMENT_LFS_EUROPE
name:
  en: Employment, labour force survey (15-64)
  fr: Emploi, enquête sur les forces de travail (15-64 ans)
  nl: Werkgelegenheid, enquête naar de arbeidskrachten (15-64 jaar)
definition:
  en: "Number of employed people aged 15 to 64, from the labour force survey, for each European country tracked."
  fr: "Nombre de personnes en emploi de 15 à 64 ans, selon l'enquête sur les forces de travail, pour chaque pays européen suivi."
  nl: "Aantal werkende personen van 15 tot 64 jaar, volgens de enquête naar de arbeidskrachten, voor elk gevolgd Europees land."
unit: thousand_persons
frequency: A
source_id: eurostat
geo_levels:
- national
preferred_direction: higher_is_better
description:
  en: Employed persons aged 15-64, total (both sexes), labour force survey
    concept, total economy (NACE Rev.2 TOTAL), every allowlisted European
    country -- Eurostat domains batch, 2026-09-15 (docs/data_catalog.md). A
    different survey/concept from EMPLOYMENT_NATACCOUNTS_EUROPE (national
    accounts); the two are not interchangeable.
fetch:
  dataset: lfsa_egan2
  filters:
    sex: T
    age: Y15-64
    unit: THS_PER
    nace_r2: TOTAL
  geographies: allowlist
  since: "2008"
display: null
