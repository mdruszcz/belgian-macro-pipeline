id: GOV_BALANCE_EUROPE
name:
  en: General government net lending/borrowing (balance)
  fr: Capacité/besoin de financement des administrations publiques (solde)
  nl: Vorderingenoverschot/-tekort van de overheid (saldo)
definition:
  en: "Government budget balance as a share of GDP, for each European country tracked."
  fr: "Solde budgétaire des administrations publiques en pourcentage du PIB, pour chaque pays européen suivi."
  nl: "Overheidsbegrotingssaldo als aandeel van het bbp, voor elk gevolgd Europees land."
unit: pct_of_gdp
frequency: A
source_id: eurostat
geo_levels:
- national
preferred_direction: higher_is_better
description:
  en: General government net lending (+) / net borrowing (-), percentage of
    GDP, every allowlisted European country -- Eurostat domains batch,
    2026-09-15 (docs/data_catalog.md). Unit deliberately does not start with
    "percent" -- matches GOV_DEBT_EUROPE's own convention (the percent_bounded
    validation rule fails above 100, and this ratio is signed).
fetch:
  dataset: gov_10a_main
  filters:
    unit: PC_GDP
    na_item: B9
    sector: S13
  geographies: allowlist
  since: "2008"
display: null
