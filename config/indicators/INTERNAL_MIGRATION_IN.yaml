id: INTERNAL_MIGRATION_IN
name:
  en: Internal migration arrivals
  fr: Arrivées migratoires internes
  nl: Interne migratie aankomsten
definition:
  en: "Number of people who moved into the commune from elsewhere in Belgium during the calendar year."
  fr: "Nombre de personnes ayant déménagé vers la commune depuis une autre partie de la Belgique au cours de l'année civile."
  nl: "Aantal personen die tijdens het kalenderjaar vanuit de rest van België naar de gemeente verhuisden."
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 550
description:
  en: >
    Arrivals from elsewhere in Belgium to residents of the commune during the calendar year,
    from Statbel's population-movement workbook (docs/features/population_movement.md), column
    G -- the publisher's own ENTREES for "MOUVEMENT MIGRATOIRE INTERNE", taken as published, not
    recomputed (CLAUDE.md rule 6). Always non-negative, so unit is 'count'.
    INTERNAL_MIGRATION_NET = INTERNAL_MIGRATION_IN - INTERNAL_MIGRATION_OUT, as published by
    Statbel (see INTERNAL_MIGRATION_OUT and INTERNAL_MIGRATION_NET). Geography is
    period-correct: each year's rows resolve against the commune map in effect at the START of
    that same calendar year (not a pinned current-day map -- see
    src/fetchers/population_movement.py and docs/features/population_movement.md).
    preferred_direction is 'contextual': more arrivals is neither better nor worse on its own.
  fr: >
    Arrivées en provenance d'ailleurs en Belgique, pour les résidents de la commune durant
    l'année civile, tirées du tableau Statbel du mouvement de la population
    (docs/features/population_movement.md), colonne G -- le solde ENTREES publié pour
    "MOUVEMENT MIGRATOIRE INTERNE", repris tel quel, non recalculé (règle 6 du CLAUDE.md).
    Toujours positif ou nul, d'où l'unité 'count'. INTERNAL_MIGRATION_NET =
    INTERNAL_MIGRATION_IN - INTERNAL_MIGRATION_OUT, tel que publié par Statbel (voir
    INTERNAL_MIGRATION_OUT et INTERNAL_MIGRATION_NET). La géographie est correcte pour chaque
    période : les lignes de chaque année sont résolues sur la carte communale en vigueur au
    DEBUT de cette même année civile (pas la carte actuelle -- voir
    src/fetchers/population_movement.py et docs/features/population_movement.md).
    preferred_direction est 'contextual' : davantage d'arrivées n'est en soi ni meilleur ni
    pire.
  nl: >
    Aankomsten vanuit de rest van België voor inwoners van de gemeente tijdens het kalenderjaar,
    uit de Statbel-tabel van de bevolkingsbeweging (docs/features/population_movement.md),
    kolom G -- het gepubliceerde ENTREES-saldo voor "MOUVEMENT MIGRATOIRE INTERNE", overgenomen
    zoals gepubliceerd, niet herberekend (CLAUDE.md-regel 6). Steeds niet-negatief, vandaar
    unit 'count'. INTERNAL_MIGRATION_NET = INTERNAL_MIGRATION_IN - INTERNAL_MIGRATION_OUT, zoals
    gepubliceerd door Statbel (zie INTERNAL_MIGRATION_OUT en INTERNAL_MIGRATION_NET). De
    geografie is periode-correct: elk jaar wordt opgelost tegen de gemeentekaart die gold aan
    het BEGIN van dat kalenderjaar (niet de huidige kaart -- zie
    src/fetchers/population_movement.py en docs/features/population_movement.md).
    preferred_direction is 'contextual': meer aankomsten is op zich niet beter of slechter.
display: null
