    nl: Nominale loonkosten per eenheid product
  sort_order: 1
  description:
    en: Compensation per employee relative to productivity (real GDP per person
      employed). A rising ratio means labour costs are outpacing output per worker
      -- a standard competitiveness gauge.
    fr: Rémunération par salarié par rapport à la productivité (PIB réel par personne
      occupée). Une hausse du ratio signifie que les coûts salariaux progressent
      plus vite que la production par travailleur -- un indicateur usuel de compétitivité.
    nl: Beloning per werknemer ten opzichte van de productiviteit (reëel bbp per
      werkende persoon). Een stijgende verhouding betekent dat de loonkosten sneller
      toenemen dan de productie per werknemer -- een gangbare concurrentiemaatstaf.
  sdmx_code: PLCD
