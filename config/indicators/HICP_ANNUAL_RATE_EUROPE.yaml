id: HICP_ANNUAL_RATE_EUROPE
name:
  en: HICP, annual rate of change
  fr: IPCH, taux de variation annuel
  nl: GICP, jaarlijkse veranderingspercentage
definition:
  en: "Year-on-year change in the harmonised consumer price index, for each European country tracked."
  fr: "Variation en glissement annuel de l'indice des prix à la consommation harmonisé, pour chaque pays européen suivi."
  nl: "Jaar-op-jaar verandering van de geharmoniseerde consumentenprijsindex, voor elk gevolgd Europees land."
unit: percent_yy
frequency: M
source_id: eurostat
geo_levels:
- national
preferred_direction: contextual
description:
  en: Harmonised Index of Consumer Prices, all items, annual rate of change, every
    allowlisted European country -- the international pilot (docs/features/international.md).
fetch:
  # ADR 0018 (docs/decisions/0018-stopped-inflation-series.md, ACCEPTED
  # 2026-10-04): prc_hicp_manr stopped at 2025-12 and still answers HTTP 200,
  # so nothing failed loudly on its own. prc_hicp_minr is its ECOICOP ver.2
  # successor -- same concept, same adapter, both dimensions that changed
  # name/code pinned explicitly so an unpinned one fails loudly instead of
  # silently returning a different measure (coicop -> coicop18, CP00 ->
  # TOTAL; unit is a new dimension, pinned to RCH_A, the annual rate of
  # change -- without it the dataset would also return index levels).
  dataset: prc_hicp_minr
  filters:
    coicop18: TOTAL
    unit: RCH_A
  geographies: allowlist
  since: "2008"
display: null
