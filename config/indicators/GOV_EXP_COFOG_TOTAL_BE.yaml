description:
  en: "Belgian general government (S13) total expenditure (na_item TE), COFOG classification (cofog99 TOTAL), million EUR. The spending-breakdown whole for the public-finance counter's spending parts (docs/features/public_finance_live.md): the 11 named functions + \"other functions\" sum to this. NOTE: this COFOG total for a given year is NOT the same figure as GOV_EXPENDITURE_BE (na_item TE) for that same year -- different dataset, different release date (2024 COFOG TOTAL 335287.9 vs 2024 gov_10a_main TE 335100.1, live-verified 2026-10-03) -- so spending shares are always computed within this one dataset, never mixed with GOV_EXPENDITURE_BE."
