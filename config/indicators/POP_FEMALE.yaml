  fr: "Nombre d'habitantes de la commune, selon le recensement de 2021."
  nl: "Aantal vrouwelijke inwoners van de gemeente, volgens de volkstelling van 2021."
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
