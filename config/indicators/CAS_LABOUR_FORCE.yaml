id: CAS_LABOUR_FORCE
name:
  en: Labour force (15-64)
  fr: Population active (15-64 ans)
  nl: Beroepsactieve bevolking (15-64 jaar)
definition:
  en: "Number of residents aged 15 to 64 who are employed or unemployed, from the 2021 census."
  fr: "Nombre d'habitants de 15 à 64 ans en emploi ou au chômage, selon le recensement de 2021."
  nl: "Aantal inwoners van 15 tot 64 jaar die werken of werkloos zijn, volgens de volkstelling van 2021."
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 5475
description:
  en: >
    Residents aged 15-64 who are employed or unemployed (Census 2021, table T01_CAS1564,
    category 1 'Beroepsactieven'). The EU Labour Force Survey's standard working-age population,
    used here as the denominator for UNEMPLOYMENT_RATE. Excludes retirees, students and other
    inactive residents, who are INACTIVE_POPULATION.
display: null
