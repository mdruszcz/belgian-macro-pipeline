id: INTERNAL_MIGRATION_NET
name:
  en: Net internal migration
  fr: Solde migratoire interne
  nl: Intern migratiesaldo
definition:
  en: "Difference between arrivals from and departures to the rest of Belgium for the commune during the calendar year."
  fr: "Différence entre les arrivées depuis le reste de la Belgique et les départs vers celui-ci pour la commune au cours de l'année civile."
  nl: "Verschil tussen aankomsten uit en vertrekken naar de rest van België voor de gemeente tijdens het kalenderjaar."
unit: balance
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 550
description:
  en: >
    Net internal migration (arrivals minus departures, within Belgium) for residents of the
    commune during the calendar year, from Statbel's population-movement workbook
    (docs/features/population_movement.md), column I -- the publisher's own SOLDE for
    "MOUVEMENT MIGRATOIRE INTERNE", taken as published, not recomputed (CLAUDE.md rule 6). This
    value is routinely negative (more residents left for another Belgian commune than arrived
    from one), so unit is 'balance' (signed, additive) rather than 'count' -- 'count' carries
    CLAUDE.md's `counts_non_negative` validation rule, which this indicator's real data would
    fail every year, and this batch does not weaken that rule (see the PR body). Geography is
    period-correct: each year's rows resolve against the commune map in effect at the START of
    that same calendar year (not a pinned current-day map -- see
    src/fetchers/population_movement.py and docs/features/population_movement.md).
    preferred_direction is 'contextual': a positive or negative net migration figure is neither
    better nor worse on its own.
display: null
