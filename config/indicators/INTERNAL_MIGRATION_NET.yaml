id: INTERNAL_MIGRATION_NET
name:
  en: Net internal migration
  fr: Solde migratoire interne
  nl: Intern migratiesaldo
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 550
description:
  en: >
    Net internal migration (arrivals minus departures, within Belgium) for residents of the
    commune during the calendar year, from Statbel's population-movement workbook
    (docs/features/population_movement.md), column I -- the publisher's own SOLDE for
    "MOUVEMENT MIGRATOIRE INTERNE", taken as published, not recomputed (CLAUDE.md rule 6). This
    value is routinely negative (more residents left for another Belgian commune than arrived
    from one) -- CLAUDE.md's `counts_non_negative` validation rule currently rejects any
    negative value where unit is 'count'; see the PR body for how this batch resolves that
    conflict rather than silently weakening the rule. Geography is period-correct: each year's
    rows resolve against the commune map in effect at the end of that year (the workbook's own
    convention -- see src/fetchers/population_movement.py), not a pinned current-day map.
    preferred_direction is 'contextual': a positive or negative net migration figure is neither
    better nor worse on its own.
display: null
