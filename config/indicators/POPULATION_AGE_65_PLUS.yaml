id: POPULATION_AGE_65_PLUS
name:
  en: Population aged 65 and over
  fr: Population âgée de 65 ans et plus
  nl: Bevolking 65 jaar en ouder
unit: count
frequency: A
source_id: statbel
geo_levels:
- municipal
preferred_direction: contextual
description:
  en: >
    Population per commune in the older dependants (65+) age band, as of 1 January each year.
    Source: Statbel's TF_SOC_POP_STRUCT bulk file, where CD_AGE is single
    years 0-100 (100 is top-coded "100 and over"); this band is the sum over
    those single years. A raw count, deliberately not a ratio -- the
    dependency ratio is computed from these three bands by the Block G
    derived engine, so a denominator revision recomputes it rather than
    leaving a stale stored figure. Summing the three bands reproduces
    POPULATION_BY_COMMUNE exactly; scripts/sync_population.py asserts that
    rather than assuming it.
display: null
