id: ACTIVATION_MEASURES_PAID
name:
  en: Employment and activation measures paid
  fr: Montants payés en emploi et mesures d'activation
  nl: Uitbetaalde bedragen werkgelegenheid en activeringsmaatregelen
definition:
  en: "Total euros paid to residents of the commune under federal employment and activation-support schemes over the year."
  fr: "Montant total, en euros, versé aux habitants de la commune au titre des mesures fédérales d'emploi et d'activation au cours de l'année."
  nl: "Totaal in euro uitbetaald aan inwoners van de gemeente via federale maatregelen voor werkgelegenheid en activering tijdens het jaar."
unit: EUR
frequency: A
source_id: onem
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 400
description:
  en: >
    Total euros paid to residents of the commune under ONEM's employment and activation measures
    over the year (the "Total" column of EMPL_Commune_Statut_M_FR), spanning the Activa hiring
    subsidies, transition programmes, SINE social-economy places, work-resumption top-ups,
    sheltered-workshop employment, shortage-occupation and healthcare-sector allowances,
    vocational training allowances, transition placements and dismissal compensation. A
    composite of 21 distinct schemes, so it is a measure of activation spending reaching the
    commune, not of any single programme.
display: null
