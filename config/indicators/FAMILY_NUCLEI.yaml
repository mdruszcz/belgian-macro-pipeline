id: FAMILY_NUCLEI
name:
  en: Family nuclei
  fr: Noyaux familiaux
  nl: Familiekernen
definition:
  en: "Number of family units (a couple with or without children, or a lone parent with children) recorded in the commune, from the 2021 census."
  fr: "Nombre de noyaux familiaux (couple avec ou sans enfants, ou parent seul avec enfants) recensés dans la commune, selon le recensement de 2021."
  nl: "Aantal familiekernen (koppel met of zonder kinderen, of alleenstaande ouder met kinderen) geteld in de gemeente, volgens de volkstelling van 2021."
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 5475
description:
  en: >
    Family nuclei -- a couple with or without children, or a lone parent with children (Census
    2021, HC36_1, all types). A household can contain more than one, so this is not a household
    count.
display: null
