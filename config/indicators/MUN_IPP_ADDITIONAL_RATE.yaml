id: MUN_IPP_ADDITIONAL_RATE
name:
  en: Communal additional personal-income-tax rate
  fr: Taxe communale additionnelle à l'IPP
  nl: Aanvullende gemeentebelasting op de personenbelasting
definition:
  en: "Additional percentage the commune adds to residents' personal income tax bill, for the tax year."
  fr: "Pourcentage additionnel que la commune ajoute à l'impôt des personnes physiques de ses habitants, pour l'exercice d'imposition."
  nl: "Aanvullend percentage dat de gemeente heft op de personenbelasting van haar inwoners, voor het aanslagjaar."
unit: percent
frequency: A
source_id: spf_finances
geo_levels: [municipal]
# contextual, not lower_is_better/higher_is_better: this rate funds ordinary
# municipal services (roughly a third of communal revenue nationally) and a
# low rate is not unambiguously "better" -- it can mean thinner services as
# easily as fiscal discipline, and a high rate can fund debt reduction as
# easily as inefficiency. The pipeline has no way to tell those apart from
# the rate alone (see description below on why this indicator is never
# combined with income or tax amounts), so calling either direction
# "preferred" would be an editorial claim this data does not support.
preferred_direction: contextual
# SPF Finances republishes each tax year's file once, well after the fact
# (the 2026 file was already live alongside 2025 and 2024 on 2026-09-23);
# a year-old rate is still the current one until the next year's file
# appears, so a generous allowance avoids a false staleness warning between
# annual republications.
max_age_days: 730
description:
  en: >
    The communal additional percentage on personal income tax (impôt des personnes
    physiques / personenbelasting), as published by SPF Finances for each tax year
    (exercice d'imposition). PERIOD IS THE TAX YEAR EXACTLY AS PUBLISHED IN THE SOURCE
    FILE -- how a tax year maps to the income year it taxes has not been confirmed and is
    not asserted here. Source: SPF Finances, one file per tax year at a fixed URL pattern;
    tax years 2024, 2025 and 2026 only (2018-2023 are published as PDF only and are out of
    scope). No NIS code appears in the source file -- rows are matched to a commune by
    name, verified against the geographies table valid on 1 January of the row's own tax
    year, with one documented override for the one ambiguous name in the file (see
    src/fetchers/spf_finances.py and scripts/sync_ipp_rate.py). A rate of exactly 0 (e.g.
    Knokke-Heist, tax year 2026) is a real published rate, not a missing or suppressed
    value. THIS RATE HAS NO DEFENSIBLE AGGREGATE and none is computed: it is neither an
    additive total nor a ratio recomputable from an underlying sum, so province/region/
    Belgium figures are refused, not averaged (is_additive false, aggregation_method
    not_applicable). It is also never combined with fiscal income or tax-amount figures
    to derive a yield, a revenue estimate, or any other indicator -- the rate alone does
    not license that calculation.
  fr: >
    Le pourcentage additionnel communal sur l'impôt des personnes physiques (IPP), tel que
    publié par le SPF Finances pour chaque exercice d'imposition. LA PÉRIODE EST
    L'EXERCICE D'IMPOSITION TEL QUE PUBLIÉ DANS LE FICHIER SOURCE -- la correspondance
    entre exercice d'imposition et année de revenus n'a pas été confirmée et n'est pas
    affirmée ici. Source : SPF Finances, un fichier par exercice d'imposition à une URL de
    forme fixe ; exercices 2024, 2025 et 2026 uniquement (2018-2023 ne sont publiés qu'en
    PDF, hors périmètre). Le fichier source ne contient aucun code INS -- les lignes sont
    associées à une commune par son nom, vérifié par rapport à la table des géographies
    valide au 1er janvier de l'exercice concerné, avec une seule exception documentée pour
    le nom ambigu du fichier (voir src/fetchers/spf_finances.py et
    scripts/sync_ipp_rate.py). Un taux exactement égal à 0 (par ex. Knokke-Heist, exercice
    2026) est un taux réellement publié, non une valeur manquante ou supprimée. CE TAUX
    N'A PAS D'AGRÉGAT DÉFENDABLE et aucun n'est calculé : ce n'est ni un total additif ni
    un ratio recalculable à partir d'une somme sous-jacente, donc les chiffres provinciaux/
    régionaux/nationaux sont refusés, jamais moyennés (is_additive faux, aggregation_method
    not_applicable). Il n'est également jamais combiné avec des montants de revenu ou
    d'impôt pour dériver un rendement, une estimation de recette, ou tout autre indicateur
    -- le taux seul ne permet pas ce calcul.
  nl: >
    Het aanvullend gemeentelijk percentage op de personenbelasting (IPP), zoals
    gepubliceerd door de FOD Financiën per aanslagjaar. DE PERIODE IS HET AANSLAGJAAR
    PRECIES ZOALS GEPUBLICEERD IN HET BRONBESTAND -- hoe een aanslagjaar zich verhoudt tot
    het belastbare inkomstenjaar is niet bevestigd en wordt hier niet beweerd. Bron: FOD
    Financiën, één bestand per aanslagjaar op een vast URL-patroon; enkel aanslagjaren
    2024, 2025 en 2026 (2018-2023 zijn enkel als PDF gepubliceerd, buiten bereik). Het
    bronbestand bevat geen NIS-code -- rijen worden gekoppeld aan een gemeente op basis van
    de naam, geverifieerd tegen de geografietabel die geldig is op 1 januari van het
    betrokken aanslagjaar, met één gedocumenteerde uitzondering voor de ene dubbelzinnige
    naam in het bestand (zie src/fetchers/spf_finances.py en scripts/sync_ipp_rate.py). Een
    tarief van exact 0 (bv. Knokke-Heist, aanslagjaar 2026) is een werkelijk gepubliceerd
    tarief, geen ontbrekende of onderdrukte waarde. DIT TARIEF HEEFT GEEN VERDEDIGBAAR
    GEAGGREGEERD CIJFER en er wordt er geen berekend: het is noch een optelbaar totaal,
    noch een verhouding herberekenbaar uit een onderliggende som, dus provincie-/gewest-/
    Belgiëcijfers worden geweigerd, nooit gemiddeld (is_additive onwaar, aggregation_method
    not_applicable). Het wordt evenmin ooit gecombineerd met inkomens- of belastingbedragen
    om een opbrengst, een ontvangstenraming, of enige andere indicator af te leiden -- het
    tarief alleen laat die berekening niet toe.
display: null
