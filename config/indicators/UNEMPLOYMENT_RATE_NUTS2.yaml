id: UNEMPLOYMENT_RATE_NUTS2
name:
  en: Unemployment rate
  fr: Taux de chômage
  nl: Werkloosheidsgraad
definition:
  en: "Share of the labour force aged 15 to 74 who are unemployed, for each European region tracked."
  fr: "Part de la population active de 15 à 74 ans qui est au chômage, pour chaque région européenne suivie."
  nl: "Aandeel van de actieve bevolking van 15 tot 74 jaar dat werkloos is, voor elke gevolgde Europese regio."
unit: percent
frequency: A
source_id: eurostat
geo_levels:
- nuts2
preferred_direction: lower_is_better
description:
  en: Unemployment rate, ages 15-74, total, percentage of the labour force --
    NUTS 2 region, every region whose country is on the international pilot's
    licence allowlist (docs/features/europe_nuts2.md, batch B2). NOT loaded as
    of this batch -- unlike POPULATION_NUTS2's single bad cell, a genuine
    minority of this dataset's cells carrying an OBS_FLAG with no value at all
    (e.g. DE22, 2020, flag "bu") are themselves 4-character NUTS-2-shaped
    codes, so the adapter's geo_filter (scripts/sync_nuts2.py's is_nuts2_code)
    does not skip them -- EurostatSource._parse still refuses outright
    (CLAUDE.md rule 13). How to label these cells (they carry flag `u`/`bu`,
    "unreliable"/"break+unreliable") is the maintainer's decision, pending as
    of this batch; see the feature doc's "Coverage" section.
fetch:
  dataset: lfst_r_lfu3rt
  filters:
    isced11: TOTAL
    sex: T
    age: Y15-74
    unit: PC
  geographies: allowlist
  since: "1999"
display: null
