id: HOUSE_SALES_TRANSACTIONS
name:
  en: Ordinary house sales
  fr: Ventes de maisons d'habitation ordinaires
  nl: Verkopen van gewone woonhuizen
unit: count
frequency: A
source_id: statbel
geo_levels: [municipal]
preferred_direction: contextual
max_age_days: 1460
description:
  en: >
    Number of ordinary-house ("gewone woonhuizen") sale transactions recorded in the
    commune in the year, from Statbel's real-estate statistics. One of four property
    types Statbel publishes (houses, apartments, villas, building land); houses is
    loaded first because it has the best commune coverage. AVG_HOUSE_PRICE is
    recomputed from this and HOUSE_SALES_TOTAL_PRICE, never averaged across communes.
display: null
