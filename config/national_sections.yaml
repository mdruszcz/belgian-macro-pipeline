# Section layout for the national (macroeconomics) page, macro.html -- Batch 6.
#
# THIS FILE EXISTS SO macro.html CONTAINS NO INDICATOR IDS, for the same reason
# config/local_sections.yaml exists for the commune page: adding a series to
# the page is config, never a code change (the 50% gate's "zero
# indicator-specific frontend logic"). The exporter checks every id named here
# against the national payload and refuses to publish a layout that names a
# series nothing provides, so a card can never render as an empty box.
#
# Every label is trilingual (CLAUDE.md rule 7). Indicator NAMES are not here;
# they travel with the payload, from the indicators table.

# The headline cards, in this order. The design draws real GDP, population,
# employment rate, inflation, fiscal balance and public debt; this pipeline
# holds national series for two of those (GDP growth, inflation) and none for
# the other four, so the row shows the six series that exist and `kpis_note`
# says plainly what does not.
kpis:
  - GDP_QUARTERLY_YY
  - GDP_ANNUAL_CY
  - HICP
  - UNEMPLOYMENT_RATE
  - INDUSTRIAL_PROD
  - EC_CONS_CONF_BE
kpis_note:
  en: Population, the employment rate, the fiscal balance and public debt have no national series in this pipeline yet; the cards show the six that exist.
  fr: La population, le taux d’emploi, le solde budgétaire et la dette publique n’ont pas encore de série nationale dans ce pipeline ; les cartes montrent les six séries qui existent.
  nl: Bevolking, werkgelegenheidsgraad, begrotingssaldo en overheidsschuld hebben in dit pipeline nog geen nationale reeks; de kaarten tonen de zes reeksen die er zijn.

# The big chart: annual real GDP growth, as bars, every year on record.
history:
  series: GDP_ANNUAL_CY
  chart: bar
  label: {en: Real GDP growth, fr: Croissance du PIB réel, nl: Reële bbp-groei}
  note:
    en: Year-on-year change in volume, in percent, every year on record. A year of contraction is drawn in the accent colour rather than hidden.
    fr: Variation annuelle en volume, en pourcentage, sur toute la période disponible. Une année de contraction est dessinée dans la couleur d’accent plutôt que masquée.
    nl: Jaarlijkse volumeverandering, in procent, over de hele beschikbare periode. Een krimpjaar wordt in de accentkleur getekend in plaats van verborgen.

# The "key indicators" list panel: latest value and period for each.
key_list:
  - EUROSTAT_GDP_Q_MEUR
  - LABOUR_COST_BE
  - BUSINESS_CONFIDENCE
  - CONSUMER_CONFIDENCE
  - PRIV_CONSUMPTION_CY
  - GFCF_ENTERPRISES_CY

# What makes up GDP growth: the seven expenditure-side contributions, in
# percentage points, for the latest year they share. `whole` is the series
# they add up to; the page prints both so a reader can see they agree.
contributions:
  label: {en: What drove growth, fr: Les moteurs de la croissance, nl: Wat de groei dreef}
  note:
    en: Contributions to real GDP growth in percentage points, latest year; they add up to the growth rate.
    fr: Contributions à la croissance du PIB réel en points de pourcentage, dernière année ; leur somme est le taux de croissance.
    nl: Bijdragen aan de reële bbp-groei in procentpunten, laatste jaar; samen vormen ze het groeicijfer.
  whole: GDP_ANNUAL_CY
  parts:
    - PRIV_CONSUMPTION_CY
    - GOV_CONSUMPTION_CY
    - GFCF_DWELLINGS_CY
    - GFCF_ENTERPRISES_CY
    - GFCF_PUBLIC_CY
    - CHG_STOCKS_CY
    - NET_EXPORTS_CY

# Sections the design draws that this pipeline cannot fill, built at their
# designed size with the reason on the card. Each names a real gap, not a
# style choice. `link` is an optional page the card points the reader to.
unavailable:
  - id: international
    label: {en: International comparison, fr: Comparaison internationale, nl: Internationale vergelijking}
    reason:
      en: The foreign GDP series (DE, EA, ES, FR, NL) are fetched and stored, but the comparison chart that would draw them is not built yet, and Poland is not configured.
      fr: Les séries de PIB étrangères (DE, EA, ES, FR, NL) sont récupérées et enregistrées, mais le graphique de comparaison qui les afficherait n’est pas encore construit, et la Pologne n’est pas configurée.
      nl: De buitenlandse bbp-reeksen (DE, EA, ES, FR, NL) worden opgehaald en opgeslagen, maar de vergelijkingsgrafiek die ze zou tonen is nog niet gebouwd, en Polen is niet geconfigureerd.
  - id: public_finance
    label: {en: Public finances, fr: Finances publiques, nl: Overheidsfinanciën}
    reason:
      en: No national series for state revenue, expenditure, balance or debt is in this pipeline. The design’s live counters are simulated; a simulation from nothing would be an invention, so the card says so instead.
      fr: Aucune série nationale de recettes, dépenses, solde ou dette de l’État n’est dans ce pipeline. Les compteurs en direct de la maquette sont simulés ; une simulation sans base serait une invention, la carte le dit plutôt.
      nl: Geen enkele nationale reeks over ontvangsten, uitgaven, saldo of schuld van de Staat zit in dit pipeline. De live tellers van het ontwerp zijn gesimuleerd; een simulatie uit het niets zou verzinsel zijn, dus zegt de kaart dat.
  - id: economic_map
    label: {en: Economic map, fr: Carte économique, nl: Economische kaart}
    reason:
      en: No GDP per inhabitant exists at commune level in this pipeline. The interactive map of every municipal indicator is one click away.
      fr: Aucun PIB par habitant n’existe au niveau communal dans ce pipeline. La carte interactive de tous les indicateurs communaux est à un clic.
      nl: Er bestaat in dit pipeline geen bbp per inwoner op gemeenteniveau. De interactieve kaart van elke gemeentelijke indicator is één klik verder.
    link: map.html
  - id: news
    label: {en: Economic news, fr: Actualités économiques, nl: Economisch nieuws}
    reason:
      en: This pipeline holds no article store; nothing here is written by hand.
      fr: Ce pipeline ne contient aucun fonds d’articles ; rien ici n’est rédigé à la main.
      nl: Dit pipeline bevat geen artikelbestand; niets hier wordt met de hand geschreven.

# =============================================================================
# BATCH A1.4 -- in-page panels (docs/features/site_unification.md, "Macro/
# Micro : panneaux thématiques"). Own block, so a parallel batch touching the
# rest of this file (header/footer, the chart-tooltip `hero:` block at the
# end) has nothing to merge here.
#
# Seven selectable panels, French anchors decided by the maintainer. Every
# `cards` entry names an EXISTING ELEMENT ID IN macro.html (a layout id, e.g.
# "growth" or "key") -- never an indicator id (rule 24). `legacy_anchors`
# lists every anchor the page exposed for that content before this batch, so
# an old bookmark or external link still lands on the right panel (rule 31).
# =============================================================================
panels:
  - id: apercu
    label: {en: Overview, fr: Vue d'ensemble, nl: Overzicht}
    cards: [overview, kpiRow, key, map, news]
    legacy_anchors: [overview, key, map, news]
  - id: croissance
    label: {en: Growth, fr: Croissance, nl: Groei}
    cards: [growth, drivers]
    legacy_anchors: [growth, drivers]
  - id: prix
    label: {en: Prices, fr: Prix, nl: Prijzen}
    cards: [prices-chart, prices]
    legacy_anchors: []
  - id: emploi
    label: {en: Employment, fr: Emploi, nl: Werkgelegenheid}
    cards: [employment-chart, employment]
    legacy_anchors: []
  - id: conjoncture
    label: {en: Business cycle, fr: Conjoncture, nl: Conjunctuur}
    cards: [business-cycle-chart, business-cycle]
    legacy_anchors: []
  - id: finances-publiques
    label: {en: Public finances, fr: Finances publiques, nl: Overheidsfinanciën}
    cards: [public-finance]
    legacy_anchors: [public-finance]
  - id: europe
    label: {en: Europe, fr: Europe, nl: Europa}
    cards: [international]
    legacy_anchors: [international]
    # Europe keeps its existing "international" unavailable card (the foreign
    # GDP comparison, see `unavailable` above) and gets this extra note: the
    # regional map the design shows is a real, planned gap, not a rephrasing
    # of the card's own reason. No date is promised (none is known). Does
    # NOT say the card below "shows" the international comparison -- that
    # card is itself unavailable (its own `reason`, in `unavailable` above),
    # so this must not promise a comparison the reader will not actually see.
    empty_reason:
      en: A European regional comparison map is planned. The international GDP comparison is not built yet either.
      fr: Une carte de comparaison régionale européenne est prévue. La comparaison internationale du PIB n'est pas non plus construite pour l'instant.
      nl: Een Europese regionale vergelijkingskaart is gepland. De internationale bbp-vergelijking is evenmin al gebouwd.

# New thematic cards (Prix, Emploi, Conjoncture) that did not exist as
# sections before this batch. Each entry's `id` is the layout id used both by
# a `panels[].cards` entry above and by the matching <article> in macro.html;
# `series` uses the page's existing key-list card (latest value + period per
# row) -- every code here is verified against public/data/national.json to
# carry real data, the same guarantee `kpis`/`key_list` already have, and the
# exporter refuses to publish otherwise (see `_check_national_sections`).
extra_lists:
  - id: prices
    label: {en: Consumer prices, fr: Prix à la consommation, nl: Consumentenprijzen}
    series: [HICP]
  - id: employment
    label: {en: Employment and labour costs, fr: Emploi et coût du travail, nl: Werkgelegenheid en arbeidskosten}
    series: [UNEMPLOYMENT_RATE, UNEMPLOYMENT_RATE_INSURED, UNEMPLOYMENT_RATE_INSURED_MONTHLY, LABOUR_COST_BE]
  - id: business-cycle
    label: {en: Business and consumer sentiment, fr: Conjoncture et confiance, nl: Conjunctuur en vertrouwen}
    series: [BUSINESS_CONFIDENCE, CONSUMER_CONFIDENCE, EC_CONS_CONF_BE, INDUSTRIAL_PROD]

# =============================================================================
# BATCH A1.4b -- one real history chart above each of the three list cards
# above (docs/features/site_unification.md, "Graphiques"), so Prix/Emploi/
# Conjoncture stop being a key-value list alone. Same `{id, label, series}`
# shape as `extra_lists` above, and the same guarantee: the exporter checks
# every series named here against public/data/national.json and refuses to
# publish a chart nothing can draw. `id` is a layout id, camel-cased by
# macro.html into its element ids ("prices-chart" -> #pricesChartCanvas),
# never an indicator id (rule 24). Charting more than one series (Conjoncture
# only) requires the maintainer's brief's own condition: the series must
# share a unit, or the second stays in the list instead -- verified here
# (BUSINESS_CONFIDENCE and CONSUMER_CONFIDENCE are both `balance`), not
# re-derived by macro.html at render time.
panel_charts:
  - id: prices-chart
    label: {en: "HICP, month by month", fr: "IPCH, mois par mois", nl: "GICP, maand na maand"}
    series: [HICP]
  - id: employment-chart
    label: {en: "Unemployment rate, month by month", fr: "Taux de chômage, mois par mois", nl: "Werkloosheidsgraad, maand na maand"}
    series: [UNEMPLOYMENT_RATE]
  - id: business-cycle-chart
    label: {en: Business and consumer confidence, fr: Confiance des entreprises et des consommateurs, nl: Ondernemers- en consumentenvertrouwen}
    series: [BUSINESS_CONFIDENCE, CONSUMER_CONFIDENCE]

# ---------------------------------------------------------------------------
# Batch A1.3 (docs/features/site_unification.md, "Home2 : corriger la
# composition") -- home2.html's hero picks its two mini-charts from here
# instead of sorting national.json client-side at render time (the previous
# `nationalOrder()` heuristic in home2.html: rate-shaped series first, then
# alphabetical). Declaring the two ids here means home2.html contains no
# indicator id of its own (rule 2/24), and a future change to which two
# series lead the homepage is a one-line config edit, not a page edit.
# These are the two ids `nationalOrder()` already lands on today (quarterly
# real GDP growth year-on-year, and HICP inflation year-on-year) -- verified
# by running that exact logic against the published national.json before
# writing this list, not guessed.
hero:
  - GDP_QUARTERLY_YY
  - HICP
