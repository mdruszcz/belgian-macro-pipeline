# Section layout for the national (macroeconomics) page, macro.html -- Batch 6.
#
# THIS FILE EXISTS SO macro.html CONTAINS NO INDICATOR IDS, for the same reason
# config/local_sections.yaml exists for the commune page: adding a series to
# the page is config, never a code change (the 50% gate's "zero
# indicator-specific frontend logic"). The exporter checks every id named here
# against the national payload and refuses to publish a layout that names a
# series nothing provides, so a card can never render as an empty box.
#
# Every label is trilingual (CLAUDE.md rule 7). Indicator NAMES are not here;
# they travel with the payload, from the indicators table.

# The headline cards, in this order. The design draws real GDP, population,
# employment rate, inflation, fiscal balance and public debt; this pipeline
# holds national series for two of those (GDP growth, inflation) and none for
# the other four, so the row shows the six series that exist and `kpis_note`
# says plainly what does not.
kpis:
  - GDP_QUARTERLY_YY
  - GDP_ANNUAL_CY
  - HICP
  - UNEMPLOYMENT_RATE
  - INDUSTRIAL_PROD
  - EC_CONS_CONF_BE
kpis_note:
  # Issue #309 PR 2: population, the fiscal balance and public debt stopped
  # being true gaps once the Finances publiques chapter shipped (simulated
  # counters plus real Eurostat official figures) -- they are just not part
  # of THIS six-card headline row. Only the employment rate (taux d'emploi,
  # distinct from the unemployment rate this pipeline does carry) remains an
  # actual gap. Wording not yet confirmed by the maintainer (rule 40).
  en: Population, the fiscal balance and public debt are now shown in the Finances publiques chapter; the employment rate still has no national series in this pipeline. The cards above show the six that do.
  fr: La population, le solde budgétaire et la dette publique sont désormais présentés dans le chapitre Finances publiques ; le taux d’emploi n’a toujours pas de série nationale dans ce pipeline. Les cartes ci-dessus montrent les six séries qui existent.
  nl: Bevolking, het begrotingssaldo en de overheidsschuld worden nu getoond in het hoofdstuk Overheidsfinanciën; de werkgelegenheidsgraad heeft nog geen nationale reeks in dit pipeline. De kaarten hierboven tonen de zes reeksen die er wel zijn.

# The big chart: annual real GDP growth, as bars, every year on record.
history:
  series: GDP_ANNUAL_CY
  chart: bar
  label: {en: Real GDP growth, fr: Croissance du PIB réel, nl: Reële bbp-groei}
  note:
    en: Year-on-year change in volume, in percent, every year on record. A year of contraction is drawn in the accent colour rather than hidden.
    fr: Variation annuelle en volume, en pourcentage, sur toute la période disponible. Une année de contraction est dessinée dans la couleur d’accent plutôt que masquée.
    nl: Jaarlijkse volumeverandering, in procent, over de hele beschikbare periode. Een krimpjaar wordt in de accentkleur getekend in plaats van verborgen.

# The "key indicators" list panel: latest value and period for each.
key_list:
  - EUROSTAT_GDP_Q_MEUR
  - LABOUR_COST_BE
  - BUSINESS_CONFIDENCE
  - CONSUMER_CONFIDENCE
  - PRIV_CONSUMPTION_CY
  - GFCF_ENTERPRISES_CY

# What makes up GDP growth: the seven expenditure-side contributions, in
# percentage points, for the latest year they share. `whole` is the series
# they add up to; the page prints both so a reader can see they agree.
contributions:
  label: {en: What drove growth, fr: Les moteurs de la croissance, nl: Wat de groei dreef}
  note:
    en: Contributions to real GDP growth in percentage points, latest year; they add up to the growth rate.
    fr: Contributions à la croissance du PIB réel en points de pourcentage, dernière année ; leur somme est le taux de croissance.
    nl: Bijdragen aan de reële bbp-groei in procentpunten, laatste jaar; samen vormen ze het groeicijfer.
  whole: GDP_ANNUAL_CY
  parts:
    - PRIV_CONSUMPTION_CY
    - GOV_CONSUMPTION_CY
    - GFCF_DWELLINGS_CY
    - GFCF_ENTERPRISES_CY
    - GFCF_PUBLIC_CY
    - CHG_STOCKS_CY
    - NET_EXPORTS_CY

# Sections the design draws that this pipeline cannot fill, built at their
# designed size with the reason on the card. Each names a real gap, not a
# style choice. `link` is an optional page the card points the reader to.
unavailable:
  # `international` (the foreign GDP comparison card on the Europe panel)
  # lived here from the international pilot until the Europe countries
  # batch (docs/features/europe_countries.md, 2026-09-15): the "Comparaison
  # internationale" card is now built for real (assets/belpulse/europe_map.js
  # renderComparisonCharts()), so this entry -- and the europe panel's own
  # `empty_reason` below -- are gone. #international stays a valid anchor
  # (rule 31): panels.js resolves it via the europe panel's own
  # `legacy_anchors`, unrelated to this list.
  #
  # `public_finance` lived here from Batch 6 (no national revenue/expenditure/
  # balance/debt series existed) until issue #309 PR 1 loaded 26 real Eurostat
  # general-government series and PR 2 built the chapter on them (simulated
  # live counters plus real official figures, see `finances_publiques` below)
  # -- ADR docs/decisions/0016-simulated-live-counters.md. #public-finance
  # stays a valid anchor: the finances-publiques panel's own `legacy_anchors`
  # below resolves it now, unrelated to this list.
  - id: economic_map
    label: {en: Economic map, fr: Carte économique, nl: Economische kaart}
    reason:
      en: No GDP per inhabitant exists at commune level in this pipeline. The interactive map of every municipal indicator is one click away.
      fr: Aucun PIB par habitant n’existe au niveau communal dans ce pipeline. La carte interactive de tous les indicateurs communaux est à un clic.
      nl: Er bestaat in dit pipeline geen bbp per inwoner op gemeenteniveau. De interactieve kaart van elke gemeentelijke indicator is één klik verder.
    link: map.html
  - id: news
    label: {en: Economic news, fr: Actualités économiques, nl: Economisch nieuws}
    reason:
      en: This pipeline holds no article store; nothing here is written by hand.
      fr: Ce pipeline ne contient aucun fonds d’articles ; rien ici n’est rédigé à la main.
      nl: Dit pipeline bevat geen artikelbestand; niets hier wordt met de hand geschreven.

# =============================================================================
# BATCH A1.4 -- in-page panels (docs/features/site_unification.md, "Macro/
# Micro : panneaux thématiques"). Own block, so a parallel batch touching the
# rest of this file (header/footer, the chart-tooltip `hero:` block at the
# end) has nothing to merge here.
#
# Seven selectable panels, French anchors decided by the maintainer. Every
# `cards` entry names an EXISTING ELEMENT ID IN macro.html (a layout id, e.g.
# "growth" or "key") -- never an indicator id (rule 24). `legacy_anchors`
# lists every anchor the page exposed for that content before this batch, so
# an old bookmark or external link still lands on the right panel (rule 31).
# =============================================================================
panels:
  - id: apercu
    label: {en: Overview, fr: Vue d'ensemble, nl: Overzicht}
    cards: [overview, kpiRow, key, map, news]
    legacy_anchors: [overview, key, map, news]
  - id: croissance
    label: {en: Growth, fr: Croissance, nl: Groei}
    cards: [growth, drivers]
    legacy_anchors: [growth, drivers]
  - id: prix
    label: {en: Prices, fr: Prix, nl: Prijzen}
    cards: [prices-chart, prices]
    legacy_anchors: []
  - id: emploi
    label: {en: Employment, fr: Emploi, nl: Werkgelegenheid}
    cards: [employment-chart, employment]
    legacy_anchors: []
  - id: conjoncture
    label: {en: Business cycle, fr: Conjoncture, nl: Conjunctuur}
    cards: [business-cycle-chart, business-cycle]
    legacy_anchors: []
  - id: finances-publiques
    label: {en: Public finances, fr: Finances publiques, nl: Overheidsfinanciën}
    # Issue #309 PR 2: the single placeholder card ("public-finance") is gone
    # -- four real blocks now sit in this panel (the simulated live strip,
    # the two breakdown cards, and the official Eurostat figures block). See
    # `finances_publiques` below for what each one reads.
    cards: [finance-live-strip, finance-breakdown-revenue, finance-breakdown-spending, finance-official]
    legacy_anchors: [public-finance]
  - id: europe
    label: {en: Europe, fr: Europe, nl: Europa}
    cards: [international]
    legacy_anchors: [international]
    # Europe countries batch (docs/features/europe_countries.md): the panel
    # now holds BOTH map modes (Batch B3's regional NUTS 2 choropleth, and
    # this batch's country NUTS 0 choropleth + picker, toggled in
    # assets/belpulse/europe_map.js) and the "Comparaison internationale"
    # small multiples below them -- no `empty_reason` left to show; nothing
    # here is still a known gap.

# New thematic cards (Prix, Emploi, Conjoncture) that did not exist as
# sections before this batch. Each entry's `id` is the layout id used both by
# a `panels[].cards` entry above and by the matching <article> in macro.html;
# `series` uses the page's existing key-list card (latest value + period per
# row) -- every code here is verified against public/data/national.json to
# carry real data, the same guarantee `kpis`/`key_list` already have, and the
# exporter refuses to publish otherwise (see `_check_national_sections`).
extra_lists:
  - id: prices
    label: {en: Consumer prices, fr: Prix à la consommation, nl: Consumentenprijzen}
    series: [HICP]
  - id: employment
    label: {en: Employment and labour costs, fr: Emploi et coût du travail, nl: Werkgelegenheid en arbeidskosten}
    series: [UNEMPLOYMENT_RATE, UNEMPLOYMENT_RATE_INSURED, UNEMPLOYMENT_RATE_INSURED_MONTHLY, LABOUR_COST_BE]
  - id: business-cycle
    label: {en: Business and consumer sentiment, fr: Conjoncture et confiance, nl: Conjunctuur en vertrouwen}
    series: [BUSINESS_CONFIDENCE, CONSUMER_CONFIDENCE, EC_CONS_CONF_BE, INDUSTRIAL_PROD]

# =============================================================================
# BATCH A1.4b -- one real history chart above each of the three list cards
# above (docs/features/site_unification.md, "Graphiques"), so Prix/Emploi/
# Conjoncture stop being a key-value list alone. Same `{id, label, series}`
# shape as `extra_lists` above, and the same guarantee: the exporter checks
# every series named here against public/data/national.json and refuses to
# publish a chart nothing can draw. `id` is a layout id, camel-cased by
# macro.html into its element ids ("prices-chart" -> #pricesChartCanvas),
# never an indicator id (rule 24). Charting more than one series (Conjoncture
# only) requires the maintainer's brief's own condition: the series must
# share a unit, or the second stays in the list instead -- verified here
# (BUSINESS_CONFIDENCE and CONSUMER_CONFIDENCE are both `balance`), not
# re-derived by macro.html at render time.
panel_charts:
  - id: prices-chart
    label: {en: "HICP inflation, annual rate by month", fr: "Inflation IPCH, taux annuel par mois", nl: "HICP-inflatie, jaarritme per maand"}
    series: [HICP]
  - id: employment-chart
    label: {en: "Unemployment rate over time", fr: "Évolution du taux de chômage", nl: "Evolutie van de werkloosheidsgraad"}
    series: [UNEMPLOYMENT_RATE]
  - id: business-cycle-chart
    label: {en: Business and consumer confidence, fr: Confiance des entreprises et des consommateurs, nl: Ondernemers- en consumentenvertrouwen}
    series: [BUSINESS_CONFIDENCE, CONSUMER_CONFIDENCE]

# ---------------------------------------------------------------------------
# Batch A1.3 (docs/features/site_unification.md, "Home2 : corriger la
# composition") -- home2.html's hero picks its two mini-charts from here
# instead of sorting national.json client-side at render time (the previous
# `nationalOrder()` heuristic in home2.html: rate-shaped series first, then
# alphabetical). Declaring the two ids here means home2.html contains no
# indicator id of its own (rule 2/24), and a future change to which two
# series lead the homepage is a one-line config edit, not a page edit.
# These are the two ids `nationalOrder()` already lands on today (quarterly
# real GDP growth year-on-year, and HICP inflation year-on-year) -- verified
# by running that exact logic against the published national.json before
# writing this list, not guessed.
hero:
  - GDP_QUARTERLY_YY
  - HICP

# =============================================================================
# Issue #309 PR 2 -- the #finances-publiques chapter's own cards/charts and
# the live-counter placements/breakdowns macro.html and home2.html iterate.
#
# This mirrors config/live_counters.yaml's own role one level up: that file
# names which counters/parts exist and where they may be placed
# (`placements:`); this block says which of those placements/parts each PAGE
# actually draws, and which real Eurostat indicators the separate, NEVER
# SIMULATED "Official figures" block below the live strip reads. Neither
# page names a counter id, a placement name or an indicator id of its own --
# CLAUDE.md rules 2/24 extended to this chapter specifically (round-2 fix,
# docs/decisions/0016-simulated-live-counters.md): `scripts/
# export_site_payloads.py`'s `_check_finances_publiques` refuses to publish
# this block if it names a counter/placement config/live_counters.yaml does
# not declare, or an indicator national.json does not carry, or a label
# missing a language -- the same "cannot render as an empty box" guarantee
# every other list in this file already gets.
#
# Before PR 2 this lived in its own file, a mockup-only
# public/data/metadata/finances_publiques_sections.json, because the real
# site's national_sections.json did not exist yet when that mockup was
# built. Folded in here instead of staying separate: both pages already
# fetch this one file, so this chapter does not become the only one reading
# a second config alongside it.
finances_publiques:
  # Round-2 design decision (docs/decisions/0016): ONE chapter-level badge +
  # ONE pause button controls every simulated region in the chapter (the
  # strip and both breakdown cards) -- `chapter_badge`/`chapter_pause` name
  # the two elements macro.html's own FinancesPubliques module wires up.
  # Each region still carries its OWN short, visible `.bp-simulated-badge`
  # tag (ids given per-region below) only so `BPLiveCounters.mount()`'s own
  # guard (refuses to start without one) still applies to each separately.
  #
  # `strip_placement` is the placement macro.html's own strip reads;
  # `home_strip_placement` is the SEPARATE placement home2.html's compact
  # strip reads -- two different fields, not one reused, so each page gets
  # the counter order config/live_counters.yaml actually declares for it
  # (`macro_strip`: population/revenue/spending/deficit/debt;
  # `home_strip`: population/debt/deficit/revenue/spending).
  simulated:
    strip_placement: macro_strip
    home_strip_placement: home_strip
    chapter_badge: finChapterBadge
    chapter_pause: finChapterPause
    strip_card: finance-live-strip
    strip_list: finStripCounters
    strip_badge: finStripBadge
    strip_headline: finStripHeadline
    strip_why: finStripWhy
    # Round-1 fix: `counter`/placement/element ids used to be literals in
    # macro.html's own <script> ('revenue', 'spending', 'macro_strip', ...)
    # -- this list is the one place they live now; both pages iterate it
    # instead of naming a counter.
    breakdowns:
      - counter: revenue
        card: finance-breakdown-revenue
        title_key: finRevenueByType
        year_key: finRevenueShareYear
        year_note: finRevenueYearNote
        bar: finRevenueShareBar
        list: finRevenueShareList
        badge: finRevenueBadge
        headline: finRevenueHeadline
        why: finRevenueWhy
      - counter: spending
        card: finance-breakdown-spending
        title_key: finSpendingByFunction
        year_key: finSpendingShareYear
        year_note: finSpendingYearNote
        bar: finSpendingShareBar
        list: finSpendingShareList
        badge: finSpendingBadge
        headline: finSpendingHeadline
        why: finSpendingWhy
  # The NEVER-SIMULATED block: the latest confirmed Eurostat figures, read
  # straight from public/data/national.json, exactly like every other card
  # on this page -- no badge, no pause button, visually the opposite of the
  # live strip above it. `cards[].items[].indicator` is checked against
  # national.json the same way `kpis`/`key_list` above are.
  official_figures:
    label: {en: Official figures, fr: Chiffres officiels, nl: Officiële cijfers}
    note:
      en: The latest confirmed figures from Eurostat, not simulated.
      fr: Les derniers chiffres confirmés d’Eurostat, non simulés.
      nl: De laatste bevestigde cijfers van Eurostat, niet gesimuleerd.
    cards:
      - id: debt
        label: {en: Government debt, fr: Dette publique, nl: Overheidsschuld}
        # Round-2 fix: the quarterly indicator the SIMULATED debt counter's
        # own basis[] anchors on (live_counters.json: basis[].role==='anchor')
        # -- macro.html's method note matches its anchor against this field
        # to find this card, never by naming GOV_DEBT_Q_MEUR_BE in the script.
        anchor_indicator: GOV_DEBT_Q_MEUR_BE
        items:
          - indicator: GOV_DEBT_MEUR_BE
          - indicator: GOV_DEBT_PCT_GDP_BE
      - id: balance
        # No `label`: the page picks "Deficit (net borrowing)" / "Surplus
        # (net lending)" from the series' own live sign (finDeficitFull/
        # finSurplusFull), never a label typed here.
        signed_label: true
        items:
          - indicator: GOV_BALANCE_MEUR_BE
          - indicator: GOV_BALANCE_PCT_GDP_BE
      - id: revenue
        label: {en: Revenue, fr: Recettes, nl: Ontvangsten}
        items:
          - indicator: GOV_REVENUE_BE
      - id: expenditure
        label: {en: Spending, fr: Dépenses, nl: Uitgaven}
        items:
          - indicator: GOV_EXPENDITURE_BE
  # Five sibling chart cells (debt in EUR, debt in % of GDP, balance,
  # revenue, spending) -- debt-eur-chart/debt-pct-chart share one short
  # label, differentiated only by the unit macro.html's own displayUnit()
  # appends once per chart (no indicator id in that logic).
  charts:
    - id: debt-eur-chart
      series: [GOV_DEBT_MEUR_BE]
      label: {en: Government debt, fr: Dette publique, nl: Overheidsschuld}
    - id: debt-pct-chart
      series: [GOV_DEBT_PCT_GDP_BE]
      label: {en: Government debt, fr: Dette publique, nl: Overheidsschuld}
    - id: balance-chart
      series: [GOV_BALANCE_MEUR_BE]
      # Additive opts.zeroLine in macro_portrait_charts.js: folds 0 into the
      # chart's own domain so a reference gridline always exists, and widens
      # the left margin to fit this chart's own (signed, wider) axis labels.
      zero_line: true
      label: {en: "Net lending (+) / net borrowing (−)", fr: "Capacité (+) / besoin (−) de financement", nl: "Vorderingenoverschot (+) / -tekort (−)"}
      subtitle_key: finBalanceChartSubtitle
    - id: revenue-chart
      series: [GOV_REVENUE_BE]
      label: {en: Revenue, fr: Recettes, nl: Ontvangsten}
    - id: spending-chart
      series: [GOV_EXPENDITURE_BE]
      label: {en: Spending, fr: Dépenses, nl: Uitgaven}
