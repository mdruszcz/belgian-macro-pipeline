licence_note:
  en: >-
    Municipal accounts compiled by the Walloon public service (SPW, Département des Finances
    locales) and republished per inhabitant by IWEPS on WalStat under CC0 -- no attribution
    required, reused freely. Walloon communes only. IWEPS accepts no responsibility for how the
    figures are reused; every ratio computed here is BelPulse's own.
  fr: >-
    Comptes communaux établis par le Service public de Wallonie (SPW, Département des Finances
    locales) et republiés par habitant par l'IWEPS sur WalStat sous licence CC0 — sans
    obligation de mention, librement réutilisables. Communes wallonnes uniquement. L'IWEPS
    décline toute responsabilité quant à la réutilisation ; chaque ratio calculé ici est celui
    de BelPulse.
  nl: >-
    Gemeenterekeningen opgesteld door de Waalse overheidsdienst (SPW, Département des Finances
    locales) en per inwoner heruitgegeven door het IWEPS op WalStat onder CC0 — geen
    bronvermelding vereist, vrij herbruikbaar. Alleen Waalse gemeenten. Het IWEPS aanvaardt geen
    aansprakelijkheid voor het hergebruik; elke hier berekende ratio is die van BelPulse.
