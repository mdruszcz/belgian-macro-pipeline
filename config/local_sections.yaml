# Section layout for the /local commune page.
#
# THIS FILE EXISTS SO local.html CONTAINS NO INDICATOR IDS. The 50% gate's
# "zero indicator-specific frontend logic" check (and Block B's whole premise)
# means adding an indicator to a page must be config, not a code change. The
# page renders whatever this file describes; it knows about sections, charts
# and fact tiles, never about POPULATION_BY_COMMUNE.
#
# Every label is trilingual per CLAUDE.md rule 7. Indicator NAMES are not here
# -- those travel in the payload from the indicators table and the derived
# configs, so they cannot drift from the data.
#
# `headline`: the chart indicator for the section, which also gets the full
#   comparison table and the percentile component.
# `indicators`: supporting figures, rendered as fact tiles with a one-line
#   national position each.
# `unavailable`: a section with no data yet. The reason is shown to the
#   reader, because "not collected" and "coming in Phase II" are different
#   situations and a blank space reads as a bug.

# The hero row at the top of a commune page: the figures a reader sees first,
# in this order. Here rather than in local.html for the same reason the sections
# below are -- the 50% gate checks for "zero indicator-specific frontend logic",
# and this list was the one thing still hardcoded in the page (LocalUI.HEADLINE_SPEC).
# An indicator named here must exist in the payloads or the export refuses to
# build, the same check the sections get.
headlines:
  - POPULATION_BY_COMMUNE
  - POPULATION_CHANGE_5Y
  - AVG_NET_TAXABLE_INCOME
  - LOCAL_UNITS_BY_COMMUNE
  - ADMIN_UNEMPLOYMENT_RATE_COM
  - MEDIAN_HOUSE_PRICE

# Part-of-whole groups: which indicators together make up a whole. This is
# the declaration the age donut on commune.html waited for since Batch 4 --
# nothing published said WHICH indicators partition a whole, and the page
# refused to guess. The exporter does not take the claim on trust: where a
# `whole` is named, it checks that the parts sum to it in every commune and
# every period they share, and refuses to publish the layout if they do not
# (rule 13). A group with no `whole` is a breakdown whose total is simply
# the sum of its parts.
#
# `chart` is a hint for the page, not a data property: `donut` for a
# structure of shares, `bars` for a breakdown read left to right.
compositions:
  - id: age_structure
    label: {en: Age structure, fr: Répartition par âge, nl: Leeftijdsstructuur}
    note:
      en: Three bands, not the four the design shows — that is how the source publishes them.
      fr: Trois tranches, et non les quatre de la maquette — c’est ainsi que la source les publie.
      nl: Drie groepen, niet de vier van het ontwerp — zo publiceert de bron ze.
    chart: donut
    whole: POPULATION_BY_COMMUNE
    parts:
      - POPULATION_AGE_0_14
      - POPULATION_AGE_15_64
      - POPULATION_AGE_65_PLUS
sections:
  - id: demography
    label: {en: Demography, fr: Démographie, nl: Demografie}
    blurb:
      en: Population, how it has moved, and its age structure.
      fr: La population, son évolution et sa structure par âge.
      nl: Bevolking, evolutie en leeftijdsstructuur.
    headline: POPULATION_BY_COMMUNE
    indicators:
      - POPULATION_AGE_0_14
      - POPULATION_AGE_15_64
      - POPULATION_AGE_65_PLUS
      - DEPENDENCY_RATIO
      - POPULATION_CHANGE_5Y
      - POPULATION_CAGR_10Y
      - POP_FEMALE
      - POP_MARRIED

  - id: origins
    label: {en: Origins, fr: Origines, nl: Herkomst}
    blurb:
      en: Citizenship and country of birth, from Census 2021.
      fr: Nationalité et pays de naissance, d’après le Census 2021.
      nl: Nationaliteit en geboorteland, volgens de Census 2021.
    headline: SHARE_FOREIGN_NATIONALS
    indicators:
      - POP_FOREIGN_NATIONALS
      - POP_NON_EU_NATIONALS
      - POP_BORN_ABROAD
      - SHARE_BORN_ABROAD

  - id: households
    label: {en: Households & families, fr: Ménages et familles, nl: Huishoudens en gezinnen}
    blurb:
      en: How people live together — the figure behind school, housing and care planning.
      fr: La composition des ménages — ce qui détermine les besoins en écoles, logements et soins.
      nl: Hoe mensen samenleven — bepalend voor scholen, woningen en zorg.
    headline: AVERAGE_HOUSEHOLD_SIZE
    indicators:
      - HOUSEHOLDS_PRIVATE
      - HOUSEHOLDS_SINGLE_PERSON
      - SHARE_SINGLE_PERSON_HOUSEHOLDS
      - FAMILY_NUCLEI
      - FAMILY_NUCLEI_SINGLE_PARENT
      - SHARE_SINGLE_PARENT_FAMILIES

  - id: income
    label: {en: Income & local taxes, fr: Revenus et fiscalité locale, nl: Inkomen en lokale belastingen}
    blurb:
      en: Average income per tax return, and the commune’s tax base.
      fr: Revenu moyen par déclaration et base fiscale de la commune.
      nl: Gemiddeld inkomen per aangifte en de belastingbasis van de gemeente.
    headline: AVG_NET_TAXABLE_INCOME
    indicators:
      - FISCAL_TOT_NET_TAXABLE_INC
      - FISCAL_NBR_NON_ZERO_INC
      - FISCAL_TOT_TAXES
      - FISCAL_TOT_MUNICIP_TAXES

  - id: housing
    label: {en: Housing, fr: Logement, nl: Wonen}
    blurb:
      en: >
        Median house sale price, updated quarterly by Statbel, and the dwelling stock as
        counted by Census 2021. The median is not comparable to province, region or
        Belgium — a median cannot be honestly aggregated the way a total can.
      fr: >
        Prix médian de vente des maisons, mis à jour chaque trimestre par Statbel, et le
        parc de logements recensé par le Census 2021. Le prix médian n’est pas comparable
        à la province, à la région ou à la Belgique — un tel taux ne peut être agrégé
        honnêtement.
      nl: >
        Mediane verkoopprijs van woningen, elk kwartaal bijgewerkt door Statbel, en de
        woningvoorraad volgens de Census 2021. De mediaan is niet vergelijkbaar met
        provincie, gewest of België — een mediaan kan niet eerlijk worden opgeteld.
    headline: MEDIAN_HOUSE_PRICE
    indicators:
      - HOUSE_SALES_TRANSACTIONS
      - SHARE_DWELLINGS_UNOCCUPIED
      - DWELLINGS_TOTAL
      - DWELLINGS_OCCUPIED
      - DWELLINGS_VACANT
      - DWELLINGS_IN_SINGLE_UNIT_BUILDING

  - id: business
    label: {en: Business, fr: Entreprises, nl: Ondernemingen}
    blurb:
      en: Local business units registered in the commune.
      fr: Unités d’établissement enregistrées dans la commune.
      nl: Vestigingseenheden in de gemeente.
    headline: LOCAL_UNITS_BY_COMMUNE
    indicators: []

  - id: employment
    label: {en: Employment, fr: Emploi, nl: Werk}
    blurb:
      en: >
        The administrative unemployment rate for ages 15–64 from Steunpunt Werk's Vlaamse
        Arbeidsrekening, complemented by annual ONEM/RVA benefit-claimant figures. The two are
        related but not interchangeable: only the first is measured against the labour force.
      fr: >
        Le taux de chômage administratif des 15–64 ans de la Vlaamse Arbeidsrekening de Steunpunt
        Werk, complété par les chiffres annuels des bénéficiaires de l’ONEM. Ces mesures sont liées
        mais non interchangeables : seule la première est rapportée à la population active.
      nl: >
        De administratieve werkloosheidsgraad voor 15–64-jarigen uit de Vlaamse Arbeidsrekening van
        Steunpunt Werk, aangevuld met jaarlijkse RVA-cijfers over uitkeringsgerechtigden. De maten
        hangen samen maar zijn niet onderling verwisselbaar: alleen de eerste gebruikt de beroepsbevolking.
    headline: ADMIN_UNEMPLOYMENT_RATE_COM
    indicators:
      - UNEMPLOYED_JOBSEEKERS
      - UNEMPLOYMENT_BENEFIT_RECIPIENTS
      - TEMP_UNEMPLOYED
      - PART_TIME_BENEFIT_RECIPIENTS
      - UNEMPLOYMENT_BENEFIT_PAID
      - TEMP_UNEMPLOYMENT_BENEFIT_PAID
      - ACTIVATION_MEASURES_PAID

  - id: safety
    label: {en: Safety, fr: Sécurité, nl: Veiligheid}
    blurb:
      en: >
        Recorded-crime rates from the federal police, each per 10,000 of its own denominator
        (dwellings, cars, vehicles or households — never population), and each resolved onto a
        single fixed pre-2025-merger commune map regardless of the year shown, since that is how
        the source itself publishes its own history. The most recent year of each series is
        provisional; not comparable across provinces/regions/Belgium since a rate like this cannot
        be honestly aggregated.
      fr: >
        Taux d’infractions enregistrées par la police fédérale, chacun rapporté à son propre
        dénominateur (logements, voitures, véhicules ou ménages — jamais la population), et chacun
        calculé sur une carte communale fixe antérieure aux fusions de 2025, quelle que soit
        l’année affichée, car c’est ainsi que la source publie elle-même son historique. L’année la
        plus récente de chaque série est provisoire ; non comparable à la province/région/Belgique
        puisqu’un tel taux ne peut être agrégé honnêtement.
      nl: >
        Cijfers over geregistreerde criminaliteit van de federale politie, telkens per 10 000 van
        hun eigen noemer (woningen, auto’s, voertuigen of huishoudens — nooit bevolking), en telkens
        berekend op één vaste gemeentekaart van vóór de fusies van 2025, ongeacht het weergegeven
        jaar, want zo publiceert de bron zelf haar eigen geschiedenis. Het meest recente jaar van
        elke reeks is voorlopig; niet vergelijkbaar met provincie/gewest/België aangezien zo’n
        percentage niet eerlijk kan worden opgeteld.
    headline: HOUSE_BURGLARIES_PER_10K
    indicators:
      - HOUSE_BURGLARIES_PER_10K
      - CAR_THEFT_PER_10K
      - THEFT_FROM_VEHICLE_PER_10K
      - DOMESTIC_VIOLENCE_PER_10K

  - id: mobility
    label: {en: Mobility, fr: Mobilité, nl: Mobiliteit}
    unavailable:
      en: Mobility data collection is deferred — no dataset was selected for it.
      fr: La collecte de données de mobilité est reportée — aucun jeu de données n’a été retenu.
      nl: Mobiliteitsdata zijn uitgesteld — er is geen dataset voor geselecteerd.

  - id: finances
    label: {en: Municipal finances, fr: Finances communales, nl: Gemeentefinanciën}
    unavailable:
      en: Coming in Phase II — Walloon municipal finance is the next block of the roadmap.
      fr: Prévu en phase II — les finances communales wallonnes sont le prochain bloc de la feuille de route.
      nl: Komt in fase II — de Waalse gemeentefinanciën zijn het volgende blok van de roadmap.
