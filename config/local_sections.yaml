# Section layout for the /local commune page.
#
# THIS FILE EXISTS SO local.html CONTAINS NO INDICATOR IDS. The 50% gate's
# "zero indicator-specific frontend logic" check (and Block B's whole premise)
# means adding an indicator to a page must be config, not a code change. The
# page renders whatever this file describes; it knows about sections, charts
# and fact tiles, never about POPULATION_BY_COMMUNE.
#
# Every label is trilingual per CLAUDE.md rule 7. Indicator NAMES are not here
# -- those travel in the payload from the indicators table and the derived
# configs, so they cannot drift from the data.
#
# `headline`: the chart indicator for the section, which also gets the full
#   comparison table and the percentile component.
# `indicators`: supporting figures, rendered as fact tiles with a one-line
#   national position each.
# `unavailable`: a section with no data yet. The reason is shown to the
#   reader, because "not collected" and "coming in Phase II" are different
#   situations and a blank space reads as a bug.

# The hero row at the top of a commune page: the figures a reader sees first,
# in this order. Here rather than in local.html for the same reason the sections
# below are -- the 50% gate checks for "zero indicator-specific frontend logic",
# and this list was the one thing still hardcoded in the page (LocalUI.HEADLINE_SPEC).
# An indicator named here must exist in the payloads or the export refuses to
# build, the same check the sections get.
headlines:
  - POPULATION_BY_COMMUNE
  - POPULATION_CHANGE_5Y
  - AVG_NET_TAXABLE_INCOME
  - LOCAL_UNITS_BY_COMMUNE
  - UNEMPLOYMENT_RATE_INSURED
  - MEDIAN_HOUSE_PRICE

# Part-of-whole groups: which indicators together make up a whole. This is
# the declaration the age donut on commune.html waited for since Batch 4 --
# nothing published said WHICH indicators partition a whole, and the page
# refused to guess. The exporter does not take the claim on trust: where a
# `whole` is named, it checks that the parts sum to it in every commune and
# every period they share, and refuses to publish the layout if they do not
# (rule 13). A group with no `whole` is a breakdown whose total is simply
# the sum of its parts.
#
# `chart` is a hint for the page, not a data property: `donut` for a
# structure of shares, `bars` for a breakdown read left to right.
compositions:
  - id: age_structure
    label: {en: Age structure, fr: Répartition par âge, nl: Leeftijdsstructuur}
    note:
      en: Three bands, not the four the design shows — that is how the source publishes them.
      fr: Trois tranches, et non les quatre de la maquette — c’est ainsi que la source les publie.
      nl: Drie groepen, niet de vier van het ontwerp — zo publiceert de bron ze.
    chart: donut
    whole: POPULATION_BY_COMMUNE
    parts:
      - POPULATION_AGE_0_14
      - POPULATION_AGE_15_64
      - POPULATION_AGE_65_PLUS
sections:
  - id: demography
    label: {en: Demography, fr: Démographie, nl: Demografie}
    blurb:
      en: >
        Population, how it has moved, and its age structure. Births and deaths are annual
        counts; internal migration is shown both as arrivals and departures (counts) and as
        the net balance Statbel publishes (arrivals minus departures, signed) — none of these
        cover the 31 communes that merged, for 2018 or 2024 respectively. Each count is
        followed by its rate per 1,000 residents (ADR 0014), which the same 31 communes also
        lack for those two years.
      fr: >
        La population, son évolution et sa structure par âge. Les naissances et décès sont
        des totaux annuels ; la migration interne est présentée à la fois en arrivées et en
        départs (des totaux) et comme le solde net publié par Statbel (arrivées moins départs,
        avec son signe) — aucun de ces chiffres ne couvre les 31 communes fusionnées, pour
        2018 ou 2024 respectivement. Chaque total est suivi de son taux par 1 000 habitants
        (ADR 0014), que les mêmes 31 communes n'ont pas non plus pour ces deux années.
      nl: >
        Bevolking, evolutie en leeftijdsstructuur. Geboorten en overlijdens zijn jaarlijkse
        totalen; interne migratie wordt getoond als zowel aankomsten als vertrekken (totalen)
        en als het nettosaldo dat Statbel publiceert (aankomsten min vertrekken, met teken) —
        geen van beide dekt de 31 fusiegemeenten, voor 2018 of 2024 respectievelijk. Elk totaal
        wordt gevolgd door zijn cijfer per 1 000 inwoners (ADR 0014), dat diezelfde 31
        gemeenten evenmin hebben voor die twee jaren.
    headline: POPULATION_BY_COMMUNE
    indicators:
      - POPULATION_AGE_0_14
      - POPULATION_AGE_15_64
      - POPULATION_AGE_65_PLUS
      - DEPENDENCY_RATIO
      - POPULATION_CHANGE_5Y
      - POPULATION_CAGR_10Y
      - POP_FEMALE
      - POP_MARRIED
      - BIRTHS
      - BIRTH_RATE_PER_1000
      - DEATHS
      - DEATH_RATE_PER_1000
      - INTERNAL_MIGRATION_IN
      - INTERNAL_MIGRATION_IN_RATE_PER_1000
      - INTERNAL_MIGRATION_OUT
      - INTERNAL_MIGRATION_OUT_RATE_PER_1000
      - INTERNAL_MIGRATION_NET
      - INTERNAL_MIGRATION_NET_RATE_PER_1000
      - INTERNATIONAL_MIGRATION_NET
      - INTERNATIONAL_MIGRATION_NET_RATE_PER_1000

  - id: origins
    label: {en: Origins, fr: Origines, nl: Herkomst}
    blurb:
      en: Citizenship and country of birth, from Census 2021.
      fr: Nationalité et pays de naissance, d’après le Census 2021.
      nl: Nationaliteit en geboorteland, volgens de Census 2021.
    headline: SHARE_FOREIGN_NATIONALS
    indicators:
      - POP_FOREIGN_NATIONALS
      - POP_NON_EU_NATIONALS
      - POP_BORN_ABROAD
      - SHARE_BORN_ABROAD

  - id: households
    label: {en: Households & families, fr: Ménages et familles, nl: Huishoudens en gezinnen}
    blurb:
      en: How people live together — the figure behind school, housing and care planning.
      fr: La composition des ménages — ce qui détermine les besoins en écoles, logements et soins.
      nl: Hoe mensen samenleven — bepalend voor scholen, woningen en zorg.
    headline: AVERAGE_HOUSEHOLD_SIZE
    indicators:
      - HOUSEHOLDS_PRIVATE
      - HOUSEHOLDS_SINGLE_PERSON
      - SHARE_SINGLE_PERSON_HOUSEHOLDS
      - FAMILY_NUCLEI
      - FAMILY_NUCLEI_SINGLE_PARENT
      - SHARE_SINGLE_PARENT_FAMILIES

  - id: income
    label: {en: Income & local taxes, fr: Revenus et fiscalité locale, nl: Inkomen en lokale belastingen}
    blurb:
      en: Average income per tax return, and the commune’s tax base.
      fr: Revenu moyen par déclaration et base fiscale de la commune.
      nl: Gemiddeld inkomen per aangifte en de belastingbasis van de gemeente.
    headline: AVG_NET_TAXABLE_INCOME
    indicators:
      - FISCAL_TOT_NET_TAXABLE_INC
      - FISCAL_NBR_NON_ZERO_INC
      - FISCAL_TOT_TAXES
      - FISCAL_TOT_MUNICIP_TAXES

  - id: social
    label: {en: Social indicators, fr: Indicateurs sociaux, nl: Sociale indicatoren}
    blurb:
      en: >
        Walloon indicators published by WalStat for the 262 Walloon communes, so they do not
        appear on Flemish or Brussels pages: the share of over-65s receiving GRAPA (the
        guaranteed income for the elderly), the share of the population with BIM status
        (enhanced healthcare reimbursement), and the shares of households with a prepayment
        meter for electricity or gas.
      fr: >
        Indicateurs wallons publiés par WalStat pour les 262 communes wallonnes ; ils
        n'apparaissent donc pas sur les pages flamandes ou bruxelloises : la part des plus de
        65 ans bénéficiant de la GRAPA (revenu garanti aux personnes âgées), la part de la
        population au statut BIM (intervention majorée), et les parts de ménages équipés d'un
        compteur à budget pour l'électricité ou le gaz.
      nl: >
        Waalse indicatoren gepubliceerd door WalStat voor de 262 Waalse gemeenten, en die
        verschijnen dus niet op Vlaamse of Brusselse pagina's: het aandeel 65-plussers dat
        GRAPA ontvangt (gewaarborgd inkomen voor ouderen), het aandeel van de bevolking met
        RVV-status (verhoogde tegemoetkoming), en de aandelen huishoudens met een
        budgetmeter voor elektriciteit of gas.
    indicators:
      - GRAPA_RECIPIENTS_SHARE_65_PLUS
      - BIM_BENEFICIARIES_SHARE
      - PREPAYMENT_METERS_ELECTRICITY_SHARE
      - PREPAYMENT_METERS_GAS_SHARE

  - id: housing
    label: {en: Housing, fr: Logement, nl: Wonen}
    blurb:
      en: >
        Median house sale price, updated quarterly by Statbel, and the dwelling stock as
        counted by Census 2021. The median is not comparable to province, region or
        Belgium — a median cannot be honestly aggregated the way a total can. Rents and
        charges are medians of new residential leases registered that quarter (SPF
        Finances), withheld below five leases; ownership figures are as of 1 January. The
        building stock and its share with central heating (SPF Finances AGDP) are also as of
        1 January; notifications count new or revised cadastral incomes issued that year,
        with amounts withheld below five notifications.
      fr: >
        Prix médian de vente des maisons, mis à jour chaque trimestre par Statbel, et le
        parc de logements recensé par le Census 2021. Le prix médian n’est pas comparable
        à la province, à la région ou à la Belgique — un tel taux ne peut être agrégé
        honnêtement. Les loyers et charges sont les médianes des nouveaux baux résidentiels
        enregistrés ce trimestre-là (SPF Finances), retenues en dessous de cinq baux ; les
        chiffres de propriété sont arrêtés au 1er janvier. Le parc de bâtiments et sa part
        avec chauffage central (AGDP du SPF Finances) sont également arrêtés au 1er janvier ;
        les notifications comptent les revenus cadastraux nouveaux ou révisés émis cette
        année-là, les montants étant retenus en dessous de cinq notifications.
      nl: >
        Mediane verkoopprijs van woningen, elk kwartaal bijgewerkt door Statbel, en de
        woningvoorraad volgens de Census 2021. De mediaan is niet vergelijkbaar met
        provincie, gewest of België — een mediaan kan niet eerlijk worden opgeteld. Huur en
        kosten zijn medianen van nieuwe woninghuurcontracten geregistreerd dat kwartaal
        (FOD Financiën), achtergehouden onder vijf contracten; eigendomscijfers gelden op
        1 januari. Het gebouwenbestand en het aandeel daarvan met centrale verwarming (FOD
        Financiën AGDP) gelden eveneens op 1 januari; kennisgevingen tellen het aantal
        nieuwe of herziene kadastrale inkomens dat jaar, met bedragen achtergehouden onder
        vijf kennisgevingen.
    headline: MEDIAN_HOUSE_PRICE
    indicators:
      - HOUSE_SALES_TRANSACTIONS
      - SHARE_DWELLINGS_UNOCCUPIED
      - DWELLINGS_TOTAL
      - DWELLINGS_OCCUPIED
      - DWELLINGS_VACANT
      - DWELLINGS_IN_SINGLE_UNIT_BUILDING
      - MUN_LEASES_NEW_HOUSING
      - MUN_LEASE_RENT_MEDIAN_HOUSING
      - MUN_LEASE_CHARGES_MEDIAN_HOUSING
      - MUN_PROPERTY_SALES
      - MUN_OWNER_OCCUPIERS
      - MUN_PARCELS_OWNED
      - MUN_OWNERSHIP_DURATION_MEDIAN
      - MUN_OWNERSHIP_ROTATION_MEAN
      - MUN_BUILDINGS_TOTAL
      - MUN_BUILDINGS_CENTRAL_HEATING
      - MUN_CI_NOTIFICATIONS
      - MUN_CI_NOTIFIED_TOTAL
      - MUN_CI_NOTIFIED_MEDIAN

  - id: business
    label: {en: Business, fr: Entreprises, nl: Ondernemingen}
    blurb:
      en: >
        Local business units registered in the commune, plus monthly bankruptcies and the
        jobs lost with them. A zero month is a real measured zero, not missing data.
      fr: >
        Unités d’établissement enregistrées dans la commune, ainsi que les faillites
        mensuelles et les emplois perdus avec elles. Un mois à zéro est un zéro réellement
        mesuré, pas une donnée manquante.
      nl: >
        Vestigingseenheden in de gemeente, plus maandelijkse faillissementen en de banen die
        daarbij verloren gingen. Een maand met nul is een echte gemeten nul, geen
        ontbrekende data.
    headline: LOCAL_UNITS_BY_COMMUNE
    indicators:
      - BANKRUPTCIES
      - BANKRUPTCY_JOBS_LOST

  - id: employment
    label: {en: Employment, fr: Emploi, nl: Werk}
    blurb:
      en: >
        ONEM/RVA's own unemployment rate — benefit claimants seeking work over the number of
        people insured against unemployment — shown as the annual level and as the latest month.
        BOTH ARE HERE ON PURPOSE: the rate falls from 6.28 % in February 2026 to 4.41 % in April
        across almost every commune, and that is the time-limiting of unemployment benefit taking
        people out of the count, not a labour market improving. The Steunpunt Werk administrative
        rate and the ONEM claimant counts are beside it; they measure related but different things.
      fr: >
        Le taux de chômage propre à l’ONEM — les chômeurs indemnisés demandeurs d’emploi rapportés
        au nombre d’assurés contre le chômage — présenté en niveau annuel et au dernier mois connu.
        LES DEUX SONT LÀ VOLONTAIREMENT : le taux passe de 6,28 % en février 2026 à 4,41 % en avril
        dans presque toutes les communes, et c’est la limitation des allocations de chômage dans le
        temps qui sort des personnes du comptage, pas un marché du travail qui s’améliore. Le taux
        administratif de Steunpunt Werk et les effectifs de l’ONEM figurent à côté : ils mesurent
        des choses voisines mais distinctes.
      nl: >
        De eigen werkloosheidsgraad van de RVA — uitkeringsgerechtigde werkzoekenden gedeeld door
        het aantal tegen werkloosheid verzekerde personen — als jaarniveau en als laatste maand.
        BEIDE STAAN ER BEWUST: de graad zakt van 6,28 % in februari 2026 naar 4,41 % in april in
        bijna elke gemeente, en dat is de beperking van de werkloosheidsuitkering in de tijd die
        mensen uit de telling haalt, geen arbeidsmarkt die verbetert. De administratieve graad van
        Steunpunt Werk en de RVA-aantallen staan ernaast; ze meten verwante maar andere dingen.
    headline: UNEMPLOYMENT_RATE_INSURED
    indicators:
      - UNEMPLOYMENT_RATE_INSURED_MONTHLY
      - ADMIN_UNEMPLOYMENT_RATE_COM
      - UNEMPLOYED_JOBSEEKERS
      - UNEMPLOYMENT_BENEFIT_RECIPIENTS
      - TEMP_UNEMPLOYED
      - PART_TIME_BENEFIT_RECIPIENTS
      - UNEMPLOYMENT_BENEFIT_PAID
      - TEMP_UNEMPLOYMENT_BENEFIT_PAID
      - ACTIVATION_MEASURES_PAID

  - id: safety
    label: {en: Safety, fr: Sécurité, nl: Veiligheid}
    blurb:
      en: >
        Recorded-crime rates from the federal police, each per 10,000 of its own denominator
        (dwellings, cars, vehicles or households — never population), and each resolved onto a
        single fixed pre-2025-merger commune map regardless of the year shown, since that is how
        the source itself publishes its own history. The most recent year of each series is
        provisional; not comparable across provinces/regions/Belgium since a rate like this cannot
        be honestly aggregated.
      fr: >
        Taux d’infractions enregistrées par la police fédérale, chacun rapporté à son propre
        dénominateur (logements, voitures, véhicules ou ménages — jamais la population), et chacun
        calculé sur une carte communale fixe antérieure aux fusions de 2025, quelle que soit
        l’année affichée, car c’est ainsi que la source publie elle-même son historique. L’année la
        plus récente de chaque série est provisoire ; non comparable à la province/région/Belgique
        puisqu’un tel taux ne peut être agrégé honnêtement.
      nl: >
        Cijfers over geregistreerde criminaliteit van de federale politie, telkens per 10 000 van
        hun eigen noemer (woningen, auto’s, voertuigen of huishoudens — nooit bevolking), en telkens
        berekend op één vaste gemeentekaart van vóór de fusies van 2025, ongeacht het weergegeven
        jaar, want zo publiceert de bron zelf haar eigen geschiedenis. Het meest recente jaar van
        elke reeks is voorlopig; niet vergelijkbaar met provincie/gewest/België aangezien zo’n
        percentage niet eerlijk kan worden opgeteld.
    headline: HOUSE_BURGLARIES_PER_10K
    indicators:
      - HOUSE_BURGLARIES_PER_10K
      - CAR_THEFT_PER_10K
      - THEFT_FROM_VEHICLE_PER_10K
      - DOMESTIC_VIOLENCE_PER_10K

  - id: mobility
    label: {en: Mobility, fr: Mobilité, nl: Mobiliteit}
    unavailable:
      en: Mobility data collection is deferred — no dataset was selected for it.
      fr: La collecte de données de mobilité est reportée — aucun jeu de données n’a été retenu.
      nl: Mobiliteitsdata zijn uitgesteld — er is geen dataset voor geselecteerd.

  - id: finances
    label: {en: Municipal finances, fr: Finances communales, nl: Gemeentefinanciën}
    blurb:
      en: >
        The commune's own additional percentage on personal income tax, plus — for Wallonia
        only — municipal debt, revenue and expenditure per capita. The tax-rate period is the
        TAX YEAR (exercice d'imposition), not the income year it is assessed on; the
        municipal-finance figures below it cover Wallonia only and do not appear on Flemish
        or Brussels pages. The cadastral figures are the SPF's notional rental value used to
        set property tax, as of 1 January; residential cadastral income covers residential
        parcels only, so it is smaller than the all-parcel total below it — the two are
        different figures, not an inconsistency.
      fr: >
        Le taux additionnel communal à l'impôt des personnes physiques, ainsi que — pour la
        Wallonie uniquement — la dette, les recettes et les dépenses communales par habitant.
        La période du taux est l'ANNÉE D'IMPOSITION (exercice d'imposition), pas l'année de
        revenus sur laquelle il est calculé ; les chiffres de finances communales ci-dessous
        ne couvrent que la Wallonie et n'apparaissent pas sur les pages flamandes ou
        bruxelloises. Les chiffres cadastraux sont le revenu locatif théorique du SPF servant
        de base au précompte immobilier, arrêtés au 1er janvier ; le revenu cadastral
        résidentiel ne porte que sur les parcelles résidentielles, donc il est plus petit que
        le total tous usages ci-dessous — ce sont deux chiffres différents, pas une
        incohérence.
      nl: >
        Het eigen aanvullend gemeentelijk opcentiem op de personenbelasting, plus — enkel
        voor Wallonië — gemeentelijke schuld, ontvangsten en uitgaven per inwoner. De periode
        van het tarief is het AANSLAGJAAR (exercice d'imposition), niet het inkomstenjaar
        waarop het wordt berekend; de gemeentefinanciën-cijfers hieronder dekken enkel
        Wallonië en verschijnen niet op Vlaamse of Brusselse pagina's. De kadastrale cijfers
        zijn het fictieve huurinkomen van de FOD dat als basis dient voor de onroerende
        voorheffing, vastgesteld op 1 januari; het residentieel kadastraal inkomen dekt enkel
        residentiële percelen, dus het is kleiner dan het totaal over alle percelen
        hieronder — dit zijn twee verschillende cijfers, geen tegenstrijdigheid.
    headline: MUN_IPP_ADDITIONAL_RATE
    indicators:
      - MUN_DEBT_TOTAL_PER_CAPITA
      - MUN_DEBT_LONG_TERM_PER_CAPITA
      - MUN_DEBT_SHORT_TERM_PER_CAPITA
      - MUN_REVENUE_TOTAL_PER_CAPITA
      - MUN_REVENUE_ORDINARY_PER_CAPITA
      - MUN_REVENUE_EXTRAORDINARY_PER_CAPITA
      - MUN_EXPENDITURE_TOTAL_PER_CAPITA
      - MUN_EXPENDITURE_ORDINARY_PER_CAPITA
      - MUN_EXPENDITURE_EXTRAORDINARY_PER_CAPITA
      - MUN_CADASTRAL_PARCELS_TOTAL
      - MUN_CADASTRAL_INCOME_TOTAL
      - MUN_CADASTRAL_INCOME_TAXABLE
      - MUN_PARCELS_TAX_EXEMPT
      - MUN_RESIDENTIAL_PARCELS_CI_TOTAL
