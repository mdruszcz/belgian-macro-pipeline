# The single declaration of every committed observation store -- PR1 of the
# pipeline repair (docs/implementation/batches/, "store registry + staging").
#
# WHY THIS FILE EXISTS. The same six CSVs were spelled out in six different
# places, three of which disagreed with each other: Makefile's EXTRA variable
# (all 6), scripts/validate_data.py's DEFAULT_EXPORTS (3 of 6), and
# tests/test_committed_stores_are_consistent.py's MANUAL_STORES (3 of 6),
# under a comment that claimed it matched the workflows. This is now the one
# place that list is spelled out; everything else reads it via src/stores.py.
#
# `mode` IS THE CRUX. `in_db` means the store is loaded INTO the disposable
# working database (scripts/build_staging_db.py), synced into there by the
# daily run, and dumped back out by scripts/offload_stores.py -- the sources
# CI fetches itself and that are too big to keep in a committed binary
# (ONEM, ONEM's published rate, WalStat; docs/decisions/0006). `extra_csv`
# means it is passed to the four exporters as --extra-observations and never
# loaded into any database -- the hand-loaded sources, whose CSV is written
# by their own sync script. A store in BOTH paths would be double-counted:
# export_communes_history_csv.py takes every is_latest=1 row from the DB and
# every row from each --extra-observations CSV with no deduplication.
#
# `indicators` is exactly the distinct indicator_id values present in the
# CSV (verified with `tail -n +2 data/X.csv | cut -d, -f1 | sort -u`, not
# hand-guessed). For an in_db store it is ALSO the offload's row set: exactly
# these indicators are dumped to the CSV and deleted from the committed
# database, so it must name every indicator its sync script writes --
# including one configured but not yet fetched (UNEMPLOYMENT_RATE_BIT on the
# day of the cutover), the one case src/stores.py tolerates as absent from
# the CSV.
#
# `reference_rows` says how to (re)create the store's sources/indicators
# rows -- required because the observations live in the CSV but their
# name/unit are read from the `indicators` table (exactly one metadata path;
# see tests/test_committed_stores_are_consistent.py). Every store has a script
# (sync_population.py did not have --reference-rows-only before PR1 of the
# pipeline repair -- there was no line for it in `make reference`, and POPULATION_*
# rows only existed because the database itself was committed) -- it was a
# small, honest addition, made here rather than left null. The schema still
# allows `reference_rows: null` with a `reference_rows_reason` for a future
# store that genuinely has none.
stores:
  # history_shard: true below -- data/communes_history.csv (the committed,
  # 10-year download) grew from ~36 MB to 62 MB in CI on 2026-09-23 when the
  # new municipal sources (spf_agdp, population_movement, ipp_rate) landed,
  # over CLAUDE.md rule 12's 25 MB ceiling. Split per store instead of
  # raising the commit-size guard a third time (PR: split-communes-history).
  # Each history_shard store's indicators go to their own
  # data/communes_history/{name}.csv -- same 15-column header, order and
  # sort as the core file -- instead of into data/communes_history.csv.
  # scripts/export_communes_history_csv.py reads this flag from
  # config/stores.yaml (src/stores.py's history_shard_map()), never a
  # hardcoded indicator list. Every store below was already comfortably
  # under 25 MB on its own before the split; flagged anyway so the core file
  # (which was itself already at 37 MB before the new sources) has headroom
  # for years to come rather than only just clearing the line today.
  population:
    path: data/population_observations.csv
    source_id: statbel
    mode: extra_csv
    history_shard: true
    indicators:
      - POPULATION_AGE_0_14
      - POPULATION_AGE_15_64
      - POPULATION_AGE_65_PLUS
      - POPULATION_BY_COMMUNE
    reference_rows:
      script: scripts/sync_population.py
      args: ["--reference-rows-only"]

  fiscal_income:
    path: data/fiscal_income_observations.csv
    source_id: statbel
    mode: extra_csv
    history_shard: true
    indicators:
      - FISCAL_NBR_NON_ZERO_INC
      - FISCAL_TOT_MUNICIP_TAXES
      - FISCAL_TOT_NET_TAXABLE_INC
      - FISCAL_TOT_TAXES
    reference_rows:
      script: scripts/sync_fiscal_income.py
      args: ["--reference-rows-only"]

  census2021:
    path: data/census2021_observations.csv
    source_id: statbel
    mode: extra_csv
    history_shard: true
    indicators:
      - CAS_EMPLOYED
      - CAS_INACTIVE
      - CAS_LABOUR_FORCE
      - CAS_UNEMPLOYED
      - DWELLINGS_IN_SINGLE_UNIT_BUILDING
      - DWELLINGS_OCCUPIED
      - DWELLINGS_TOTAL
      - DWELLINGS_VACANT
      - FAMILY_NUCLEI
      - FAMILY_NUCLEI_SINGLE_PARENT
      - HOUSEHOLDS_PRIVATE
      - HOUSEHOLDS_SINGLE_PERSON
      - POP_BORN_ABROAD
      - POP_FEMALE
      - POP_FOREIGN_NATIONALS
      - POP_MARRIED
      - POP_NON_EU_NATIONALS
    reference_rows:
      script: scripts/sync_census2021.py
      args: ["--reference-rows-only"]

  realestate:
    path: data/realestate_observations.csv
    source_id: statbel
    mode: extra_csv
    history_shard: true
    indicators:
      - HOUSE_SALES_TRANSACTIONS
      - MEDIAN_HOUSE_PRICE
    reference_rows:
      script: scripts/sync_realestate.py
      args: ["--reference-rows-only"]

  police:
    path: data/police_observations.csv
    source_id: police
    mode: extra_csv
    history_shard: true
    indicators:
      - CAR_THEFT_PER_10K
      - DOMESTIC_VIOLENCE_PER_10K
      - HOUSE_BURGLARIES_PER_10K
      - THEFT_FROM_VEHICLE_PER_10K
    reference_rows:
      script: scripts/sync_police.py
      args: ["--reference-rows-only"]

  var_unemployment:
    path: data/var_unemployment_observations.csv
    source_id: steunpunt_werk
    mode: extra_csv
    history_shard: true
    indicators:
      - ADMIN_UNEMPLOYMENT_RATE_COM
    reference_rows:
      script: scripts/sync_var.py
      args: ["--reference-rows-only"]

  # ── in_db: fetched by CI into the working database, dumped back here ──

  onem:
    path: data/onem_observations.csv
    source_id: onem
    mode: in_db
    history_shard: true
    indicators:
      - ACTIVATION_MEASURES_PAID
      - PART_TIME_BENEFIT_RECIPIENTS
      - TEMP_UNEMPLOYED
      - TEMP_UNEMPLOYMENT_BENEFIT_PAID
      - UNEMPLOYED_JOBSEEKERS
      - UNEMPLOYMENT_BENEFIT_PAID
      - UNEMPLOYMENT_BENEFIT_RECIPIENTS
    reference_rows:
      script: scripts/sync_onem.py
      args: ["--reference-rows-only"]

  onem_rates:
    path: data/onem_rates_observations.csv
    source_id: onem
    mode: in_db
    history_shard: true
    indicators:
      - UNEMPLOYMENT_RATE_INSURED
      - UNEMPLOYMENT_RATE_INSURED_MONTHLY
    reference_rows:
      script: scripts/sync_onem_rates.py
      args: ["--reference-rows-only"]

  # layout: one_csv_per_indicator (same mechanism as `international`/`nuts2`
  # above), not a single CSV: the monthly, 21-year, 565-commune, explicit-
  # zero-filled series is 40.5 MB as one file, over the 25 MB commit limit.
  # Split, BANKRUPTCIES and BANKRUPTCY_JOBS_LOST measure 19.7 MB and 20.9 MB
  # respectively (maintainer decision, 2026-09-23).
  bankruptcies:
    path: data/bankruptcies/
    source_id: statbel
    mode: in_db
    layout: one_csv_per_indicator
    indicators:
      - BANKRUPTCIES
      - BANKRUPTCY_JOBS_LOST
    reference_rows:
      script: scripts/sync_bankruptcies.py
      args: ["--reference-rows-only"]

  walstat:
    path: data/walstat_observations.csv
    source_id: walstat
    mode: in_db
    history_shard: true
    indicators:
      - MUN_DEBT_LONG_TERM_PER_CAPITA
      - MUN_DEBT_SHORT_TERM_PER_CAPITA
      - MUN_DEBT_TOTAL_PER_CAPITA
      - MUN_EXPENDITURE_EXTRAORDINARY_PER_CAPITA
      - MUN_EXPENDITURE_ORDINARY_PER_CAPITA
      - MUN_EXPENDITURE_TOTAL_PER_CAPITA
      - MUN_REVENUE_EXTRAORDINARY_PER_CAPITA
      - MUN_REVENUE_ORDINARY_PER_CAPITA
      - MUN_REVENUE_TOTAL_PER_CAPITA
      - UNEMPLOYMENT_RATE_BIT
      # Block NS2: social-protection uptake and energy prepayment-meter
      # shares, Walloon communes only (docs/features/walstat_adapter.md).
      - GRAPA_RECIPIENTS_SHARE_65_PLUS
      - BIM_BENEFICIARIES_SHARE
      - PREPAYMENT_METERS_ELECTRICITY_SHARE
      - PREPAYMENT_METERS_GAS_SHARE
    reference_rows:
      script: scripts/sync_walstat.py
      args: ["--reference-rows-only"]

  # Block NS3, population-movement workbook (births, deaths, internal and
  # international net migration -- docs/features/population_movement.md).
  # Plus (2026-09-24) internal migration arrivals/departures, columns G/H --
  # INTERNAL_MIGRATION_NET = INTERNAL_MIGRATION_IN - INTERNAL_MIGRATION_OUT,
  # as published by Statbel. Single CSV, not one_csv_per_indicator: measured
  # 10.32 MB for the original four indicators together after the
  # sheet_year+1 -> sheet_year resolution fix (PR #233's audit fixes;
  # re-measured post-regeneration, 2026-09-23 -- larger than the pre-fix
  # 6.06 MB because the retired pre-fix vintages for the 31 transition codes
  # are kept, append-only, alongside the corrected rows), well under the
  # 25 MB commit limit (maintainer decision, 2026-09-23, same threshold as
  # the bankruptcies store's split); re-measured again after adding the two
  # IN/OUT indicators (this batch).
  population_movement:
    path: data/population_movement_observations.csv
    source_id: statbel
    mode: in_db
    history_shard: true
    indicators:
      - BIRTHS
      - DEATHS
      - INTERNAL_MIGRATION_NET
      - INTERNATIONAL_MIGRATION_NET
      - INTERNAL_MIGRATION_IN
      - INTERNAL_MIGRATION_OUT
    reference_rows:
      script: scripts/sync_population_movement.py
      args: ["--reference-rows-only"]

  # International pilot (docs/features/international.md). One CSV per
  # indicator, never a store per indicator (~100 candidates in the full
  # rollout) -- layout: one_csv_per_indicator, src/stores.py's Store.csv_paths()/
  # csv_for(). Declares BOTH the five new multi-country pilot indicators
  # (scripts/sync_international.py, fetch.geographies: allowlist) AND the
  # eight pre-existing single-country Eurostat indicators this same PR moved
  # off DBnomics onto the same "eurostat" source_id -- one source offloaded
  # into one store, never two Eurostat sources in parallel (see this store's
  # reference_rows script's own module docstring for why).
  international:
    path: data/international/
    source_id: eurostat
    mode: in_db
    layout: one_csv_per_indicator
    indicators:
      - GDP_VOLUME_EUROPE
      - HICP_ANNUAL_RATE_EUROPE
      - UNEMPLOYMENT_RATE_EUROPE
      - GOV_DEBT_EUROPE
      - CONSUMER_CONFIDENCE_EUROPE
      # Europe countries batch (docs/features/europe_countries.md), added
      # 2026-09-15: country-level counterparts of GDP_PC_PPS_NUTS2 /
      # POPULATION_NUTS2 -- same two datasets, NUTS 0 cells only (the map's
      # country mode and the comparison charts). Still `international`, not
      # a new store: same source_id, same allowlist, same
      # scripts/sync_international.py loader.
      - GDP_PC_PPS_COUNTRY
      - POPULATION_COUNTRY
      - EUROSTAT_GDP_Q_MEUR
      - EUROSTAT_GDP_Q_MEUR_DE
      - EUROSTAT_GDP_Q_MEUR_EA
      - EUROSTAT_GDP_Q_MEUR_ES
      - EUROSTAT_GDP_Q_MEUR_FR
      - EUROSTAT_GDP_Q_MEUR_NL
      - EC_CONS_CONF_BE
      - EC_CONS_CONF_EU
      # Eurostat additional domains batch (docs/data_catalog.md, 2026-09-15):
      # 21 country-level indicators across 7 new domains (sector/productivity/
      # employment, public finance, trade, social inequalities, energy/
      # transition, demography, innovation). Same `international` store, same
      # source_id, same allowlist, same scripts/sync_international.py loader
      # -- no new store per the docstring above's own rule.
      - VALUE_ADDED_TOTAL_EUROPE
      # EMPLOYMENT_NATACCOUNTS_EUROPE (nama_10_a10_e) was DROPPED, not built --
      # live fetch 2026-09-15 hit an unrecognized Eurostat OBS_FLAG ('C',
      # uppercase, within a compound flag) at geo=XK (already licence-excluded
      # via international_excluded.csv, so it would never have been published
      # anyway). sync_international.py has no per-indicator try/except: one
      # unrecognized flag aborts the WHOLE daily fetch for every indicator in
      # this store, not just its own -- so a config that always hits this
      # cannot be left in config/indicators/ even "for later", since
      # scripts/sync_international.py picks up every eurostat multi-geo
      # config it finds regardless of this list. Extending
      # src/fetchers/eurostat.py's FLAG_STATUS table is a source-adapter
      # change (CLAUDE.md rule 19: needs its own ADR and maintainer approval,
      # same as the compound-flag fix in #168 went through its own PR first)
      # -- out of scope for this batch. Follow-up, not built now; see
      # docs/data_catalog.md.
      - EMPLOYMENT_LFS_EUROPE
      # LABOUR_PRODUCTIVITY_GROWTH_EUROPE (nama_10_lp_ulc) was DROPPED, not
      # built -- same unrecognized-OBS_FLAG-'C'-at-XK gap as
      # EMPLOYMENT_NATACCOUNTS_EUROPE above (same nama_10_* dataset family).
      # Same rule-19 reasoning; not fixed here. Follow-up, not built now; see
      # docs/data_catalog.md.
      - GOV_BALANCE_EUROPE
      - TAX_RECEIPTS_EUROPE
      - GOV_EXPENDITURE_HEALTH_EUROPE
      - GOV_DEBT_QUARTERLY_EUROPE
      - EXPORTS_GOODS_SERVICES_EUROPE
      - IMPORTS_GOODS_SERVICES_EUROPE
      - GINI_COEFFICIENT_EUROPE
      - POVERTY_RATE_EUROPE
      - POVERTY_SOCIAL_EXCLUSION_EUROPE
      - RENEWABLE_ENERGY_SHARE_EUROPE
      - GHG_EMISSIONS_EUROPE
      - POPULATION_EUROPE
      # FERTILITY_RATE_EUROPE (demo_find) was DROPPED, not built -- live fetch
      # 2026-09-15 hit geo=XK (already licence-excluded), period=2015, flag
      # 'p' ("provisional") with NO value: a flag-with-no-value cell, the
      # same class of gap documented in scripts/sync_nuts2.py's own module
      # docstring for lfst_r_lfu3rt/demo_r_pjanaggr3 (both NUTS-level, not
      # fixed there either). Same rule-19 reasoning as
      # EMPLOYMENT_NATACCOUNTS_EUROPE above: fixing this generally (e.g. a
      # geo_filter that skips already-licence-excluded geographies before
      # flag/value validation, mirroring is_nuts2_code's own use) is a
      # source-adapter change, out of scope without its own ADR. Follow-up,
      # not built now; see docs/data_catalog.md.
      - LIFE_EXPECTANCY_EUROPE
      - POPULATION_GROWTH_RATE_EUROPE
      - RD_EXPENDITURE_EUROPE
      - RD_PERSONNEL_EUROPE
    reference_rows:
      script: scripts/sync_international.py
      args: ["--reference-rows-only"]

  # Europe NUTS 2 batch B2 (docs/features/europe_nuts2.md). Same
  # one_csv_per_indicator mechanism as `international`, a SEPARATE store
  # because its geo_ids resolve through config/geography/nuts2.csv, not
  # international.csv (see src/geography/nuts2.py's module docstring for
  # why a NUTS 2 region never shares a geo_id with the country/province
  # tables). NOT wired into the daily run or Dagster this batch -- `make
  # sync-nuts2` runs scripts/sync_nuts2.py by hand; see that script's
  # module docstring for the two indicators (UNEMPLOYMENT_RATE_NUTS2,
  # POPULATION_NUTS2) configured but not yet loaded, pending a
  # src/fetchers/eurostat.py gap this batch does not fix.
  nuts2:
    path: data/nuts2/
    source_id: eurostat
    mode: in_db
    layout: one_csv_per_indicator
    indicators:
      - GDP_PC_PPS_NUTS2
      - POPULATION_NUTS2
      - UNEMPLOYMENT_RATE_NUTS2
      # Eurostat additional domains batch (docs/data_catalog.md, 2026-09-15):
      # the 4 regional-depth indicators of that batch. Same store, same
      # source_id, same allowlist mechanics.
      - VALUE_ADDED_GROWTH_NUTS2
      - EMPLOYMENT_RATE_NUTS2
      # RD_INTENSITY_NUTS2 (rd_e_gerdreg) was DROPPED, not built -- live fetch
      # 2026-09-15 hit an unrecognized OBS_FLAG 'C' at geo=BE10 (a real,
      # wanted Belgian geography, so unlike the country-level drops above
      # this cannot be worked around by a geography exclusion). See
      # scripts/sync_nuts2.py's IS_ADDITIVE comment and docs/data_catalog.md.
      - HOUSEHOLD_INCOME_TOTAL_NUTS2
    reference_rows:
      script: scripts/sync_nuts2.py
      args: ["--reference-rows-only"]

  # Block NS6, communal additional IPP rate (docs/features/ipp_rate.md).
  # Single small CSV: three tax years (2024-2026) x ~565 communes, well
  # under the 25 MB commit limit. in_db because SPF Finances is reachable
  # live from CI, the same reason bankruptcies/population_movement are
  # in_db rather than extra_csv (docs/decisions/0006's own split). No
  # aggregate is computed from this indicator (is_additive false,
  # aggregation_method not_applicable -- see
  # config/indicators/MUN_IPP_ADDITIONAL_RATE.yaml and
  # scripts/sync_ipp_rate.py).
  ipp_rate:
    path: data/ipp_rate_observations.csv
    source_id: spf_finances
    mode: in_db
    history_shard: true
    indicators:
      - MUN_IPP_ADDITIONAL_RATE
    reference_rows:
      script: scripts/sync_ipp_rate.py
      args: ["--reference-rows-only"]

  # Wave 4 + Wave 5 lot A, SPF Finances AGDP patrimony datasets
  # (docs/features/spf_agdp.md): real-estate leases (52.01.01), transactions
  # (52.01.02) -- both quarterly, Wave 4 -- plus owner occupants (52.01.14)
  # and real-estate property dynamics (52.01.24) -- both annual, Wave 5 lot
  # A. Same source_id as ipp_rate (spf_finances) -- one SPF Finances source,
  # several adapters/stores, same reasoning as `international`'s single
  # source_id across several sync scripts. in_db: all four ATOM feeds are
  # reachable live from CI, same reason bankruptcies/population_movement/
  # ipp_rate are in_db. Wave 4 alone measured ~94,300 rows / ~12.8 MB; Wave 5
  # lot A adds an estimated ~31,700 rows, folded into this same store rather
  # than a new one (handoff) -- real committed size reported in the PR;
  # switches to `layout: one_csv_per_indicator` if the real file ever
  # exceeds 20 MB.
  spf_agdp:
    path: data/spf_agdp_observations.csv
    source_id: spf_finances
    mode: in_db
    history_shard: true
    indicators:
      - MUN_LEASES_NEW_HOUSING
      - MUN_LEASE_RENT_MEDIAN_HOUSING
      - MUN_LEASE_CHARGES_MEDIAN_HOUSING
      - MUN_PROPERTY_SALES
      - MUN_OWNER_OCCUPIERS
      - MUN_PARCELS_OWNED
      - MUN_OWNERSHIP_DURATION_MEDIAN
      - MUN_OWNERSHIP_ROTATION_MEAN
    reference_rows:
      script: scripts/sync_spf_agdp.py
      args: ["--reference-rows-only"]

  # Wave 5 lot B, SPF Finances AGDP patrimony datasets (docs/features/
  # spf_agdp.md): land use (52.01.04), building condition (52.01.05) and
  # property-tax exemptions (52.01.03), all three annual. A SEPARATE store
  # from `spf_agdp` above, not folded into it, purely for committed-CSV size:
  # data/spf_agdp_observations.csv (Wave 4 + lot A) already measures ~18.9 MB
  # (docs/features/spf_agdp.md); lot B's three datasets add roughly
  # 55,700 more rows across 16/16/16 versions x ~565 communes x up to 3
  # indicators each, which would push the combined file well past the 25 MB
  # commit ceiling. Real measured size reported in the PR. Same source_id
  # (spf_finances) and same sync script (scripts/sync_spf_agdp.py) as
  # `ipp_rate` and `spf_agdp` -- one script now writes rows for BOTH stores
  # in a single run; scripts/offload_stores.py dispatches each row to
  # whichever store declares its indicator_id (its own `declared` overlap
  # check, ~line 263-269, refuses a run where two stores claim the same
  # indicator -- this store and `spf_agdp` declare disjoint indicator sets,
  # verified by tests/test_stores.py).
  # Wave 5 lot C adds two more annual datasets to this same store: notifications
  # of the cadastral income (52.01.25) and concentration of cadastral income
  # (52.01.08) -- MUN_CI_NOTIFICATIONS, MUN_CI_NOTIFIED_TOTAL,
  # MUN_CI_NOTIFIED_MEDIAN, MUN_RESIDENTIAL_PARCELS_CI_TOTAL. Kept in
  # spf_agdp_patrimony rather than a new store (handoff): the combined size,
  # reported in the PR, stays under the 18 MB the handoff set as the split
  # threshold for this batch.
  spf_agdp_patrimony:
    path: data/spf_agdp_patrimony_observations.csv
    source_id: spf_finances
    mode: in_db
    history_shard: true
    indicators:
      - MUN_BUILDINGS_CENTRAL_HEATING
      - MUN_BUILDINGS_TOTAL
      - MUN_CADASTRAL_INCOME_TAXABLE
      - MUN_CADASTRAL_INCOME_TOTAL
      - MUN_CADASTRAL_PARCELS_TOTAL
      - MUN_CI_NOTIFICATIONS
      - MUN_CI_NOTIFIED_MEDIAN
      - MUN_CI_NOTIFIED_TOTAL
      - MUN_PARCELS_TAX_EXEMPT
      - MUN_RESIDENTIAL_PARCELS_CI_TOTAL
    reference_rows:
      script: scripts/sync_spf_agdp.py
      args: ["--reference-rows-only"]
