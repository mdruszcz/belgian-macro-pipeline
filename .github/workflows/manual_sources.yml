name: Regenerate exports from manual sources

# Manual trigger only, deliberately. This workflow CANNOT fetch the data it
# concerns: statbel.fgov.be is unreachable from GitHub's runners, which is the
# whole reason population lives in a committed CSV rather than in the daily
# database (docs/decisions/0002-split-committed-stores.md).
#
# What it does: takes the already-committed data/population_observations.csv,
# validates it round-trips, and regenerates the published exports from it, so
# export generation is identical whether the trigger was the daily fetch or a
# manual population refresh.
#
# Loading new raw files is a local procedure -- see docs/features/manual_sources.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.BOT_PAT }}
  WORKING_DB: data/local/working.db

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assemble the working database
        # The same step daily_fetch.yml and CI run: the committed database
        # plus every in_db store's committed CSV (ONEM, ONEM's rate, WalStat),
        # migrated, with geography and every store's reference rows, at the
        # gitignored data/local/working.db. Every export below reads it.
        #
        # WHY THIS MATTERS HERE MORE THAN ANYWHERE. Since the ONEM/WalStat
        # cutover (docs/decisions/0006) the committed database alone holds
        # none of those eighteen indicators. Exporting from it, as this
        # workflow used to, would publish every commune page, aggregate and
        # payload with ONEM and WalStat silently missing -- and the size guard
        # would not notice, because every file gets smaller.
        #
        # This workflow never writes data/belgian_macro.db or an in_db CSV:
        # there is no offload step, and the last step before the PR checks it.
        run: python scripts/build_staging_db.py --working-db "$WORKING_DB"

      - name: Validate every store before exporting
        id: validate
        # The same validation daily_fetch.yml and CI run: every rule over the
        # working database plus every hand-loaded store (scripts/validate_data.py
        # loads them into a throwaway copy). This used to rebuild
        # population_observations.csv alone and check its foreign keys -- one
        # store of six, and no rule beyond the keys, in the one workflow whose
        # whole job is publishing a hand refresh. No --record-volume: this
        # workflow commits no database, so it has no baseline to keep.
        #
        # Exit code captured, not propagated immediately, for the reason
        # daily_fetch.yml gives: the summary must reach the run page in exactly
        # the case that matters.
        run: |
          SUMMARY="$RUNNER_TEMP/validation-summary.md"
          set +e
          python scripts/validate_data.py --db "$WORKING_DB" --summary-file "$SUMMARY"
          STATUS=$?
          set -e
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Regenerate exports
        # The history export runs twice: --all-periods to the gitignored
        # data/communes_history_full.csv, which feeds the table-json and
        # site-payloads steps below (their own contract is the complete
        # series); then again with no flag, which is the last-10-years file
        # that actually gets committed. See daily_fetch.yml for why -- this
        # is the same fix, mirrored here rather than duplicated in prose.
        run: |
          python scripts/export_communes_csv.py --db "$WORKING_DB" \
            --out data/communes_export.csv --stores config/stores.yaml
          python scripts/export_communes_history_csv.py --db "$WORKING_DB" \
            --out data/communes_history_full.csv --all-periods --stores config/stores.yaml
          python scripts/export_communes_history_csv.py --db "$WORKING_DB" \
            --out data/communes_history.csv --stores config/stores.yaml
          python scripts/export_communes_table_json.py \
            --communes-history data/communes_history_full.csv \
            --out data/communes_table.json \
            --db "$WORKING_DB"
          python -m src.exporters.metadata --out data/metadata/indicators.json

      - name: Export province/region/Belgium aggregates
        # Block L -- docs/features/comparison.md. Feeds the comparison column
        # on every commune page. Reads the UNRESTRICTED observation set
        # (including communes merged away since) so a province total is not
        # short by the communes that no longer exist -- measured at -24.4%
        # for Limburg 2023 when that is got wrong.
        run: |
          python scripts/export_aggregates_csv.py --db "$WORKING_DB" \
            --out data/aggregates.csv --stores config/stores.yaml

      - name: Export national and regional peer positions
        # Block L -- docs/features/comparison.md. Latest period per indicator
        # only: the full history is 174k rows / 22 MB against a 25 MB commit
        # guard, for periods no page shows. --all-periods exists for a
        # researcher who wants the rest.
        run: |
          python scripts/export_percentiles_csv.py --db "$WORKING_DB" \
            --out data/percentiles.csv --stores config/stores.yaml

      - name: Export per-entity site payloads for /local
        # Block J -- docs/features/site_payloads.md. The validation status is
        # derived from the step above, which now validates every store; it
        # used to be "unknown" because nothing here ran the rules.
        run: |
          python scripts/export_site_payloads.py --db "$WORKING_DB" \
            --communes-history data/communes_history_full.csv \
            --communes-latest data/communes_export.csv \
            --national data/belgian_macro_export.csv \
            --out-dir public/data \
            --build-id "${{ github.run_id }}" \
            --validation-status "${{ steps.validate.outcome == 'success' && 'pass' || 'fail' }}"

      - name: Export explorer payloads
        # Keep explorer.html's indicator shards in sync with the published
        # municipal and national downloads regenerated above.
        run: python scripts/export_explorer_payloads.py

      - name: Generate permanent /local/{nis} pages
        # Block L -- docs/features/comparison.md's "Permanent URLs". Runs
        # AFTER export_site_payloads.py because it renders from those
        # payloads: one statically-rendered, indexable page per commune, with
        # the figures in the HTML rather than fetched by JavaScript, which is
        # the whole basis of the SEO position (roadmap Step 49). Thin pages
        # are refused rather than generated. The indicator route
        # (/local/{nis}/{indicator}) is deliberately NOT generated -- 8,475
        # files today and ~113,000 at the 200-indicator target, gated on a
        # platform-limit check per the spec.
        run: |
          python scripts/export_local_pages.py \
            --payload-dir public/data \
            --out-dir local \
            --db "$WORKING_DB" \
            --build-id "${{ github.run_id }}"

      - name: Guard against oversized data files
        # Raised from 25 MB to 40 MB when ONEM's seven indicators x 565
        # communes x 10 years took data/communes_history.csv from 22.9 MB to
        # 32.5 MB. The threshold is a repo-health tripwire, not a technical
        # limit (GitHub warns at 50 MB), and it did its job: it caught that the
        # denormalized full-history CSV does not scale -- it repeats every
        # commune's five names, region, province and arrondissement on all
        # 163,967 rows, and communes.html fetches the whole thing IN THE
        # BROWSER. See docs/steps: that file needs the treatment
        # export_percentiles_csv.py already got (trimmed scope plus an
        # --all-periods flag for researchers), which is a Block J/K change,
        # not something to bolt onto a data load.
        #
        # SCOPED TO FILES GIT WOULD ACTUALLY COMMIT (2026-09-12). The message
        # says "refusing to commit", but `find` also matched
        # data/communes_history_full.csv -- which .gitignore excludes, and
        # which the step that builds it above calls "gitignored and never
        # committed". A file that is never committed cannot bloat the
        # repository, so failing the whole daily run over it threw away every
        # other source's data for nothing. Measured on run 34699560386 that
        # file is ~37.5 MB against this 39.06 MB threshold (find's `k` is
        # 1024 bytes), so it was ~1.5 MB from stopping the pipeline.
        #
        # The THRESHOLD IS UNCHANGED and every committed file is still
        # checked. docs/steps records the decision to fix the next overrun at
        # the source rather than raise this guard a third time; that still
        # holds.
        run: |
          OVERSIZED=""
          while IFS= read -r f; do
            # check-ignore exits 0 when the path IS ignored, so the `||`
            # branch collects exactly the files that would be committed.
            git check-ignore -q "$f" || OVERSIZED="${OVERSIZED}${f}"$'\n'
          done < <(find data/ public/ local/ -type f -size +40000k)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Committed file(s) under data/, public/ or local/ exceed 40 MB; refusing to commit:"
            echo "$OVERSIZED" | while read -r f; do
              [ -n "$f" ] && echo "  $f ($(du -h "$f" | cut -f1))"
            done
            exit 1
          fi

      - name: Refuse if the committed database was written
        # Belt and braces for the comment on the assemble step: this workflow
        # has no business changing the committed database, and a bot PR that
        # did would bypass the daily run's offload checks entirely.
        run: git diff --exit-code --stat -- data/belgian_macro.db

      - name: Open PR if the exports changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/ local/
          if git diff --staged --quiet; then
            echo "Exports already match the committed manual store; nothing to do."
            exit 0
          fi
          BRANCH="bot/manual-sources-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Regenerate exports from manual sources"
          git push origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Regenerate exports from manual sources" \
            --body "Regenerated from the committed data/population_observations.csv.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
