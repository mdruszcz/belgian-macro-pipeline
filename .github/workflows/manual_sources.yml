name: Regenerate exports from manual sources

# Manual trigger only, deliberately. This workflow CANNOT fetch the data it
# concerns: statbel.fgov.be is unreachable from GitHub's runners, which is the
# whole reason population lives in a committed CSV rather than in the daily
# database (docs/decisions/0002-split-committed-stores.md).
#
# What it does: takes the already-committed data/population_observations.csv,
# validates it round-trips, and regenerates the published exports from it, so
# export generation is identical whether the trigger was the daily fetch or a
# manual population refresh.
#
# Loading new raw files is a local procedure -- see docs/features/manual_sources.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.BOT_PAT }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply pending schema migrations
        # Same idempotent step daily_fetch.yml runs. This workflow regenerates
        # the same exports from the same database, so it needs the same schema
        # guarantees; without it, a fresh migration would only ever reach the
        # committed store on a daily run.
        run: python -m src.db.migrate --db data/belgian_macro.db

      - name: Ensure manual-source reference rows
        # THE STEP THIS WORKFLOW WAS MISSING (run 2026-09-06 failed here).
        # The fiscal observations live in a committed CSV, but their name and
        # unit are read from the `indicators` table so there is exactly one
        # metadata path -- and export_communes_csv.py refuses to guess when a
        # referenced indicator is absent, by design. daily_fetch.yml has had
        # this step since the fiscal store landed; this workflow did not, so
        # it crashed on the first run after that store was added. Reads config
        # only: no network, no workbook, idempotent.
        run: python scripts/sync_fiscal_income.py --db data/belgian_macro.db --reference-rows-only

      - name: Ensure real-estate reference rows
        # Same pattern: OBSERVATIONS live in a committed CSV, name/unit come
        # from the indicators table. Config only -- no network, no workbook.
        run: python scripts/sync_realestate.py --db data/belgian_macro.db --reference-rows-only

      - name: Ensure Census 2021 reference rows
        # Same pattern as the fiscal step above: the OBSERVATIONS live in a
        # committed CSV, but name/unit come from the `indicators` table so
        # there is one metadata path. Config only -- no network, no workbook.
        run: python scripts/sync_census2021.py --db data/belgian_macro.db --reference-rows-only

      - name: Validate the manual store rebuilds cleanly
        # Fails loudly if the committed CSV cannot reconstruct a valid database
        # -- a corrupted or hand-edited store must not reach the exports.
        run: |
          python scripts/load_observations_csv.py \
            --db "${RUNNER_TEMP}/manual.db" \
            --csv data/population_observations.csv
          python - <<'PY'
          import os, sqlite3
          conn = sqlite3.connect(os.path.join(os.environ["RUNNER_TEMP"], "manual.db"))
          violations = conn.execute("PRAGMA foreign_key_check").fetchall()
          if violations:
              raise SystemExit(f"::error::Rebuilt manual store has FK violations: {violations}")
          rows = conn.execute("SELECT COUNT(*) FROM observations").fetchone()[0]
          print(f"Manual store rebuilt cleanly: {rows} observations, 0 FK violations.")
          PY

      - name: Regenerate exports
        run: |
          python scripts/export_communes_csv.py --db data/belgian_macro.db \
            --out data/communes_export.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv
          python scripts/export_communes_history_csv.py --db data/belgian_macro.db \
            --out data/communes_history.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv
          python -m src.exporters.metadata --out data/metadata/indicators.json

      - name: Export province/region/Belgium aggregates
        # Block L -- docs/features/comparison.md. Feeds the comparison column
        # on every commune page. Reads the UNRESTRICTED observation set
        # (including communes merged away since) so a province total is not
        # short by the communes that no longer exist -- measured at -24.4%
        # for Limburg 2023 when that is got wrong.
        run: |
          python scripts/export_aggregates_csv.py --db data/belgian_macro.db \
            --out data/aggregates.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv

      - name: Export national and regional peer positions
        # Block L -- docs/features/comparison.md. Latest period per indicator
        # only: the full history is 174k rows / 22 MB against a 25 MB commit
        # guard, for periods no page shows. --all-periods exists for a
        # researcher who wants the rest.
        run: |
          python scripts/export_percentiles_csv.py --db data/belgian_macro.db \
            --out data/percentiles.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv

      - name: Export per-entity site payloads for /local
        # Block J -- docs/features/site_payloads.md. See daily_fetch.yml for
        # the full rationale; this workflow does not run validate_data.py
        # against the main DB (only the manual-store round-trip check
        # above), so the manifest records that honestly rather than
        # claiming a check that did not happen.
        run: |
          python scripts/export_site_payloads.py --db data/belgian_macro.db \
            --communes-history data/communes_history.csv \
            --communes-latest data/communes_export.csv \
            --national data/belgian_macro_export.csv \
            --out-dir public/data \
            --build-id "${{ github.run_id }}" \
            --validation-status unknown

      - name: Guard against oversized data files
        run: |
          OVERSIZED=$(find data/ public/ -type f -size +25000k)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::File(s) under data/ or public/ exceed 25 MB; refusing to commit:"
            echo "$OVERSIZED" | while read -r f; do echo "  $f ($(du -h "$f" | cut -f1))"; done
            exit 1
          fi

      - name: Open PR if the exports changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "Exports already match the committed manual store; nothing to do."
            exit 0
          fi
          BRANCH="bot/manual-sources-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Regenerate exports from manual sources"
          git push origin "$BRANCH"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Regenerate exports from manual sources" \
            --body "Regenerated from the committed data/population_observations.csv.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
