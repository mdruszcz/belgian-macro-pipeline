name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The browser suite alone measures ~6 minutes locally and the full suite
    # ~8, before a cold runner downloads Chromium and its system libraries.
    # At 10 this job could not finish, and the failure would have looked like
    # a hang rather than a budget.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright's Chromium
        # The package alone still skips every browser-gated test (see
        # tests/builder/test_builder_shell_service.py::_chromium); the binary
        # has to be installed too. --with-deps pulls the system libraries
        # ubuntu-latest doesn't ship. Chromium only -- it's the only browser
        # any test launches.
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Validate indicator/source config
        run: python scripts/validate_config.py

      - name: Validate the committed data stores
        # Catches a bad hand-edited store at PR time rather than after it is
        # merged and published. The daily workflow runs the same rules before
        # its export step. See docs/features/validation.md.
        run: python scripts/validate_data.py

      - name: Tests
        run: pytest -q
