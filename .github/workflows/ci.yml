name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Three tiers as three parallel jobs, so the fast one reports first, and a
# fourth job named `test` that only passes when all three did -- `test` is
# the name the branch ruleset requires, and splitting the work must not
# quietly weaken that gate to the fast tier alone. The tiers themselves are
# pytest markers (pyproject.toml) behind Makefile targets, so what each tier
# contains is defined in exactly one place and CI merely calls it.
#
# DOCS-ONLY SHORT-CIRCUIT (2026-09-15): a change touching only docs/** and/or
# root-level *.md files (docs/steps updates, this being the clearest case)
# used to still pay for a full install + the whole fast/browser/
# generated-site suite, 3-5 minutes each, for a diff with no code or data in
# it at all. Each job now detects this itself (a plain `git diff`, no
# third-party action -- this repo uses only official actions/* elsewhere)
# and SKIPS its own real work when true, but still exits successfully
# rather than being skipped at the job level: the `test` gate below
# deliberately treats a skipped tier as a failure ("green can never mean
# some of it ran"), and a docs-only change genuinely did not need that tier
# to run, so it must report success, not absence. `git diff` needs real
# history, hence `fetch-depth: 0` on every checkout here now (checkout's
# default is a 1-commit shallow clone). A first push to a new branch (`git
# diff`'s base is the all-zero SHA) or anything the check cannot resolve
# always falls back to running everything -- silently skipping real work is
# the wrong failure mode, an extra few minutes of CI is not.
jobs:
  fast:
    # The everyday loop: lint, config and data validation, and every test that
    # needs neither a browser nor the generated site.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a docs-only change
        id: docsonly
        run: .github/workflows/docs_only.sh

      - uses: actions/setup-python@v5
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        # Declared, not assumed: the fast tier runs the site's own JavaScript
        # through node (tests/test_map_ui_logic.py and friends), which until now
        # worked only because ubuntu-latest happens to ship it.
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.docsonly.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.docsonly.outputs.docs_only != 'true'
        run: ruff check .

      - name: Format check
        if: steps.docsonly.outputs.docs_only != 'true'
        run: black --check .

      - name: Shared header/footer in sync (Batch A1.1)
        if: steps.docsonly.outputs.docs_only != 'true'
        # home2.html and macro.html carry a rendered copy of src/pages/shell.py's
        # render_header()/render_footer() inside delimited zones -- this fails
        # the PR the moment shell.py changes and nobody re-ran the sync, rather
        # than shipping two pages whose chrome silently drifted from the rest
        # of the site.
        run: python scripts/sync_site_shell.py --check

      - name: Validate indicator/source config
        if: steps.docsonly.outputs.docs_only != 'true'
        run: python scripts/validate_config.py

      - name: Assemble the working database
        if: steps.docsonly.outputs.docs_only != 'true'
        # The committed database plus every in_db store's committed CSV, at
        # the gitignored data/local/working.db -- the same database the daily
        # workflow validates. Validating data/belgian_macro.db on its own
        # would fail every PR: since the ONEM/WalStat cutover it holds 1,939
        # of ~86,000 observations, and indicator_disappeared would fire on
        # eighteen indicators (docs/decisions/0006).
        run: python scripts/build_staging_db.py

      - name: Validate the committed data stores
        if: steps.docsonly.outputs.docs_only != 'true'
        # Catches a bad hand-edited store at PR time rather than after it is
        # merged and published. The daily workflow runs the same rules before
        # its export step. See docs/features/validation.md. Reads the working
        # database assembled above, and refuses to run if it is absent.
        run: python scripts/validate_data.py

      - name: Tests (fast tier)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: make test

  browser:
    # The Playwright suite. One Chromium per session (tests/conftest.py); the
    # binary and its system libraries are installed only here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a docs-only change
        id: docsonly
        run: .github/workflows/docs_only.sh

      - uses: actions/setup-python@v5
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        if: steps.docsonly.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"

      - name: Install Playwright's Chromium
        if: steps.docsonly.outputs.docs_only != 'true'
        # The package alone still skips every browser-gated test (see
        # tests/conftest.py); the binary has to be installed too. --with-deps
        # pulls the system libraries ubuntu-latest doesn't ship. Chromium only
        # -- it's the only browser any test launches.
        run: playwright install --with-deps chromium

      - name: Tests (browser tier)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: make test-browser

  generated-site:
    # The sweeps over the generated local/ and preview/ output -- one case per
    # route or page -- plus anything marked slow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect a docs-only change
        id: docsonly
        run: .github/workflows/docs_only.sh

      - uses: actions/setup-python@v5
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.docsonly.outputs.docs_only != 'true'
        run: pip install -e ".[dev]"

      - name: Detect a change no page generator reads
        id: siteinert
        if: steps.docsonly.outputs.docs_only != 'true'
        run: .github/workflows/site_inert.sh

      - name: Tests (generated-site tier)
        if: steps.docsonly.outputs.docs_only != 'true' && steps.siteinert.outputs.site_inert != 'true'
        run: make test-generated-site

      - name: Tests (slow only -- the change cannot affect the generated site)
        # SITE-INERT SHORT-CIRCUIT (2026-09-23, maintainer's request): the
        # generated_site sweeps are the thirteen-minute part of this tier and
        # only matter when something a page generator reads changed. A change
        # confined to fetchers, sync scripts, orchestration, source/store
        # config, validation or non-page tests (site_inert.sh has the exact
        # allowlist) runs the `slow` tests only -- the store, validation and
        # export checks still run on every PR. Any doubt runs everything.
        if: steps.docsonly.outputs.docs_only != 'true' && steps.siteinert.outputs.site_inert == 'true'
        run: make test-slow

  test:
    # The required check. Passes only when every tier passed; a cancelled or
    # skipped-AT-THE-JOB-LEVEL tier fails it too, so "green" can never mean
    # "some of it ran". A tier that ran its own docs-only short-circuit
    # still reports `success` here (see the jobs above), so this gate's
    # meaning is unchanged by it.
    runs-on: ubuntu-latest
    needs: [fast, browser, generated-site]
    if: always()
    steps:
      - name: Every tier must have passed
        run: |
          echo "fast=${{ needs.fast.result }} browser=${{ needs.browser.result }} generated-site=${{ needs.generated-site.result }}"
          test "${{ needs.fast.result }}" = "success" || exit 1
          test "${{ needs.browser.result }}" = "success" || exit 1
          test "${{ needs.generated-site.result }}" = "success" || exit 1
