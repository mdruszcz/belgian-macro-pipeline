name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

# Three tiers as three parallel jobs, so the fast one reports first, and a
# fourth job named `test` that only passes when all three did -- `test` is
# the name the branch ruleset requires, and splitting the work must not
# quietly weaken that gate to the fast tier alone. The tiers themselves are
# pytest markers (pyproject.toml) behind Makefile targets, so what each tier
# contains is defined in exactly one place and CI merely calls it.
jobs:
  fast:
    # The everyday loop: lint, config and data validation, and every test that
    # needs neither a browser nor the generated site.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        # Declared, not assumed: the fast tier runs the site's own JavaScript
        # through node (tests/test_map_ui_logic.py and friends), which until now
        # worked only because ubuntu-latest happens to ship it.
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Validate indicator/source config
        run: python scripts/validate_config.py

      - name: Validate the committed data stores
        # Catches a bad hand-edited store at PR time rather than after it is
        # merged and published. The daily workflow runs the same rules before
        # its export step. See docs/features/validation.md.
        run: python scripts/validate_data.py

      - name: Tests (fast tier)
        run: make test

  browser:
    # The Playwright suite. One Chromium per session (tests/conftest.py); the
    # binary and its system libraries are installed only here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Playwright's Chromium
        # The package alone still skips every browser-gated test (see
        # tests/conftest.py); the binary has to be installed too. --with-deps
        # pulls the system libraries ubuntu-latest doesn't ship. Chromium only
        # -- it's the only browser any test launches.
        run: playwright install --with-deps chromium

      - name: Tests (browser tier)
        run: make test-browser

  generated-site:
    # The sweeps over the generated local/ and preview/ output -- one case per
    # route or page -- plus anything marked slow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tests (generated-site tier)
        run: make test-generated-site

  test:
    # The required check. Passes only when every tier passed; a cancelled or
    # skipped tier fails it too, so "green" can never mean "some of it ran".
    runs-on: ubuntu-latest
    needs: [fast, browser, generated-site]
    if: always()
    steps:
      - name: Every tier must have passed
        run: |
          echo "fast=${{ needs.fast.result }} browser=${{ needs.browser.result }} generated-site=${{ needs.generated-site.result }}"
          test "${{ needs.fast.result }}" = "success" || exit 1
          test "${{ needs.browser.result }}" = "success" || exit 1
          test "${{ needs.generated-site.result }}" = "success" || exit 1
