name: Daily Belgian Macro Fetch

on:
  schedule:
    # 06:00 CET = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # A PAT, not the default GITHUB_TOKEN: PRs/pushes made with GITHUB_TOKEN don't trigger this
  # repo's own pull_request-triggered workflows (GitHub's recursive-run guard), so ci.yml's
  # required "test" check would never appear on the bot's PR and it would sit BLOCKED forever.
  GH_TOKEN: ${{ secrets.BOT_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Fail if a previous daily-fetch PR is still open
        run: |
          OPEN=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefName,url,createdAt \
            --jq '[.[] | select(.headRefName | startswith("bot/daily-fetch-"))]')
          if [ "$(echo "$OPEN" | jq 'length')" -gt 0 ]; then
            echo "::error::Unmerged daily-fetch PR(s) from a previous run. Resolve before this runs again:"
            echo "$OPEN" | jq -r '.[] | "  \(.url) (opened \(.createdAt))"'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch macro indicators
        id: fetch_macro
        continue-on-error: true
        run: python belgian_macro_db.py --fetch --latest --export csv

      - name: Sync to canonical schema
        id: sync_canonical
        continue-on-error: true
        run: python scripts/sync_to_canonical.py --db data/belgian_macro.db

      - name: Load Belgian geography
        id: load_geography
        continue-on-error: true
        # Reads only the committed config/geography/*.csv (no network) -- see
        # docs/features/geography.md. Idempotent, so safe to run every day;
        # this is what makes observations.geo_id resolvable for any
        # municipal-level source (Block F) instead of only 'be:country'.
        run: python scripts/load_geography.py --db data/belgian_macro.db

      - name: Sync Statbel municipal indicators
        id: sync_statbel
        continue-on-error: true
        # Block F -- docs/features/statbel_adapter.md. Depends on the
        # geography load above for observations.geo_id to resolve.
        run: python scripts/sync_statbel.py --db data/belgian_macro.db

      - name: Validate the data before exporting
        # Between sync and export deliberately: a `fail` here stops the run
        # BEFORE anything is written to the published CSVs or committed.
        # Validation that only logs is decoration -- see
        # docs/features/validation.md. Warnings print and do not block.
        run: python scripts/validate_data.py --db data/belgian_macro.db

      - name: Export canonical CSV for the dashboard
        # Overwrites belgian_macro_export.csv (written above from the legacy
        # schema) with the canonical-schema version the dashboard now reads.
        # belgian_forecasts.csv, written above too, is untouched -- forecasts
        # stay on the legacy table, out of scope per docs/decisions/0001.
        run: python scripts/export_canonical_csv.py --db data/belgian_macro.db --out data/belgian_macro_export.csv

      - name: Export commune CSV for communes.html
        # Municipal-level sibling of the export above -- communes.html reads
        # this, the same way all_data.html reads belgian_macro_export.csv.
        # --extra-observations merges the manual-only store, which is a committed
        # CSV rather than rows in the database -- statbel.fgov.be is unreachable
        # from CI so population can never be fetched here.
        # See docs/decisions/0002-split-committed-stores.md.
        run: |
          python scripts/export_communes_csv.py --db data/belgian_macro.db \
            --out data/communes_export.csv \
            --extra-observations data/population_observations.csv

      - name: Export indicator metadata for the dashboard
        run: python -m src.exporters.metadata --out data/metadata/indicators.json

      - name: Fetch market data
        id: fetch_stocks
        continue-on-error: true
        run: python fetch_stocks.py

      - name: Guard against oversized data files
        run: |
          OVERSIZED=$(find data/ -type f -size +25000k)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::File(s) under data/ exceed 25 MB; refusing to commit:"
            echo "$OVERSIZED" | while read -r f; do echo "  $f ($(du -h "$f" | cut -f1))"; done
            exit 1
          fi

      - name: Stage data changes
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No data changes today."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated data
        id: pr
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          BRANCH="bot/daily-fetch-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "📊 Daily update $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "📊 Daily data update $(date -u +%Y-%m-%d)" \
            --body "Automated daily fetch of Belgian macro indicators and market data.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pipeline outcome: macro=${{ steps.fetch_macro.outcome }}, sync=${{ steps.sync_canonical.outcome }}, market=${{ steps.fetch_stocks.outcome }}")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"

      - name: Enable auto-merge
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          if ! gh pr merge --auto --squash --delete-branch "${{ steps.pr.outputs.pr_url }}"; then
            echo "::error::Could not enable auto-merge on ${{ steps.pr.outputs.pr_url }} — it will NOT merge itself. Check the required 'test' check and merge manually."
            exit 1
          fi

      - name: Fail run if any source failed
        if: steps.fetch_macro.outcome == 'failure' || steps.sync_canonical.outcome == 'failure' || steps.load_geography.outcome == 'failure' || steps.sync_statbel.outcome == 'failure' || steps.fetch_stocks.outcome == 'failure'
        run: |
          echo "::error::A pipeline step failed (macro=${{ steps.fetch_macro.outcome }}, sync=${{ steps.sync_canonical.outcome }}, geography=${{ steps.load_geography.outcome }}, statbel=${{ steps.sync_statbel.outcome }}, market=${{ steps.fetch_stocks.outcome }}). Partial data was still committed; see the run log and fetch_runs/legacy_fetch_log."
          exit 1
