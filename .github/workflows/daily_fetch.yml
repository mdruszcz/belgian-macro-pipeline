name: Daily Belgian Macro Fetch

on:
  schedule:
    # 06:00 CET = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # A PAT, not the default GITHUB_TOKEN: PRs/pushes made with GITHUB_TOKEN don't trigger this
  # repo's own pull_request-triggered workflows (GitHub's recursive-run guard), so ci.yml's
  # required "test" check would never appear on the bot's PR and it would sit BLOCKED forever.
  GH_TOKEN: ${{ secrets.BOT_PAT }}
  # THE ONE DATABASE THE DAGSTER STEP READS AND WRITES (through
  # orchestration/definitions.py default_paths), until its last asset
  # (docs/decisions/0006-stores-split-by-volume.md). It is the committed
  # data/belgian_macro.db plus every in_db store's committed CSV (ONEM, ONEM's
  # published rate, WalStat, the international series), assembled fresh each
  # run and gitignored. The committed database is written exactly once, by
  # committed_stores -- offload() from scripts/offload_stores.py -- as the last
  # asset of the same Dagster run as validation and every export: a failed
  # check or export skips it, and a run that fails before it changes no
  # committed file at all.
  WORKING_DB: data/local/working.db

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Fail if a previous daily-fetch PR is still open
        run: |
          OPEN=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefName,url,createdAt \
            --jq '[.[] | select(.headRefName | startswith("bot/daily-fetch-"))]')
          if [ "$(echo "$OPEN" | jq 'length')" -gt 0 ]; then
            echo "::error::Unmerged daily-fetch PR(s) from a previous run. Resolve before this runs again:"
            echo "$OPEN" | jq -r '.[] | "  \(.url) (opened \(.createdAt))"'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Dagster itself, at the exact version requirements-dagster.txt pins,
        # without its web UI: the runner executes, nobody browses it.
        run: pip install -r requirements.txt "$(grep '^dagster==' requirements-dagster.txt)"

      - name: Assemble, fetch every source, validate and export (Dagster)
        id: daily
        # ONE ephemeral Dagster execution (docs/features/orchestration.md,
        # steps 2 and 3): python -m orchestration.daily runs, in this order,
        #   assemble_working_database    scripts/build_staging_db.py
        #   fetch_sources                the macro fetch, sync_to_canonical,
        #                                Statbel, ONEM, ONEM's rate, WalStat,
        #                                the international series and the
        #                                market data -- each may fail without
        #                                stopping the others, as
        #                                continue-on-error did here before
        #   validate_export_and_offload  the validation rules as blocking checks
        #                                (a FAIL stops every export and the
        #                                volume baseline, as --record-volume
        #                                did), the revisions report, every
        #                                export and page, then committed_stores:
        #                                the offload, the only writer of
        #                                data/belgian_macro.db and the in_db
        #                                CSVs, skipped in that same run if an
        #                                export or a blocking check failed
        # Each asset runs the same script with the same arguments these steps
        # used to, or calls that script's own function with them;
        # tests/test_orchestration.py holds commands.py to that.
        #
        # Its history lives in $RUNNER_TEMP and dies with the runner. It
        # writes this run's manifest under data/local/ (gitignored) and hands
        # its path to the gate below through $GITHUB_OUTPUT.
        #
        # EXIT CODES. 0: all green, offloaded. 3: exported and offloaded, but a
        # source was red -- carry on and open the PR, which will NOT
        # auto-merge. Anything else (1: assemble, validation, an export or the
        # offload failed; a crash): stop here, before anything is committed. A
        # refused offload changed no file; one that crashed while replacing its
        # files may have replaced some in this runner's checkout, which is
        # thrown away with it. The summary is copied first, so a failing
        # validation still shows its report.
        env:
          BUILD_ID: ${{ github.run_id }}
          DAGSTER_HOME: ${{ runner.temp }}/dagster_home
          DAGSTER_DISABLE_TELEMETRY: '1'
          VALIDATION_SUMMARY: ${{ runner.temp }}/validation-summary.md
        run: |
          set +e
          python -m orchestration.daily --github-output "$GITHUB_OUTPUT"
          STATUS=$?
          set -e
          if [ -f "$VALIDATION_SUMMARY" ]; then
            cat "$VALIDATION_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Validation did not run: the working database was not assembled or the run crashed._" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "validation_summary=$VALIDATION_SUMMARY" >> "$GITHUB_ENV"
          if [ "$STATUS" -eq 3 ]; then
            echo "::warning::At least one source failed; the data that did arrive is exported and will not auto-merge."
            exit 0
          fi
          exit $STATUS

      - name: Guard against oversized data files
        # TEMPORARILY 80 MB (was 40), maintainer's decision 2026-09-23: the new
        # municipal sources took data/communes_history.csv from 36 to 62 MB and
        # blocked publication. The source-side fix (splitting that download per
        # source) follows next; restore 40 MB when it lands.
        # A repo-health tripwire, not a technical limit (GitHub warns at
        # 50 MB). Scoped to files git would actually commit: a gitignored
        # file (data/communes_history_full.csv, data/local/**) cannot bloat
        # the repository. THE THRESHOLD IS UNCHANGED -- docs/steps records the
        # decision to fix the next overrun at the source rather than raise
        # this guard a third time.
        run: |
          OVERSIZED=""
          while IFS= read -r f; do
            # check-ignore exits 0 when the path IS ignored, so the `||`
            # branch collects exactly the files that would be committed.
            git check-ignore -q "$f" || OVERSIZED="${OVERSIZED}${f}"$'\n'
          done < <(find data/ public/ local/ -type f -size +80000k)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::Committed file(s) under data/, public/ or local/ exceed 80 MB; refusing to commit:"
            echo "$OVERSIZED" | while read -r f; do
              [ -n "$f" ] && echo "  $f ($(du -h "$f" | cut -f1))"
            done
            exit 1
          fi

      - name: Check every source succeeded
        id: sources
        # BEFORE the PR, not after it. This check used to run last, after the
        # PR was opened and auto-merge enabled -- so a day on which a source
        # failed merged its partial data by itself and only then went red.
        # The PR is still opened (the data that did arrive is not thrown
        # away), but it only auto-merges when every source succeeded.
        #
        # Reads THIS run's source manifest, the path the Dagster step wrote --
        # never a fixed path, so an older manifest cannot pass for today's.
        # all_ok is "true" only if the assemble, every tracked outcome
        # (orchestration/commands.py TRACKED), validate_and_export and the
        # offload succeeded (orchestration/manifest.py gate()).
        # A missing manifest fails this step: no evidence, no PR.
        run: |
          python -m orchestration.manifest "${{ steps.daily.outputs.manifest }}" > "$RUNNER_TEMP/gate.txt"
          cat "$RUNNER_TEMP/gate.txt"
          cat "$RUNNER_TEMP/gate.txt" >> "$GITHUB_OUTPUT"

      - name: Stage data changes
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/ local/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No data changes today."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated data
        id: pr
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          BRANCH="bot/daily-fetch-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "📊 Daily update $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "📊 Daily data update $(date -u +%Y-%m-%d)" \
            --body "Automated daily fetch of Belgian macro indicators and market data.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pipeline outcome: ${{ steps.sources.outputs.summary }}
          Auto-merge: ${{ steps.sources.outputs.all_ok == 'true' && 'enabled' || 'NOT enabled -- a source failed; review and merge by hand' }}

          $(cat "$validation_summary" 2>/dev/null || echo '_Validation summary unavailable._')")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"

      - name: Enable auto-merge
        if: steps.stage.outputs.has_changes == 'true' && steps.sources.outputs.all_ok == 'true'
        run: |
          if ! gh pr merge --auto --squash --delete-branch "${{ steps.pr.outputs.pr_url }}"; then
            echo "::error::Could not enable auto-merge on ${{ steps.pr.outputs.pr_url }} — it will NOT merge itself. Check the required 'test' check and merge manually."
            exit 1
          fi

      - name: Fail run if any source failed
        if: steps.sources.outputs.all_ok != 'true'
        run: |
          echo "::error::A pipeline step failed (${{ steps.sources.outputs.summary }}). The data that did arrive is in ${{ steps.pr.outputs.pr_url || 'no PR (nothing changed)' }}, which was NOT auto-merged. See the Dagster step's log and fetch_runs/legacy_fetch_log."
          exit 1
