name: Daily Belgian Macro Fetch

on:
  schedule:
    # 06:00 CET = 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # A PAT, not the default GITHUB_TOKEN: PRs/pushes made with GITHUB_TOKEN don't trigger this
  # repo's own pull_request-triggered workflows (GitHub's recursive-run guard), so ci.yml's
  # required "test" check would never appear on the bot's PR and it would sit BLOCKED forever.
  GH_TOKEN: ${{ secrets.BOT_PAT }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Fail if a previous daily-fetch PR is still open
        run: |
          OPEN=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefName,url,createdAt \
            --jq '[.[] | select(.headRefName | startswith("bot/daily-fetch-"))]')
          if [ "$(echo "$OPEN" | jq 'length')" -gt 0 ]; then
            echo "::error::Unmerged daily-fetch PR(s) from a previous run. Resolve before this runs again:"
            echo "$OPEN" | jq -r '.[] | "  \(.url) (opened \(.createdAt))"'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply pending schema migrations
        # Idempotent by design (schema_migrations tracking table), so it is
        # safe to run every day. This is what brings migration 003's
        # indicator_volume table into the committed store; the volume rules
        # no-op quietly until it exists, so ordering it before the fetch
        # simply means the first run after this lands starts collecting
        # history immediately.
        run: python -m src.db.migrate --db data/belgian_macro.db

      - name: Fetch macro indicators
        id: fetch_macro
        continue-on-error: true
        run: python belgian_macro_db.py --fetch --latest --export csv

      - name: Sync to canonical schema
        id: sync_canonical
        continue-on-error: true
        run: python scripts/sync_to_canonical.py --db data/belgian_macro.db

      - name: Load Belgian geography
        id: load_geography
        continue-on-error: true
        # Reads only the committed config/geography/*.csv (no network) -- see
        # docs/features/geography.md. Idempotent, so safe to run every day;
        # this is what makes observations.geo_id resolvable for any
        # municipal-level source (Block F) instead of only 'be:country'.
        run: python scripts/load_geography.py --db data/belgian_macro.db

      - name: Sync Statbel municipal indicators
        id: sync_statbel
        continue-on-error: true
        # Block F -- docs/features/statbel_adapter.md. Depends on the
        # geography load above for observations.geo_id to resolve.
        run: python scripts/sync_statbel.py --db data/belgian_macro.db

      - name: Ensure manual-source reference rows
        # The fiscal-income OBSERVATIONS live in a committed CSV, but their
        # name/unit metadata is read from the `indicators` table so there is
        # exactly one metadata path (export_communes_csv.py). This inserts
        # only those reference rows; it reads config and needs no network and
        # no hand-downloaded workbook. Idempotent.
        run: python scripts/sync_fiscal_income.py --db data/belgian_macro.db --reference-rows-only

      - name: Ensure real-estate reference rows
        # Same pattern: OBSERVATIONS live in a committed CSV, name/unit come
        # from the indicators table. Config only -- no network, no workbook.
        run: python scripts/sync_realestate.py --db data/belgian_macro.db --reference-rows-only

      - name: Ensure police.be reference rows
        # Same pattern again: OBSERVATIONS live in data/police_observations.csv,
        # name/unit come from the indicators table. Config only -- no network,
        # no source file needed.
        run: python scripts/sync_police.py --db data/belgian_macro.db --reference-rows-only

      - name: Ensure Census 2021 reference rows
        # Same pattern as the fiscal step above: the OBSERVATIONS live in a
        # committed CSV, but name/unit come from the `indicators` table so
        # there is one metadata path. Config only -- no network, no workbook.
        run: python scripts/sync_census2021.py --db data/belgian_macro.db --reference-rows-only

      - name: Validate the data before exporting
        # Between sync and export deliberately: a `fail` here stops the run
        # BEFORE anything is written to the published CSVs or committed.
        # Validation that only logs is decoration -- see
        # docs/features/validation.md. Warnings print and do not block.
        #
        # --record-volume writes the is_latest count per indicator ONLY if
        # this run passed, so tomorrow's row_collapse rule has a baseline.
        # Recording on a failing run would make the collapsed count the new
        # normal and silence the alarm on the next run.
        run: python scripts/validate_data.py --db data/belgian_macro.db --record-volume

      - name: Report today's revisions
        # Informational only -- does NOT block (docs/features/vintages.md).
        # A revision is a legitimate event; the pathological case (a source
        # returning garbage) is already caught by the row_collapse/null_share
        # validation rules above, which DO block. --since today's date so
        # this reports only what THIS run changed, not all history.
        run: python scripts/revisions_report.py --db data/belgian_macro.db --since "$(date -u +%Y-%m-%d)"

      - name: Export canonical CSV for the dashboard
        # Overwrites belgian_macro_export.csv (written above from the legacy
        # schema) with the canonical-schema version the dashboard now reads.
        # belgian_forecasts.csv, written above too, is untouched -- forecasts
        # stay on the legacy table, out of scope per docs/decisions/0001.
        run: python scripts/export_canonical_csv.py --db data/belgian_macro.db --out data/belgian_macro_export.csv

      - name: Export commune CSV for communes.html
        # Municipal-level sibling of the export above -- communes.html reads
        # this, the same way all_data.html reads belgian_macro_export.csv.
        # --extra-observations merges the manual-only store, which is a committed
        # CSV rather than rows in the database -- statbel.fgov.be is unreachable
        # from CI so population can never be fetched here.
        # See docs/decisions/0002-split-committed-stores.md.
        run: |
          python scripts/export_communes_csv.py --db data/belgian_macro.db \
            --out data/communes_export.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv \
            --extra-observations data/police_observations.csv

      - name: Export the full commune time series for communes.html
        # Sibling to the snapshot export above: every period per (commune,
        # indicator), not just the latest, plus every configured derived
        # indicator computed over the whole history (Block G engine).
        # docs/features/statbel_adapter.md's "a time-series view is a
        # different, future feature" note -- this is that feature.
        run: |
          python scripts/export_communes_history_csv.py --db data/belgian_macro.db \
            --out data/communes_history.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv \
            --extra-observations data/police_observations.csv

      - name: Precompute communes.html's table payload
        # communes.html used to fetch communes_history.csv directly and
        # re-derive its own table shape (parseCSV()+pivot()) in every
        # visitor's browser -- 162,272 rows re-parsed and re-deduplicated on
        # every page load, for a shape that never changes between visitors.
        # ONEM pushed that CSV from 22.9 to 32.2 MB, which is what surfaced
        # this as worth fixing rather than only raising the size guard.
        # communes_history.csv itself is untouched and still published, for
        # a researcher who wants the raw rows -- this is an ADDITIONAL,
        # smaller artifact (11.0 MB vs 32.2 MB raw; 1.33 vs 2.28 MB gzipped),
        # not a replacement.
        run: |
          python scripts/export_communes_table_json.py \
            --communes-history data/communes_history.csv \
            --out data/communes_table.json

      - name: Export province/region/Belgium aggregates
        # Block L -- docs/features/comparison.md. Feeds the comparison column
        # on every commune page. Reads the UNRESTRICTED observation set
        # (including communes merged away since) so a province total is not
        # short by the communes that no longer exist -- measured at -24.4%
        # for Limburg 2023 when that is got wrong.
        run: |
          python scripts/export_aggregates_csv.py --db data/belgian_macro.db \
            --out data/aggregates.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv \
            --extra-observations data/police_observations.csv

      - name: Export indicator metadata for the dashboard
        run: python -m src.exporters.metadata --out data/metadata/indicators.json

      - name: Export national and regional peer positions
        # Block L -- docs/features/comparison.md. Latest period per indicator
        # only: the full history is 174k rows / 22 MB against a 25 MB commit
        # guard, for periods no page shows. --all-periods exists for a
        # researcher who wants the rest.
        run: |
          python scripts/export_percentiles_csv.py --db data/belgian_macro.db \
            --out data/percentiles.csv \
            --extra-observations data/population_observations.csv \
            --extra-observations data/fiscal_income_observations.csv \
            --extra-observations data/census2021_observations.csv \
            --extra-observations data/realestate_observations.csv \
            --extra-observations data/police_observations.csv

      - name: Export per-entity site payloads for /local
        # Block J -- docs/features/site_payloads.md. Reshapes the bulk CSVs
        # written above into public/data/{national,communes/*,indicators/*,
        # metadata/geographies}.json; writes nothing new, computes nothing
        # new. Runs after validate_data.py above, which already blocked the
        # job on failure, so validation-status is always "pass" here.
        run: |
          python scripts/export_site_payloads.py --db data/belgian_macro.db \
            --communes-history data/communes_history.csv \
            --communes-latest data/communes_export.csv \
            --national data/belgian_macro_export.csv \
            --out-dir public/data \
            --build-id "${{ github.run_id }}" \
            --validation-status pass

      - name: Fetch market data
        id: fetch_stocks
        continue-on-error: true
        run: python fetch_stocks.py

      - name: Sync ONEM/RVA commune unemployment
        id: sync_onem
        continue-on-error: true
        # THE PIPELINE'S FIRST AUTOMATED MUNICIPAL SOURCE. Every other one is
        # a hand download because statbel.fgov.be is unreachable from these
        # runners; onem.be is not (run 34054441348 fetched 6/6, run
        # 34056982618 put them in an artifact so their columns could actually
        # be read). So these observations go into the daily database rather
        # than a committed CSV -- ADR 0002 splits the stores on exactly that
        # question.
        #
        # Fetches and parses in one step: scripts/sync_onem.py calls
        # fetch_onem_raw.fetch_all() itself, then reads the six .xls files it
        # cached. Depends on the geography load above, since ONEM names
        # communes in French text with no NIS code and they are resolved
        # against `geographies`.
        #
        # continue-on-error with the failure gate at the end of this job, the
        # same shape as sync_statbel: a source being down must not throw away
        # the day's other data, but must still fail the run visibly.
        run: python scripts/sync_onem.py --db data/belgian_macro.db

      - name: Probe police.be crime statistics (reachability test)
        id: fetch_police
        continue-on-error: true
        # NOT wired into any export yet -- see docs/data_catalog.md's
        # police.be row and scripts/fetch_police_raw.py's docstring. The
        # maintainer verified in a browser that this endpoint returns 200 and
        # application/json with no login of any kind, but this pipeline's own
        # network context is served an HTTP 403 "Maintenance" page on every
        # request including the bare front page, and is handed no cookies, so
        # no session can be started and the response shape cannot be read
        # here. This step asks whether GitHub Actions' network is treated the
        # same way -- exactly the question fetch_onem_raw.py answered for
        # onem.be. If it 403s here too, remove this step and treat police.be
        # as a manual-download source.
        run: python scripts/fetch_police_raw.py

      - name: Upload the police.be response as a workflow artifact
        # Same reason as the ONEM artifact above: nobody has read this JSON's
        # keys, and rule 13 forbids writing a parser against a guessed shape.
        # Remove this once a real sync_police.py reads it directly.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: police-raw-response
          path: data/raw/police/
          retention-days: 14
          if-no-files-found: warn

      - name: Guard against oversized data files
        # Raised from 25 MB to 40 MB when ONEM's seven indicators x 565
        # communes x 10 years took data/communes_history.csv from 22.9 MB to
        # 32.5 MB. The threshold is a repo-health tripwire, not a technical
        # limit (GitHub warns at 50 MB), and it did its job: it caught that the
        # denormalized full-history CSV does not scale -- it repeats every
        # commune's five names, region, province and arrondissement on all
        # 163,967 rows, and communes.html fetches the whole thing IN THE
        # BROWSER. See docs/steps: that file needs the treatment
        # export_percentiles_csv.py already got (trimmed scope plus an
        # --all-periods flag for researchers), which is a Block J/K change,
        # not something to bolt onto a data load.
        run: |
          OVERSIZED=$(find data/ public/ -type f -size +40000k)
          if [ -n "$OVERSIZED" ]; then
            echo "::error::File(s) under data/ or public/ exceed 25 MB; refusing to commit:"
            echo "$OVERSIZED" | while read -r f; do echo "  $f ($(du -h "$f" | cut -f1))"; done
            exit 1
          fi

      - name: Stage data changes
        id: stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No data changes today."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with updated data
        id: pr
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          BRANCH="bot/daily-fetch-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "📊 Daily update $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "📊 Daily data update $(date -u +%Y-%m-%d)" \
            --body "Automated daily fetch of Belgian macro indicators and market data.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Pipeline outcome: macro=${{ steps.fetch_macro.outcome }}, sync=${{ steps.sync_canonical.outcome }}, market=${{ steps.fetch_stocks.outcome }}")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened $PR_URL"

      - name: Enable auto-merge
        if: steps.stage.outputs.has_changes == 'true'
        run: |
          if ! gh pr merge --auto --squash --delete-branch "${{ steps.pr.outputs.pr_url }}"; then
            echo "::error::Could not enable auto-merge on ${{ steps.pr.outputs.pr_url }} — it will NOT merge itself. Check the required 'test' check and merge manually."
            exit 1
          fi

      - name: Fail run if any source failed
        if: steps.fetch_macro.outcome == 'failure' || steps.sync_canonical.outcome == 'failure' || steps.load_geography.outcome == 'failure' || steps.sync_statbel.outcome == 'failure' || steps.sync_onem.outcome == 'failure' || steps.fetch_stocks.outcome == 'failure'
        run: |
          echo "::error::A pipeline step failed (macro=${{ steps.fetch_macro.outcome }}, sync=${{ steps.sync_canonical.outcome }}, geography=${{ steps.load_geography.outcome }}, statbel=${{ steps.sync_statbel.outcome }}, onem=${{ steps.sync_onem.outcome }}, market=${{ steps.fetch_stocks.outcome }}). Partial data was still committed; see the run log and fetch_runs/legacy_fetch_log."
          exit 1
